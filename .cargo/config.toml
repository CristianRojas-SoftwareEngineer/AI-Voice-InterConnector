# Configuración de build del workspace.
#
# `ct2rs` compila CTranslate2 desde fuente y la enlaza con el CRT estático de MSVC
# (`/MT`). Rust usa por defecto el CRT dinámico (`/MD`), lo que provoca al enlazar
# el binario de tests de `avi-translation` (ct2rs) el error `LNK2038`
# (RuntimeLibrary mismatch: `MT_StaticRelease` vs `MD_DynamicRelease`) y el fatal
# `LNK1169`. Alinear todo el workspace al CRT estático resuelve el conflicto de
# forma reproducible.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# CTranslate2 (vía `ct2rs`) se compila vía CMake con el generador multi-config
# de Visual Studio, cuyo runtime por defecto es el dinámico (`/MD`) mientras el
# workspace enlaza el CRT estático (`+crt-static` de arriba). Forzar la política
# CMP0091 (respetada a partir de CMake 3.15) junto con
# `CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded` alinea CTranslate2 al `/MT` del
# workspace y resuelve los `LNK1120` de símbolos `__imp_*` al enlazar los binarios
# de tests.
[env]
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
# El STT carga ONNX Runtime desde `ORT_DYLIB_PATH` o, sin ella, desde el
# directorio del ejecutable, donde dentro de `target/` no hay librería. Esta
# entrada apunta al directorio `ort-bundle/` de la raíz del repo, que el STT
# completa con el nombre de la librería de cada sistema. Solo rige en los
# procesos que lanza cargo (pruebas, `cargo run`, `cargo xtask`), no se
# incrusta en el binario distribuido, y una `ORT_DYLIB_PATH` exportada
# explícitamente la sustituye.
ORT_DYLIB_PATH = { value = "ort-bundle", relative = true }
# Confina los temporales de todo lo que lanza cargo (pruebas, `cargo run`,
# `cargo xtask`) dentro de `target/`. Antes, las pruebas abortadas dejaban
# sandboxes y directorios temporales en el temporal del sistema, donde nada los
# limpiaba; ahora quedan bajo `target/`, que vacían `cargo clean` y
# `cargo xtask clean`. La ruta es `target` y no `target/tmp` porque cargo no crea
# `target/tmp` antes del primer proceso hijo: con `target/` en frío el enlazador
# falla (LNK1104) al no poder escribir su temporal, mientras que cargo crea
# `target` antes de compilar. Con un intermediario del compilador
# (`RUSTC_WRAPPER`, como sccache) no basta: cargo lo invoca para consultar
# `rustc -vV` antes de crear `target`, y el intermediario aborta si su temporal
# no existe; en ese caso `target/` debe crearse antes del primer comando de cargo.
TMP = { value = "target", force = true, relative = true }
TEMP = { value = "target", force = true, relative = true }
TMPDIR = { value = "target", force = true, relative = true }
# Cómo se enlazan en Linux los runtimes de GCC que necesitan los crates C++:
# única fuente de esa política. Cada crate declara qué necesita y emite tal cual
# el valor de estas variables como petición de enlace, que rustc coloca justo
# detrás de él:
#   - `CXXSTDLIB_<target>`, la librería estándar de C++: la leen el crate `cc`
#     (`cxx`, `sentencepiece-sys`, `esaxx-rs`) y la copia vendorizada de
#     `onednn-src`.
#   - `GOMPLIB_<target>`, el runtime OpenMP de GNU: la leen las copias
#     vendorizadas de `ct2rs` y `onednn-src`, que fallan nombrándola si falta.
# Con `static:-bundle`, rustc pasa cada librería entre `-Bstatic` y `-Bdynamic`:
# el enlazador solo acepta `libstdc++.a` y `libgomp.a`, y el binario no declara
# `libstdc++.so.6`, cuya versión en el sistema puede ser más antigua que la del
# compilador, ni `libgomp.so.1`, que una instalación mínima no trae. Sin las
# `.a` el enlace falla en vez de caer en las dinámicas.
CXXSTDLIB_x86_64_unknown_linux_gnu = "static:-bundle=stdc++"
CXXSTDLIB_aarch64_unknown_linux_gnu = "static:-bundle=stdc++"
GOMPLIB_x86_64_unknown_linux_gnu = "static:-bundle=gomp"
GOMPLIB_aarch64_unknown_linux_gnu = "static:-bundle=gomp"

# Forma canónica de las tareas de desarrollo: `cargo xtask …` (ciclo 4), que
# compila y ejecuta el binario `xtask` del workspace pasándole los argumentos
# después del separador `--`.
[alias]
xtask = ["run", "-p", "xtask", "--"]
