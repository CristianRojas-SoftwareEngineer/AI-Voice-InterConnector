      - ffmpeg_save_cache:
          triple: aarch64-apple-darwin
      - sandbox_install_unix:
          artifact_glob: "ai-voice-interconnector-*-arm64-macos.tar.gz"
      - run:
          name: Emitir SHA-256 del artefacto
          command: |
            echo "[STEP] Emitir SHA-256 del artefacto - INICIO"
            shasum -a 256 artifacts/ai-voice-interconnector-*-arm64-macos.tar.gz
            echo "[STEP] Emitir SHA-256 del artefacto - FIN"
      - persist_to_workspace:
          root: artifacts
          paths:
            - ai-voice-interconnector-*-arm64-macos.tar.gz
            - ffmpeg-*-buildconf-*.txt

  # ──────────────────────────────────────────────────────────────
  # CD — publicación del GitHub Release (Rust nativo, 4 binarios)
  # ──────────────────────────────────────────────────────────────
  verify-portability:
    # Sala limpia: el artefacto Linux que se va a publicar, sin compilar nada,
    # en una imagen sin paquetes de desarrollo ni ALSA, libgomp o procps.
    # AlmaLinux 8 es el suelo de glibc (2.28) y Debian stable-slim, una
    # instalación mínima actual. Si el binario, el motor o ONNX Runtime
    # exigieran algo que el sistema base no trae, o una glibc mayor, fallan
    # aquí antes de publicar. `self install` y la comprobación de ONNX Runtime
    # se ejercen también a través del symlink instalado, que es como el usuario
    # invoca la app, y `devices` confirma que la falta de ALSA sale como
    # recurso ausente (`audio_backend_unavailable`, exit 3).
    parameters:
      image:
        type: string
      arch:
        type: enum
        enum: ["x86_64", "arm64"]
      resource_class:
        type: string
    docker:
      - image: << parameters.image >>
    resource_class: << parameters.resource_class >>
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Sala limpia del artefacto Linux << parameters.arch >>
          command: |
            echo "[STEP] Sala limpia - INICIO"
            set -euo pipefail
            # Una sola línea, sin tubería hacia `head`: con pipefail, el SIGPIPE
            # que recibe el productor al cerrarse la tubería haría fallar el paso.
            getconf GNU_LIBC_VERSION
            STAGE="$(mktemp -d)"
            tar -xzf /tmp/workspace/ai-voice-interconnector-*-<< parameters.arch >>-linux.tar.gz -C "$STAGE"
            "$STAGE/ai-voice-interconnector" --version
            # Captura previa en variable: `grep -q` cerraría la tubería antes de
            # que el binario termine de escribir.
            voice_list_out="$("$STAGE/ai-voice-interconnector" voice list)"
            printf '%s\n' "$voice_list_out" | grep -q '^  - default'
            SANDBOX="$(mktemp -d)"
            export AVI_INSTALL_DIR="$SANDBOX/program" AVI_BIN_DIR="$SANDBOX/bin" AVI_DATA_DIR="$SANDBOX/data" AVI_CACHE_DIR="$SANDBOX/cache"
            mkdir -p "$AVI_INSTALL_DIR" "$AVI_BIN_DIR" "$AVI_DATA_DIR" "$AVI_CACHE_DIR"
            # Sin --no-modify-path: es la integración de PATH la que crea el symlink
            # de AVI_BIN_DIR (el contenedor es efímero).
            "$STAGE/ai-voice-interconnector" self install --no-setup --yes
            # Por el symlink instalado: el programa debe resolver su directorio real.
            "$AVI_BIN_DIR/ai-voice-interconnector" --version
            # `doctor` falla sin modelos provisionados; lo que se exige aquí es su
            # comprobación `onnx_runtime`, que carga la librería empaquetada. El
            # JSON sale con sangría y las claves de cada comprobación ordenadas
            # (`detail`, `name`, `ok`).
            doctor_out="$("$AVI_BIN_DIR/ai-voice-interconnector" --json doctor || true)"
            printf '%s\n' "$doctor_out"
            onnx_check="$(printf '%s\n' "$doctor_out" | grep -A1 '"name": "onnx_runtime",')"
            case "$onnx_check" in
              *'"ok": true'*) echo "onnx_runtime: OK" ;;
              *) echo "la comprobación onnx_runtime de doctor no pasó" >&2; exit 1 ;;
            esac
            # La imagen no trae ALSA (`libasound.so.2`), así que el sistema no
            # tiene backend de audio: `devices` debe arrancar igual y fallar con
            # el recurso ausente `audio_backend_unavailable`, que sale con exit 3,
            # y no con un fallo del producto. No necesita modelos.
            devices_code=0
            devices_out="$("$AVI_BIN_DIR/ai-voice-interconnector" --json devices)" || devices_code=$?
            printf '%s\n' "$devices_out"
            if [ "$devices_code" -ne 3 ]; then
              echo "devices sin ALSA debe salir con exit 3, salió con $devices_code" >&2; exit 1
            fi
            printf '%s\n' "$devices_out" | grep -q '"reason": *"audio_backend_unavailable"'
            echo "[STEP] Sala limpia - FIN"

  # ──────────────────────────────────────────────────────────────
  publish-release:
    # Recolecta los 4 archivos del paquete y las configuraciones de build de FFmpeg
    # que persisten los jobs de build (no `gh run download`: determinista, sin token
    # API CircleCI), descarga las fuentes de FFmpeg verificadas contra los hashes de
    # `packaging/pins.json`, genera SHA256SUMS.txt y publica el GitHub Release directo
    # (sin borrador). Usa la imagen con Rust porque el pie de las notas y las fuentes
    # salen de `cargo xtask`. Solo en tags v*.
    # Requiere context `github-release` con GH_TOKEN (contents:write).
    docker:
      # Mismo pin por digest que publish-metadata y validate-licenses.
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      - cache_root
      - attach_workspace:
          at: artifacts
      # Caché: registry + target/ de la variante xtask, que guarda
      # validate-licenses; `xtask` solo recompila los crates propios, sin sccache.
      - cargo_restore_caches:
          os: linux
          variant: xtask
      - validate_pins
      - validate_features
      - install_gh_cli
      - run:
          name: Estampar la versión del tag en los bootstrap
          command: |
            echo "[STEP] Estampar la versión en los bootstrap - INICIO"
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            for f in packaging/bootstrap/install.sh packaging/bootstrap/install.ps1; do
              count="$(grep -c "__AVI_STAMPED_VERSION__" "$f" || true)"
              if [ "$count" != "1" ]; then
                echo "ERROR: se esperaba exactamente un marcador en $f (hay $count)" >&2
                exit 1
              fi
              sed -i "s/__AVI_STAMPED_VERSION__/${VERSION}/" "$f"
              if grep -q "__AVI_STAMPED_VERSION__" "$f"; then
                echo "ERROR: marcador residual en $f tras estampar" >&2
                exit 1
              fi
              echo "Estampado $f con $VERSION"
            done
            echo "[STEP] Estampar la versión en los bootstrap - FIN"
      - run:
          name: Descargar y verificar las fuentes de FFmpeg
          command: |
            echo "[STEP] Descargar fuentes de FFmpeg - INICIO"
            set -euo pipefail
            cargo --quiet xtask ffmpeg --sources artifacts
            echo "[STEP] Descargar fuentes de FFmpeg - FIN"
      - run:
          name: Generar SHA256SUMS.txt sobre artefactos del workspace
          command: |
            echo "[STEP] Generar SHA256SUMS.txt - INICIO"
            set -euo pipefail
            cp packaging/bootstrap/install.sh packaging/bootstrap/install.ps1 artifacts/
            cd artifacts
            sha256sum ai-voice-interconnector-* ffmpeg-* install.sh install.ps1 > SHA256SUMS.txt
            cat SHA256SUMS.txt
            echo "Artefactos recolectados:"
            ls -lh ai-voice-interconnector-* ffmpeg-* install.sh install.ps1 SHA256SUMS.txt
            echo "[STEP] Generar SHA256SUMS.txt - FIN"
      - run:
          name: Extraer notas de release desde CHANGELOG
          command: |
            echo "[STEP] Extraer notas de release desde CHANGELOG - INICIO"
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            awk -v ver="## [$VERSION]" '
              index($0, ver) == 1 { grab=1; print; next }
              grab && /^## \[/ { exit }
              grab && /^\[[^][]*\]:/ { exit }
              grab { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "ERROR: no se encontró la sección [$VERSION] en CHANGELOG.md" >&2
              exit 1
            fi
            cat notes.md
            echo "[STEP] Extraer notas de release desde CHANGELOG - FIN"
      - run:
          name: Anexar pie de fuente MPL-2.0 a notas
          command: |
            echo "[STEP] Anexar pie de fuente MPL-2.0 - INICIO"
            set -euo pipefail
            cargo --quiet xtask source-offer --notes "$CIRCLE_TAG" >> notes.md
            echo "[STEP] Anexar pie de fuente MPL-2.0 - FIN"
      - run:
          name: Publicar GitHub Release (artefactos + SHA256SUMS)
          command: |
            echo "[STEP] Publicar GitHub Release - INICIO"
            set -euo pipefail
            gh release create "$CIRCLE_TAG" \
              artifacts/ai-voice-interconnector-* artifacts/ffmpeg-* artifacts/install.sh artifacts/install.ps1 artifacts/SHA256SUMS.txt \
              --title "$CIRCLE_TAG" \
              --notes-file notes.md
            echo "[STEP] Publicar GitHub Release - FIN"

  publish-metadata:
    # Actualiza el Cask de Homebrew tras cada Release (solo macOS). Requiere
    # contexts `github-release` y `homebrew-tap`. El Cask inicial es bootstrap
    # manual. `cargo xtask cask` genera un `binary` stanza sobre el tar.gz de
    # macOS (`*-arm64-macos.tar.gz`): Homebrew autoextrae el archivo y enlaza
    # `ai-voice-interconnector` desde la raíz del staged_path.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      - cache_root
      # Caché: registry + target/ de la variante xtask, que guarda
      # validate-licenses; `xtask` solo recompila los crates propios, sin sccache.
      - cargo_restore_caches:
          os: linux
          variant: xtask
      - validate_pins
      - validate_features
      - install_gh_cli:
          extra_packages: "git ruby"
      - run:
          name: Descargar SHA256SUMS.txt del release recién publicado
          command: |
            echo "[STEP] Descargar SHA256SUMS.txt del release - INICIO"
            set -euo pipefail
            gh release download "$CIRCLE_TAG" -R "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              -p SHA256SUMS.txt --dir /tmp/release-metadata
            cat /tmp/release-metadata/SHA256SUMS.txt
            echo "[STEP] Descargar SHA256SUMS.txt del release - FIN"
      - run:
          name: Renderizar Casks/ai-voice-interconnector.rb
          command: |
            echo "[STEP] Renderizar Cask - INICIO"
            set -euo pipefail
            cargo --quiet xtask cask \
              --tag "$CIRCLE_TAG" \
              --sums-file /tmp/release-metadata/SHA256SUMS.txt \
              --out /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            cat /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            echo "[STEP] Renderizar Cask - FIN"
      - run:
          name: Verificar sintaxis del Cask (ruby -c)
          command: |
            echo "[STEP] Verificar sintaxis del Cask - INICIO"
            ruby -c /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            echo "[STEP] Verificar sintaxis del Cask - FIN"
      - run:
          name: Clonar tap de Homebrew
          command: |
            echo "[STEP] Clonar tap de Homebrew - INICIO"
            set -euo pipefail
            RENDERED="/tmp/tap-clone/Casks/ai-voice-interconnector.rb"
            git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/CristianRojas-SoftwareEngineer/homebrew-ai-voice-interconnector.git" /tmp/tap-repo
            mkdir -p /tmp/tap-repo/Casks
            cp "$RENDERED" /tmp/tap-repo/Casks/ai-voice-interconnector.rb
            echo "[STEP] Clonar tap de Homebrew - FIN"
      - run:
          name: Commitear Cask y empujar al tap
          command: |
            echo "[STEP] Commitear Cask y empujar al tap - INICIO"
            set -euo pipefail
            cd /tmp/tap-repo
            git config user.name "ai-voice-interconnector-ci"
            git config user.email "ci@ai-voice-interconnector.invalid"
            git add Casks/ai-voice-interconnector.rb
            if git diff --cached --quiet; then
              echo "Cask sin cambios (regeneración idempotente); nada que empujar."
            else
              git commit -m "Cask: actualizar a ${CIRCLE_TAG}"
              git push origin HEAD:main
            fi
            echo "[STEP] Commitear Cask y empujar al tap - FIN"

# ══════════════════════════════════════════════════════════════════════
# UN pipeline de release (`build-all`), disparado SOLO en tags `v*`:
#
#   La triple puerta de tests por plataforma (test-linux/windows/macos) corre
#   como gate mecánico de publish-release DENTRO de esta misma pipeline. Así la
#   publicación (publish-release, irreversible) queda condicionada al resultado
#   completo de la suite sobre el commit taggeado, sin depender de disciplina
#   humana ni de una pipeline de rama que corra en paralelo: CircleCI no puede
#   encadenar pipelines distintas, de modo que la única garantía mecánica es
#   tener los tests en el grafo de dependencias del release.
#
#   `coverage`, instaladores y licencias/changelog completan los gates de
#   publish-release. Los 4 builds nativos, que compilan las 4 plataformas en
#   modo release, no consumen nada de los gates y arrancan en paralelo con
#   ellos: si un test falla, los builds ya se habrán ejecutado, pero nada se
#   publica.
# ══════════════════════════════════════════════════════════════════════
workflows:
  # Ningún job declara versión, URL ni hash de FFmpeg: los cuatro jobs de prueba
  # lo aprovisionan con `cargo xtask ffmpeg` desde packaging/pins.json, y los
  # build-* lo hacen por el mismo camino dentro de `xtask package`, así que las
  # pruebas y los cuatro targets distribuidos ejercitan el mismo artefacto
  # fijado y verificado por su SHA-256.

  # ── Pipeline de RELEASE: tests (gate) + empaquetado + publicación en tags `v*` ──
  build-all:
    # CircleCI NO ejecuta un job en un tag salvo que el job Y todas sus
    # dependencias declaren `filters.tags`; por eso el filtro `v*` se propaga
    # por toda la cadena (tests/gates y builds → publish-*).
    # Todos los jobs declaran además `branches: ignore /.*/`: esta pipeline corre
    # SOLO en tags `v*`, nunca en pushes de rama.
    jobs:
      # ── Triple suite (gate) + cobertura + instaladores + licencias ──
      # publish-release requiere estos 8 gates verdes en la misma pipeline.
      - validate-licenses:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-linux:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - coverage:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-bootstrap-linux:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-bootstrap-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-bootstrap-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      # ── Builds nativos Rust (sin requisitos: corren en paralelo con los gates) ──
      - build-windows-x64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-linux-x64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-linux-arm64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-darwin-arm64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      # ── Verificación de portabilidad de los artefactos Linux (AlmaLinux 8 y Debian stable-slim) ──
      # Entradas explícitas (sin matriz): el `name` no puede derivar una etiqueta
      # corta de `matrix.image` (trae el digest) y dos listas paralelas harían
      # producto cartesiano; 4 entradas fijas son más líneas pero nombres exactos.
      - verify-portability:
          name: verify-portability-x64-alma8
          arch: x86_64
          image: almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe
          resource_class: medium
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build-linux-x64
      - verify-portability:
          name: verify-portability-x64-debian
          arch: x86_64
          image: debian:stable-slim@sha256:eb593cf2c358cacef45ca0a424bbc7d30cfa3466265fc2662b9466a0ca6ba1c5
          resource_class: medium
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build-linux-x64
      - verify-portability:
          name: verify-portability-arm64-alma8
          arch: arm64
          image: almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe
          resource_class: arm.medium
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build-linux-arm64
      - verify-portability:
          name: verify-portability-arm64-debian
          arch: arm64
          image: debian:stable-slim@sha256:eb593cf2c358cacef45ca0a424bbc7d30cfa3466265fc2662b9466a0ca6ba1c5
          resource_class: arm.medium
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build-linux-arm64
      # ── Publicación — solo en tags v* ──
      - publish-release:
          context:
            - github-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          # Única puerta de la publicación: exige los 8 gates de prueba y
          # validación, los 4 builds y las 4 verificaciones de portabilidad. Los
          # builds no esperan a los gates, así que un test fallido no impide
          # compilar, pero sí publicar.
          requires:
            - test-linux
            - test-windows
            - test-macos
            - coverage
            - test-bootstrap-linux
            - test-bootstrap-windows
            - test-bootstrap-macos
            - validate-licenses
            - build-windows-x64
            - build-linux-x64
            - build-linux-arm64
            - build-darwin-arm64
            - verify-portability-x64-alma8
            - verify-portability-x64-debian
            - verify-portability-arm64-alma8
            - verify-portability-arm64-debian
      - publish-metadata:
          context:
            - github-release
            - homebrew-tap
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - publish-release

