  build-darwin-arm64:
    # macOS ARM64 (Apple Silicon, Xcode 26.4.0): clang nativo, sin cross.
    # El binario se valida con smoke test version + voice list (no carga modelo).
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
      # Versión mínima de macOS del artefacto: macOS 26 (Tahoe), la más antigua
      # con actualizaciones de seguridad que no es la siguiente en perderlas, y
      # que corre en todos los Mac con Apple Silicon (M1 en adelante). La leen
      # rustc, el crate `cc`, CMake y el clang del Makefile del motor, así que
      # todo lo que se compila aquí declara ese mínimo; sin ella cada pieza
      # tomaría su propio valor por defecto (el del SDK o el de rustc).
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - checkout
      - cache_root
      - toolchain_restore_cache:
          os: macos
      - install_rust_macos
      - toolchain_save_cache:
          os: macos
      - run:
          name: Instalar dependencias de sistema (cmake, make)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
            cmake --version
            # make y gcc/clang (el Makefile de qwen_tts invoca `gcc`, que en macOS
            # resuelve al shim de Apple clang) vienen con el toolchain de Xcode;
            # se verifica su presencia antes de `make blas` (BLAS = Accelerate,
            # sin dependencia por brew).
            make --version
            gcc --version
            echo "[STEP] Instalar dependencias de sistema - FIN"
      # NOTA: sin libomp — con --features full este build sí compila ct2rs, que
      # usa OPENMP_RUNTIME=NONE en macOS (features por target en
      # avi-translation/Cargo.toml): Apple clang no trae libomp y
      # find_package(OpenMP REQUIRED) fallaba (#2/#4).
      - cargo_restore_caches:
          os: macos
          variant: full
      - cargo_fetch
      - cargo_save_registry
      - sccache_restore_cache:
          os: macos
          variant: full
      - sccache_setup_unix
      - native_sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Compilar binario release (--features full)
          no_output_timeout: 25m
          command: |
            echo "[STEP] Compilar binario release (cargo build --release) - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            # --timings: desglose por crate en target/cargo-timings. Se vacía
            # antes (la caché de target/ puede traer informes de otra corrida) y
            # se mueve fuera de target/ al terminar, para que la caché no los
            # guarde y la limpieza de target/ no compita con su subida.
            rm -rf -- target/cargo-timings
            cargo build --release --features full --verbose --timings
            mv target/cargo-timings cargo-timings
            echo "[STEP] Compilar binario release (cargo build --release) - FIN"
      - store_artifacts:
          path: cargo-timings
          destination: cargo-timings
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            sccache --show-stats
      - smoke_test_unix:
          label: "macOS ARM64"
      - tts_engine_cachekey
      - restore_cache:
          keys:
            - tts-v1-{{ checksum ".cache-root" }}-macos-{{ arch }}-{{ checksum "vendor/qwen3-tts/.engine-cachekey" }}
      - run:
          # Interfaz uniforme (los 4 SO): `xtask build-engine` oculta el mecanismo
          # por plataforma (make + framework Accelerate en macOS), centraliza la
          # política SIMD (SIMD=auto -> Makefile) y compila + verifica (--self-test,
          # oráculo de kernels sin pesos) en un solo paso.
          # Cacheado como en Windows: si el binario existe tras el restore
          # (clave exacta sin fallback), es fresco y solo se verifica.
          name: Compilar motor TTS (make blas + --self-test)
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "[STEP] Compilar y verificar motor TTS - INICIO"
            set -euo pipefail
            if [ -x vendor/qwen3-tts/qwen_tts ]; then
              echo "Motor TTS restaurado de caché; se ejecuta --self-test directo"
              ./vendor/qwen3-tts/qwen_tts --self-test
            else
              cargo xtask build-engine --self-test
            fi
            echo "[STEP] Compilar y verificar motor TTS - FIN"
      - save_cache:
          key: tts-v1-{{ checksum ".cache-root" }}-macos-{{ arch }}-{{ checksum "vendor/qwen3-tts/.engine-cachekey" }}
          paths:
            - vendor/qwen3-tts/qwen_tts
          when: on_success
      - cargo_save_target:
          os: macos
          variant: full
      - sccache_save_cache:
          os: macos
          variant: full
      # `ort-bundle/` lo arma y verifica `xtask package` (SHA-256 fijado en
      # pins.json + marcador `.ort-version`): la caché solo evita repetir la
      # descarga; sin acierto se vuelve a descargar.
      - restore_cache:
          keys:
            - ort-v4-{{ checksum ".cache-root" }}-darwin-arm64-<< pipeline.parameters.ort_pin >>
      - ffmpeg_restore_cache:
          triple: aarch64-apple-darwin
      - run:
          # Empaquetado canónico: `xtask package` monta el bundle desde
          # packaging/bundle-manifest.json (la misma lista que valida
          # `self install`), aborta si VERSION != tag y audita que ningún
          # binario del bundle declare un `minos` por encima del `min_os`
          # del manifiesto ni importe nada fuera de libSystem, /usr/lib y
          # los frameworks de /System.
          name: Empaquetar bundle con xtask package
          command: |
            echo "[STEP] Empaquetar bundle con xtask package - INICIO"
            set -euo pipefail
            cargo xtask package --expect-version "${CIRCLE_TAG#v}"
            echo "[STEP] Empaquetar bundle con xtask package - FIN"
      - save_cache:
          key: ort-v4-{{ checksum ".cache-root" }}-darwin-arm64-<< pipeline.parameters.ort_pin >>
          paths:
