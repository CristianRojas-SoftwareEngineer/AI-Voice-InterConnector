# Pipeline CircleCI Tier 1 — Rust nativo 3 SO (Linux/Windows/macOS)
# Triple puerta `cargo test --all` + `coverage` como gate de los 4 builds nativos.
# Un único workflow `build-all` (release, SOLO en tags v*); no hay gates de rama
# en CI: la validación previa al tag (fmt/clippy/test) se documenta en docs/BUILD.md.
# Artefactos: archivos comprimidos (tar.gz/zip) con binario Rust + documentos de
# licencia, versionados vía `persist_to_workspace` → `publish-release`.
# Pines reproducibles: `rust_version` + `ort_version` + digest de `cimg/rust` (ver §Reproducibilidad).
# Ver docs/BUILD.md §4 para arquitectura completa y docs/proposals/progress.md:340-346 para Fase 7.

version: 2.1

orbs:
  win: circleci/windows@5.0

# Fuente única de pines de toolchain Rust. Esta versión se interpola con
# << pipeline.parameters.rust_version >> en cada job Rust (no repetir literal).
# Bump de versión = editar solo aquí + actualizar digest de `cimg/rust` en las
# 4 referencias `image:` (obtenido vía `docker buildx imagetools inspect
# cimg/rust:<< pipeline.parameters.rust_version >>` o hub.docker.com, ver
# docs/BUILD.md §Reproducibilidad). Sin digest, el tag es flotante y pierde
# reproducibilidad; el digest congela el SO base + toolchain.
parameters:
  rust_version:
    type: string
    default: "1.96.0"
    description: >
      Versión exacta de Rust (toolchain) usada en todos los jobs Rust
      (cargo test/build). Espejo entre plataformas (Linux/Windows/macOS).
  # Pines del toolchain C del motor TTS en Windows (MSYS2 UCRT64). Fuente única,
  # espejo de las versiones tabuladas en docs/BUILD.md §9. El release base fija un
  # snapshot reproducible; la caché de C:\msys64 (msys2_*_cache) es el mecanismo de
  # determinismo, y el assert de gcc en el bootstrap ataja el drift upstream en
  # caché fría. Bump = editar aquí (invalida la caché por clave) + docs/BUILD.md §9.
  msys2_base_release:
    type: string
    default: "2026-06-11"
    description: >
      Release del instalador base de MSYS2 (github.com/msys2/msys2-installer) del
      que se extrae C:\msys64. Debe ser posterior a la publicación de gcc del pin.
  msys2_gcc_version:
    type: string
    default: "16.2.0"
    description: Versión de gcc UCRT64 (ancla de la GCC Runtime Library Exception).
  msys2_openblas_version:
    type: string
    default: "0.3.34-1"
    description: Versión de mingw-w64-ucrt-x86_64-openblas.
  msys2_make_version:
    type: string
    default: "4.4.1-5"
    description: Versión de make/mingw32-make (mingw-w64-ucrt-x86_64-make).
  ort_version:
    type: string
    default: "1.28.0"
    description: Versión de ONNX Runtime (pareja de ort 2.0.0-rc.13) empaquetada en los 4 builds.

# Cachés duales compartidas por todos los jobs Rust (restore/save nativos,
# idénticos en bash y PowerShell). Separadas porque invalidan distinto:
# registry solo cambia con Cargo.lock; target además con el código.
#
# Clave normalizada (namespace v2): la clave exacta de registry/target/ se computa
# del checksum de `Cargo.lock.cachekey`, un lock efímero que genera
# `xtask cache-key` neutralizando la línea `version` del propio crate. Sin esto, el
# checksum de `Cargo.lock` cambia en CADA release (bump de versión) aunque las deps
# no varíen: nunca hay acierto exacto y todo cae al frágil fallback por prefijo. Con
# la normalización la clave solo cambia ante cambios REALES de dependencias.
# Matriz de invalidación por familia de caché:
#   - registry/target (v2): cambian solo con dependencias reales en Cargo.lock.
#   - toolchain (v1): cambia con rust_version. NO se re-keya: su semántica no cambia.
#   - msys2 (v1): cambia con los pines de versión MSYS2. NO se re-keya.
#   - sccache (v1): rolling con epoch. NO se re-keya.
#   - ort-bundle (v1): cambia con ort_version (<< pipeline.parameters.ort_version >>).
#   - tts (v1): cambia con checksum de vendor/qwen3-tts/.engine-cachekey + msys2 gcc/openblas.
commands:
  cargo_restore_caches:
    description: Restaura caché de registry/git y de target/ (con fallback parcial)
    # `variant` discrimina el feature set del target/ (test featureless, full con
    # C++, cov instrumentado): sin él, jobs de distinta variante colisionan en una
    # clave inmutable (first-write-wins) y se envenenan mutuamente. El registry
    # (cargo-v2-…) NO lleva variante: es independiente del feature set.
    # `os` discrimina el sistema operativo: target/ es triple-específico
    # (x86_64-unknown-linux-gnu vs x86_64-pc-windows-msvc vs aarch64-apple-darwin)
    # y sin él Linux/Windows/macOS se pisan mutuamente (0% sccache hits en Windows).
    parameters:
      variant:
        type: string
        default: "test"
      os:
        type: string
        default: "linux"
    steps:
      # Genera Cargo.lock.cachekey ANTES de restore_cache: la clave de CircleCI se
      # forma en tiempo de config, así que el insumo del checksum debe existir en el
      # working dir antes de restaurar. `shell: bash` está disponible en los tres
      # executors (nativo Linux/macOS, Git-bash en el orb de Windows) y `perl`
      # viene bundleado con Git-bash (presente también en los SO *nix). Generar la
      # clave con un transform de texto evita compilar xtask (y su árbol, que en
      # Windows tira de windows-sys/raw-dylib y necesita dlltool.exe, ausente antes
      # de instalar MSYS2) desde cero en cada job. Un único mecanismo cross-platform,
      # sin ramas por shell (ver Objetivo 2 del plan de clave estable).
      - run:
          name: Generar Cargo.lock.cachekey (clave de caché normalizada)
          shell: bash
          command: perl -0777 -pe 's/(name = "ai-voice-interconnector"\nversion = ")[^"]+/${1}0.0.0/' Cargo.lock > Cargo.lock.cachekey
      - restore_cache:
          keys:
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_version >>-{{ checksum "Cargo.lock.cachekey" }}
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_version >>-
      - restore_cache:
          keys:
            - target-v2-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>-<< parameters.variant >>-{{ checksum "Cargo.lock.cachekey" }}
            - target-v2-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>-<< parameters.variant >>-
  cargo_save_registry:
    description: Guarda registry/git antes de compilar (un fallo de test no pierde descargas)
    steps:
      - save_cache:
          key: cargo-v2-{{ arch }}-<< pipeline.parameters.rust_version >>-{{ checksum "Cargo.lock.cachekey" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
  cargo_save_target:
    description: Guarda target/ siempre (when always) — el parcial acelera el re-run
    # `variant` debe coincidir con el pasado a cargo_restore_caches en el mismo job.
    # `os` debe coincidir también: target/ es OS-específico.
    # Solo para jobs build-* (variant full); test-*/coverage usan solo sccache.
    # Determinismo de release: los jobs build-* corren `cargo clean --release` antes
    # de `cargo build --release` sobre tags v*, invalidando target/release de forma
    # explícita. La key target-v2-... ({arch}-{os}·{rust_version}-{variant}-{checksum
    # Cargo.lock.cachekey}) sigue discriminando por variant+lock, pero el clean previo
    # garantiza que el binary empaquetado se linkea desde el checkout del tag, no de
    # una cache cross-release (el perl `Cargo.lock.cachekey` neutraliza el bump de
    # versión del crate raíz, por lo que la key no cambia entre releases sin bumps de
    # dependencias → sin el clean el binary sería stale, omitiendo campos como
    # `version` en `version --json`). La cache de target/ salva acelerar re-runs en
    # el MISMO commit/tag; sccache persiste por separado para objetos .o.
    parameters:
      variant:
        type: string
        default: "test"
      os:
        type: string
        default: "linux"
    steps:
      - save_cache:
          key: target-v2-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>-<< parameters.variant >>-{{ checksum "Cargo.lock.cachekey" }}
          paths:
            - target
          when: always

  cargo_restore_registry:
    description: Restaura solo registry/git (sin target) — para test-*/coverage donde sccache es suficiente
    steps:
      - run:
          name: Generar Cargo.lock.cachekey (clave de caché normalizada)
          shell: bash
          command: perl -0777 -pe 's/(name = "ai-voice-interconnector"\nversion = ")[^"]+/${1}0.0.0/' Cargo.lock > Cargo.lock.cachekey
      - restore_cache:
          keys:
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_version >>-{{ checksum "Cargo.lock.cachekey" }}
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_version >>-

  # Caché de toolchain (R3): ~/.rustup (toolchain + componentes) y ~/.cargo/bin
  # (binarios instalados: rustup, cargo, cargo-llvm-cov). Clave sin checksum —
  # solo depende de arch + rust_version — así que es inmutable y se reconstruye
  # al bumpear rust_version. Evita rustup-init (Win/macOS) y el `cargo install
  # cargo-llvm-cov --locked` (coverage) en cada corrida.
  toolchain_restore_cache:
    description: Restaura ~/.rustup y ~/.cargo/bin por arch + rust_version + OS
    parameters:
      os:
        type: string
        default: "linux"
    steps:
      - restore_cache:
          keys:
            - toolchain-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>
  toolchain_save_cache:
    description: Guarda ~/.rustup y ~/.cargo/bin (clave inmutable por arch + rust_version + OS)
    parameters:
      os:
        type: string
        default: "linux"
    steps:
      - save_cache:
          key: toolchain-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>
          paths:
            - ~/.rustup
            - ~/.cargo/bin

  # Caché del toolchain C del motor TTS en Windows (MSYS2 UCRT64 en C:\msys64).
  # Espejo de toolchain_*_cache pero solo-Windows: clave inmutable por arch + los
  # pines de versión (release base + gcc/openblas/make), así un bump de pin
  # invalida la caché y reconstruye. Es el mecanismo de determinismo del release.
  msys2_restore_cache:
    description: Restaura C:\msys64 por arch + pines de versión MSYS2
    steps:
      - restore_cache:
          keys:
            - msys2-v1-{{ arch }}-<< pipeline.parameters.msys2_base_release >>-gcc<< pipeline.parameters.msys2_gcc_version >>-ob<< pipeline.parameters.msys2_openblas_version >>-make<< pipeline.parameters.msys2_make_version >>
  msys2_save_cache:
    description: Guarda C:\msys64 (clave inmutable por arch + pines de versión MSYS2)
    steps:
      - save_cache:
          key: msys2-v1-{{ arch }}-<< pipeline.parameters.msys2_base_release >>-gcc<< pipeline.parameters.msys2_gcc_version >>-ob<< pipeline.parameters.msys2_openblas_version >>-make<< pipeline.parameters.msys2_make_version >>
          paths:
            - C:\msys64

  # sccache (R2): envuelve `rustc` (RUSTC_WRAPPER) y cachea objetos Rust por
  # hash de contenido en ~/.cache/sccache. Reutiliza artefactos entre corridas y
  # entre variantes (test/full/cov), sobreviviendo a bumps de Cargo.lock que
  # invalidan target/. NO acelera los builds CMake de CTranslate2 (ct2rs)
  # (sccache no envuelve el C++), solo la parte Rust. Clave de caché rolling:
  # guarda con {{ epoch }} (siempre escribe) y restaura por prefijo (último
  # estado del mismo arch+toolchain).
  sccache_restore_cache:
    description: Restaura el directorio de sccache (rolling, fallback por prefijo, OS-específico)
    parameters:
      os:
        type: string
        default: "linux"
    steps:
      - restore_cache:
          keys:
            - sccache-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>-
  sccache_save_cache:
    description: Guarda el directorio de sccache (clave rolling con epoch, OS-específico)
    parameters:
      os:
        type: string
        default: "linux"
    steps:
      - save_cache:
          key: sccache-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>-{{ epoch }}
          paths:
            - ~/.cache/sccache
          when: always

  sccache_save_cache_conditional:
    description: Guarda sccache solo si hit <85% — evita upload 1 GiB/57s en Windows cuando hit 88% (pagas 30-40s por tag sin beneficio)
    parameters:
      os:
        type: string
        default: "linux"
    steps:
      - run:
          name: Decidir guardado sccache por hit-rate
          shell: bash
          command: |
            echo "[STEP] Decidir guardado sccache por hit-rate - INICIO"
            # sccache está en PATH tras sccache_setup; en Windows también (cargo bin)
            if ! command -v sccache >/dev/null 2>&1; then
              if [ -x "$HOME/.cargo/bin/sccache" ]; then export PATH="$HOME/.cargo/bin:$PATH"; fi
              if [ -x "$USERPROFILE\\.cargo\\bin\\sccache.exe" ]; then export PATH="$USERPROFILE\\.cargo\\bin:$PATH"; fi
            fi
            STATS=$(sccache --show-stats 2>&1 || true)
            echo "$STATS"
            HIT=$(echo "$STATS" | grep -E "Cache hits rate" | head -1 | sed -E 's/.* ([0-9.]+) %.*/\1/')
            if [ -z "$HIT" ]; then HIT=0; fi
            echo "Hit-rate detectado: $HIT%"
            # python para comparar float portable (bash no tiene float)
            if python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) < 85 else 1)" "$HIT" 2>/dev/null || python -c "import sys; sys.exit(0 if float(sys.argv[1]) < 85 else 1)" "$HIT"; then
              echo "Hit $HIT% <85% → se guardará sccache (aporta)"
            else
              echo "Hit $HIT% >=85% → se omite guardado sccache (ahorra ~50s upload 1 GiB, hit ya alto)"
              # Vaciar para que save_cache suba ~KB en vez de 1 GiB (cuando save_cache corre, sube vacío)
              rm -rf ~/.cache/sccache/* 2>/dev/null || true
              rm -rf "$USERPROFILE/.cache/sccache/"* 2>/dev/null || true
              rm -rf "$HOME/.cache/sccache/"* 2>/dev/null || true
            fi
            echo "[STEP] Decidir guardado sccache por hit-rate - FIN"
      - save_cache:
          key: sccache-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_version >>-{{ epoch }}
          paths:
            - ~/.cache/sccache
          when: always

  sccache_setup_unix:
    description: Instala sccache (pin) y lo activa como RUSTC_WRAPPER (bash)
    steps:
      - run:
          name: Configurar sccache (RUSTC_WRAPPER)
          command: |
            echo "[STEP] Configurar sccache - INICIO"
            SCCACHE_VERSION="0.8.2"
            if ! command -v sccache >/dev/null 2>&1; then
              case "$(uname -m)" in
                x86_64|amd64) SCCACHE_ARCH="x86_64" ;;
                aarch64|arm64) SCCACHE_ARCH="aarch64" ;;
                *) echo "arch no soportada por sccache: $(uname -m)" >&2; exit 1 ;;
              esac
              case "$(uname -s)" in
                Linux) SCCACHE_TRIPLE="${SCCACHE_ARCH}-unknown-linux-musl" ;;
                Darwin) SCCACHE_TRIPLE="${SCCACHE_ARCH}-apple-darwin" ;;
                *) echo "SO no soportado por sccache: $(uname -s)" >&2; exit 1 ;;
              esac
              SCCACHE_PKG="sccache-v${SCCACHE_VERSION}-${SCCACHE_TRIPLE}"
              curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${SCCACHE_PKG}.tar.gz" -o /tmp/sccache.tar.gz
              tar -xzf /tmp/sccache.tar.gz -C /tmp
              sudo install -m 755 "/tmp/${SCCACHE_PKG}/sccache" /usr/local/bin/sccache
            fi
            # Persistir env a $BASH_ENV para los steps de compilación siguientes.
            # CARGO_INCREMENTAL=0: sccache no cachea con compilación incremental.
            echo 'export RUSTC_WRAPPER=sccache' >> "$BASH_ENV"
            echo 'export SCCACHE_DIR=$HOME/.cache/sccache' >> "$BASH_ENV"
            echo 'export CARGO_INCREMENTAL=0' >> "$BASH_ENV"
            sccache --version
            echo "[STEP] Configurar sccache - FIN"
  sccache_setup_windows:
    description: Instala sccache (pin) como RUSTC_WRAPPER (PowerShell)
    steps:
      - run:
          name: Configurar sccache (RUSTC_WRAPPER)
          command: |
            Write-Host "[STEP] Configurar sccache - INICIO"
            $ErrorActionPreference = "Stop"
            $SccacheVersion = "0.8.2"
            $Pkg = "sccache-v$SccacheVersion-x86_64-pc-windows-msvc"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # sccache.exe en ~/.cargo/bin (en PATH). PowerShell no tiene $BASH_ENV:
            # los steps de compilación exportan RUSTC_WRAPPER/SCCACHE_DIR inline.
            $Dest = "$env:USERPROFILE\.cargo\bin\sccache.exe"
            if (-not (Test-Path $Dest)) {
              # Asegura ~/.cargo/bin: el destino de sccache puede no existir aún
              # (p. ej. si rustup instaló en un perfil distinto). Copy-Item no
              # crea directorios intermedios y fallaría con DirectoryNotFound.
              New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cargo\bin" | Out-Null
              Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/v$SccacheVersion/$Pkg.tar.gz" -OutFile "$env:TEMP\sccache.tar.gz"
              tar -xzf "$env:TEMP\sccache.tar.gz" -C "$env:TEMP"
              Copy-Item "$env:TEMP\$Pkg\sccache.exe" $Dest -Force
            }
            & $Dest --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Configurar sccache - FIN"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gate Rust — triple puerta simétrica (cargo test --all)
  # ──────────────────────────────────────────────────────────────
  test-linux:
    # Executor x86_64 Docker con Rust preinstalado. La suite es
    # arch-independiente y mockea el engine (Parakeet/Qwen no se ejercitan),
    # así que re-correrla en ARM64 no aportaría señal (ver docs/BUILD.md §4).
    # Es la arquitectura más barata/rápida disponible.
    # Caché heterogénea: en Linux target 375 MiB 8s ahorra 50s de compile vs sccache 15% hit,
    # coste 8s < beneficio 50s; en Windows el mismo target costaría 258s y pierde.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463 # digest del índice multi-arch de 1.96.0 (ver parameters.rust_version)
    resource_class: medium
    steps:
      - checkout
      - run:
          # libasound2-dev + pkg-config exponen ALSA a cpal (sí se compila en la
          # suite). libclang-dev (bindgen/ct2rs, solo con native-translation) ya
          # NO se ejercita con native-stt/native-translation off (la suite no
          # compila C++); se conserva por simetría con coverage y con los build-*,
          # que activan --features full. Contexto histórico: sin libclang-dev el
          # build-script moría con «Unable to find libclang» (pipeline #2).
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_registry
      - run:
          name: Verificar toolchain Rust
          command: |
            echo "[STEP] Verificar toolchain Rust - INICIO"
            rustc --version
            cargo --version
            echo "rust_version parámetro: << pipeline.parameters.rust_version >>"
            echo "[STEP] Verificar toolchain Rust - FIN"
      - run:
          # Descarga TODAS las deps al registry antes de guardar su caché:
          # un fallo posterior de test no pierde las descargas.
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            cargo test --all --verbose
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats

  test-windows:
    # Suite Rust en Windows nativo (cargo test --all). Puerta simétrica con
    # test-linux/macos: valida código específico de Windows (winsound, tray)
    # antes de compilar. Sin este gate, bugs de Windows solo se verían en build.
    # Caché: registry + sccache (sin target) — elimina el artefacto derivado
    # 770 MiB restore / 831 MiB save (235s upload NTFS) que dominaba 56% del pipeline.
    executor: win/server-2022
    steps:
      - checkout
      - toolchain_restore_cache:
          os: windows
      - run:
          name: Instalar Rust << pipeline.parameters.rust_version >> vía rustup
          command: |
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - INICIO"
            $ErrorActionPreference = "Stop"
            $RustVersion = "<< pipeline.parameters.rust_version >>"
            # Prefijo de PATH SOLO para este step: los steps posteriores que
            # invocan cargo re-prefijan por sí mismos (PowerShell no tiene el
            # equivalente de $BASH_ENV).
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # Idempotente (R3): si la caché de toolchain ya trae cargo, no
            # re-ejecutar rustup-init (ahorra ~2-3 min por corrida). rustup-init
            # estático oficial (pin exacto, no choco): reproducible e
            # independiente del repo de Chocolatey. Invoke-WebRequest no setea
            # $LASTEXITCODE: con ErrorActionPreference=Stop un fallo de descarga
            # lanza y aborta el step.
            # La guarda comprueba la RUTA específica del toolchain fijado
            # (~/.cargo/bin/cargo.exe), no Get-Command: el executor trae Rust
            # preinstalado en PATH, así que Get-Command siempre acertaría y
            # saltaría rustup-init, dejando el 1.96.0 sin instalar y ~/.cargo/bin
            # inexistente (espeja la guarda de macOS).
            if (Test-Path "$env:USERPROFILE\.cargo\bin\cargo.exe") {
              Write-Host "Toolchain restaurado de caché; se omite rustup-init"
            } else {
              Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain $RustVersion --profile minimal --no-modify-path
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            cargo --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            rustc --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - FIN"
      - toolchain_save_cache:
          os: windows
      - cargo_restore_caches:
          os: windows
          variant: test
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: windows
      - sccache_setup_windows
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            Write-Host "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # PowerShell no tiene $BASH_ENV: activar sccache inline para este step.
            $env:RUSTC_WRAPPER = "sccache"
            $env:SCCACHE_DIR = "$env:USERPROFILE\.cache\sccache"
            $env:CARGO_INCREMENTAL = "0"
            cargo test --all --verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sccache --show-stats
            Write-Host "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - cargo_save_target:
          os: windows
          variant: test

  test-macos:
    # Suite Rust en macOS nativo (Apple Silicon, Xcode 26.4.0). Valida código
    # específico de macOS (afplay/CoreAudio, rutas POSIX, señales) — sin Mac
    # físico, este gate en CI es la única validación antes del usuario real.
    # Caché: registry + sccache (sin target) — coherente con test-linux/windows.
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - toolchain_restore_cache:
          os: macos
      - run:
          name: Instalar Rust << pipeline.parameters.rust_version >> vía rustup
          command: |
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - INICIO"
            # Idempotente (R3): si la caché de toolchain ya trae rustup, se omite
            # la instalación (ahorra ~2-3 min por corrida).
            if [ -x "$HOME/.cargo/bin/rustup" ]; then
              echo "Toolchain restaurado de caché; se omite rustup-init"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain << pipeline.parameters.rust_version >> --profile minimal
            fi
            # No sourcear ~/.cargo/env: no está en la caché de toolchain
            # (solo ~/.rustup y ~/.cargo/bin), así que en caché tibia no existe.
            # El env de rustup solo antepone ~/.cargo/bin al PATH; lo hacemos directo.
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo --version
            rustc --version
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - FIN"
      - toolchain_save_cache:
          os: macos
      - cargo_restore_registry
      - run:
          name: Instalar dependencias de sistema (cmake, pkg-config)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            # cmake y pkg-config pueden no estar en la imagen base de Xcode
            if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
            if ! command -v pkg-config >/dev/null 2>&1; then brew install pkg-config; fi
            cmake --version
            echo "[STEP] Instalar dependencias de sistema - FIN"
      # NOTA: la suite featureless no compila ct2rs (native-translation off).
      # Cuando sí se compila (build-darwin-arm64 con --features full),
      # avi-translation usa OPENMP_RUNTIME=NONE en macOS (features por target en
      # su Cargo.toml): los runners con Apple clang no traen libomp y
      # find_package(OpenMP REQUIRED) fallaba (#2/#4).
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: macos
      - sccache_setup_unix
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo test --all --verbose
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats

  coverage:
    # Job de cobertura Rust (cargo-llvm-cov, LLVM instrumentation). Corre solo
    # en Linux x86_64: coverage es agnóstico de SO, duplicarlo triplicaría coste
    # sin señal nueva (ver docs/BUILD.md §4). Reemplaza a pytest-cov; genera
    # lcov.info y resumen por líneas. Sin gate de % aún — solo valida que la
    # instrumentación no rompa la suite; el gate por módulo se añadirá con
    # `cargo llvm-cov --fail-under-lines` cuando se defina el umbral.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463 # digest del índice multi-arch de 1.96.0 (ver parameters.rust_version)
    resource_class: medium
    steps:
      - checkout
      - run:
          # NOTA (R1): con native-stt/native-translation off por defecto,
          # coverage compila la workspace SIN los stacks C++ (no aparece
          # ct2rs con C++); libclang-dev/cmake se conservan por simetría
          # con test-linux y por si un futuro umbral corre coverage con features.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches:
          os: linux
          variant: cov
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - toolchain_restore_cache:
          os: linux
      - run:
          name: Instalar cargo-llvm-cov
          command: |
            echo "[STEP] Instalar cargo-llvm-cov - INICIO"
            rustup component add llvm-tools-preview
            # Idempotente: si la caché de toolchain ya trae el binario, no
            # recompilar desde fuente (ahorra ~2-4 min por corrida).
            if command -v cargo-llvm-cov >/dev/null 2>&1; then
              echo "cargo-llvm-cov restaurado de caché; se omite cargo install"
            else
              cargo install cargo-llvm-cov --locked
            fi
            cargo llvm-cov --version
            echo "[STEP] Instalar cargo-llvm-cov - FIN"
      - toolchain_save_cache:
          os: linux
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - run:
          name: Ejecutar suite con cobertura (cargo llvm-cov)
          command: |
            echo "[STEP] Ejecutar suite con cobertura - INICIO"
            # Genera lcov.info; el resumen se imprime sin re-ejecutar la suite
            cargo llvm-cov --workspace --lcov --output-path lcov.info --verbose
            cargo llvm-cov report
            echo "[STEP] Ejecutar suite con cobertura - FIN"
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats
      - store_artifacts:
          path: lcov.info
          destination: coverage-lcov
      - cargo_save_target:
          os: linux
          variant: cov

  # ──────────────────────────────────────────────────────────────
  # Validación GPLv3 — SOURCE-OFFER.md y THIRD-PARTY-LICENSES.md vivos
  # ──────────────────────────────────────────────────────────────
  validate-licenses:
    # Gate de licencias GPLv3: verifica que SOURCE-OFFER.md esté regenerado para
    # la versión vigente (cargo xtask source-offer --check) y que THIRD-PARTY-
    # LICENSES.md esté en sincronía con Cargo.lock (cargo xtask licenses --check).
    # Corre en ramas y en tags v* como gate de los builds (ver workflows).
    # Caché: registry + sccache (sin target) — xtask es pequeño, sccache basta.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463
    steps:
      - checkout
      - cargo_restore_registry
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - run:
          name: Verificar SOURCE-OFFER.md
          command: |
            echo "[STEP] Verificar SOURCE-OFFER.md - INICIO"
            cargo run -p xtask --quiet -- source-offer --check
            echo "[STEP] Verificar SOURCE-OFFER.md - FIN"
      - run:
          name: Verificar THIRD-PARTY-LICENSES.md
          command: |
            echo "[STEP] Verificar THIRD-PARTY-LICENSES.md - INICIO"
            cargo run -p xtask --quiet -- licenses --check
            echo "[STEP] Verificar THIRD-PARTY-LICENSES.md - FIN"

  validate-changelog:
    # Gate de CHANGELOG: verifica que exista la sección ## [X.Y.Z] para la
    # versión bumppeada antes del tag, evitando el fallo silencioso de
    # publish-release (~14 min de pipeline deshechos). Corre en tags v* como
    # gate de los builds (ver workflow build-all).
    # Caché: registry + sccache (sin target) — coherente con test-*.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463
    steps:
      - checkout
      - cargo_restore_registry
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - run:
          name: Verificar sección de CHANGELOG
          command: |
            echo "[STEP] Verificar CHANGELOG - INICIO"
            cargo run -p xtask --quiet -- changelog --check
            echo "[STEP] Verificar CHANGELOG - FIN"

  # ──────────────────────────────────────────────────────────────
  # Smoke tests de instaladores de una línea (mock por PATH, sin red)
  # Valida lógica de parsing de release, checksums y guards sin descargar.
  # ──────────────────────────────────────────────────────────────
  test-installer-linux:
    # Valida install-linux.sh sin red real, mockeando curl/uname/sha256sum
    # por PATH (tests/installer/). Decisión consciente: el flujo real se
    # valida en el proceso de release y en los smoke tests de los builds.
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Instalar bats-core
          command: |
            echo "[STEP] Instalar bats-core - INICIO"
            sudo apt-get update
            sudo apt-get install -y bats
            echo "[STEP] Instalar bats-core - FIN"
      - run:
          name: Ejecutar smoke-test install-linux.sh (bats)
          command: |
            echo "[STEP] Ejecutar smoke-test install-linux.sh (bats) - INICIO"
            bats tests/installer/install-linux.bats
            echo "[STEP] Ejecutar smoke-test install-linux.sh (bats) - FIN"

  test-installer-windows:
    # Smoke-test de install-windows.ps1 con Pester v5 pineado (el executor
    # trae Pester 3.x; un release nuevo no debe romper el job sin cambios).
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Instalar Pester (pineado 5.8.0)
          command: |
            Write-Host "[STEP] Instalar Pester (pineado 5.8.0) - INICIO"
            Install-Module Pester -RequiredVersion 5.8.0 -Force -SkipPublisherCheck -Scope CurrentUser
            if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Instalar Pester (pineado 5.8.0) - FIN"
      - run:
          name: Ejecutar smoke-test install-windows.ps1 (Pester)
          command: |
            Write-Host "[STEP] Ejecutar smoke-test install-windows.ps1 (Pester) - INICIO"
            Import-Module Pester -RequiredVersion 5.8.0
            Invoke-Pester tests/installer/install-windows.tests.ps1 -CI
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Ejecutar smoke-test install-windows.ps1 (Pester) - FIN"

  test-installer-macos:
    # Smoke-test de install-macos.sh en el executor macOS real (bats): única
    # validación del shell nativo de la plataforma sin un Mac físico.
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Instalar bats-core
          command: |
            echo "[STEP] Instalar bats-core - INICIO"
            brew install bats-core
            echo "[STEP] Instalar bats-core - FIN"
      - run:
          name: Ejecutar smoke-test install-macos.sh (bats)
          command: |
            echo "[STEP] Ejecutar smoke-test install-macos.sh (bats) - INICIO"
            bats tests/installer/install-macos.bats
            echo "[STEP] Ejecutar smoke-test install-macos.sh (bats) - FIN"

  # ──────────────────────────────────────────────────────────────
  # Builds nativos Rust — 4 targets de distribución (cargo build --release)
  # Cada build hace smoke test (version + voice list) y stagea el binario
  # versionado al workspace para publish-release. Requieren triple puerta +
  # coverage + instaladores (ver workflow build-all).
  # ──────────────────────────────────────────────────────────────
  build-windows-x64:
    # Windows x64: binario + smoke test nativo. No usa Inno Setup aún (el
    # bundle nativo scripts/build_release_native.py se invocará en Fase 7.2).
    executor: win/server-2022
    steps:
      - checkout
      - toolchain_restore_cache:
          os: windows
      - run:
          name: Instalar Rust << pipeline.parameters.rust_version >> vía rustup
          command: |
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - INICIO"
            $ErrorActionPreference = "Stop"
            $RustVersion = "<< pipeline.parameters.rust_version >>"
            # Prefijo de PATH SOLO para este step: los steps posteriores que
            # invocan cargo re-prefijan por sí mismos (PowerShell no tiene el
            # equivalente de $BASH_ENV).
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # Idempotente (R3): si la caché de toolchain ya trae cargo, se omite
            # rustup-init (ahorra ~2-3 min por corrida). Guarda por RUTA
            # específica del toolchain fijado (no Get-Command): el executor trae
            # Rust preinstalado en PATH y Get-Command saltaría rustup-init
            # dejando el 1.96.0 sin instalar y ~/.cargo/bin inexistente.
            if (Test-Path "$env:USERPROFILE\.cargo\bin\cargo.exe") {
              Write-Host "Toolchain restaurado de caché; se omite rustup-init"
            } else {
              Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain $RustVersion --profile minimal --no-modify-path
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            cargo --version
            rustc --version
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - FIN"
      - toolchain_save_cache:
          os: windows
      - msys2_restore_cache
      - run:
          # Bootstrap del toolchain C del motor TTS (MSYS2 UCRT64). Idempotente: si
          # la caché trajo C:\msys64 con gcc, se omite la instalación. En caché fría
          # instala el base de MSYS2 vía Chocolatey (ya presente en el executor)
          # pineado a la misma versión del release base, y sincroniza gcc (RLE:
          # libgfortran/libgcc/libquadmath estáticos), openblas y make (mingw32-make).
          # El pin de choco + la caché fijan el resultado; si upstream driftó gcc,
          # se loguea (no aborta) y la versión instalada manda como evidencia RLE.
          # pacman -Q + gcc --version quedan al log como evidencia auditable (RLE).
          # Marcadores por subpaso para localizar cuelgues.
          name: Bootstrap MSYS2 UCRT64 (toolchain motor TTS)
          command: |
            Write-Host "[STEP] Bootstrap MSYS2 UCRT64 - INICIO"
            $ErrorActionPreference = "Stop"
            $Root = "C:\msys64"
            $GccPin = "<< pipeline.parameters.msys2_gcc_version >>"
            if (Test-Path "$Root\ucrt64\bin\gcc.exe") {
              Write-Host "MSYS2 restaurado de caché; se omite instalación"
            } else {
              $Release = "<< pipeline.parameters.msys2_base_release >>"
              # Versión de choco = release base compactado + sufijo .0.0
              # (2026-06-11 -> 20260611.0.0): mismo pin que el release upstream.
              $ChocoVer = ($Release -replace '-', '') + ".0.0"
              Write-Host "[STEP] Instalar base MSYS2 via Chocolatey ($ChocoVer) - INICIO"
              choco install msys2 --version=$ChocoVer -y --no-progress --params "/NoUpdate /InstallDir:C:\msys64"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # choco gestiona base + keyring: no corremos `pacman-key --init`
              # (el hang por entropía que agotaba el no_output_timeout).
              if (-not (Test-Path "$Root\usr\bin\bash.exe")) { throw "MSYS2 no quedó en $Root tras choco (revisar /InstallDir; ¿anidó C:\msys64\msys64?)" }
              Write-Host "[STEP] Instalar base MSYS2 via Chocolatey - FIN"
              $Bash = "$Root\usr\bin\bash.exe"
              Write-Host "[STEP] Sincronizar toolchain (pacman -S gcc/openblas/make) - INICIO"
              & $Bash -lc "pacman -Sy --needed --noconfirm --disable-download-timeout mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-make"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Write-Host "[STEP] Sincronizar toolchain - FIN"
            }
            # Auditabilidad (RLE) + verificación de pines: pacman -Q y gcc --version.
            & "$Root\usr\bin\bash.exe" -lc "pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-make"
            & "$Root\ucrt64\bin\gcc.exe" --version
            $GccInstalled = (& "$Root\ucrt64\bin\gcc.exe" -dumpfullversion).Trim()
            # Log on drift (no halt): la versión instalada es la fuente de verdad de
            # la evidencia RLE. Si difiere del pin declarado, se advierte pero no se
            # aborta; actualizar el pin es opcional (solo refresca la clave de caché).
            if ($GccInstalled -ne $GccPin) {
              Write-Host "[WARN] gcc instalado ($GccInstalled) != pin declarado ($GccPin): drift upstream de MSYS2; evidencia RLE = $GccInstalled"
            } else {
              Write-Host "gcc instalado ($GccInstalled) coincide con el pin declarado"
            }
            Write-Host "[STEP] Bootstrap MSYS2 UCRT64 - FIN"
      - msys2_save_cache
      - cargo_restore_caches:
          os: windows
          variant: full
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: windows
      - sccache_setup_windows
      - run:
          name: Limpiar target/release (invalidación determinista de binary de release)
          command: |
            Write-Host "[STEP] Limpiar target/release por determinismo de release - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # Determinismo: `cargo clean --release` invalida target/release antes del
            # build, impidiendo que el binary empaquetado sea stale (cross-release target/
            # cache). preserva target/debug, registry (cargo-v2-*) y sccache (objetos .o
            # cacheados por hash de source conservan el speedup parcial). `2>$null` no
            # existe en PS, así que se usa -ErrorAction SilentlyContinue para tolerar
            # target/ inexistente tras toolchain_restore_cache.
            cargo clean --release -ErrorAction SilentlyContinue
            Write-Host "[STEP] Limpiar target/release por determinismo de release - FIN"
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            Write-Host "[STEP] Compilar binario release (cargo build --release) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # PowerShell no tiene $BASH_ENV: activar sccache inline para este step.
            $env:RUSTC_WRAPPER = "sccache"
            $env:SCCACHE_DIR = "$env:USERPROFILE\.cache\sccache"
            $env:CARGO_INCREMENTAL = "0"
            # El crate `ort` usa `load-dynamic`: no enlaza ONNX Runtime en
            # build-time (no hay ORT_LIB_PATH). La librería dinámica se descarga
            # y empaqueta junto al binario en el step de bundling siguiente.
            cargo build --release --features full --verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sccache --show-stats
            Write-Host "[STEP] Compilar binario release (cargo build --release) - FIN"
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            Write-Host "[STEP] Smoke test target/release/ai-voice-interconnector.exe - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            $Exe = "target\release\ai-voice-interconnector.exe"
            if (-not (Test-Path $Exe)) { throw "Binario no encontrado: $Exe" }
            & $Exe version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Contrato JSON determinista (src/main.rs:349 handle_version ->
            # emit_raw_json(json!({ "name": APP_NAME, "version": VERSION })) +
            # crates/avi-core/src/json_emitter.rs:26 with_schema_version): version
            # --json DEBE exponer name + version + schema_version. Sin este gate
            # un binary stale (target/ cache cross-release sin cargo clean) pasa
            # el smoke de texto pero viola el contrato JSON y rompe consumidores.
            $jsonRaw = & $Exe version --json | Out-String
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            try { $j = $jsonRaw | ConvertFrom-Json } catch { throw "version --json no es JSON válido: $jsonRaw : $_" }
            if (-not $j.PSObject.Properties['version'] -or -not $j.version) { throw "version --json: campo 'version' ausente o vacío: $jsonRaw" }
            if (-not $j.PSObject.Properties['name'] -or $j.name -ne 'ai-voice-interconnector') { throw "version --json: campo 'name' incorrecto: $jsonRaw" }
            if (-not $j.PSObject.Properties['schema_version'] -or $j.schema_version -ne '3') { throw "version --json: campo 'schema_version' != '3': $jsonRaw" }
            $expectedTag = $env:CIRCLE_TAG; if ($expectedTag) { $expectedTag = $expectedTag.TrimStart('v'); if ($j.version -ne $expectedTag) { throw "version --json: version '$($j.version)' != CIRCLE_TAG '$expectedTag' (tag=$env:CIRCLE_TAG)" } }
            Write-Host "version --json OK: name=$($j.name) version=$($j.version) schema_version=$($j.schema_version)"
            # Valida que la voz de fábrica 'default' quede registrada en un
            # runner limpio (voice list no carga el modelo y auto-inicializa
            # el store). El CLI imprime '  - default (fábrica)': se compara por
            # prefijo con -like (nunca -notmatch sobre array: filtra en vez de
            # dar booleano).
            $voiceList = & $Exe voice list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($voiceList | Where-Object { $_ -like '  - default*' })) { throw "La voz de fábrica 'default' no está registrada" }
            Write-Host "Binario Windows OK: version + voice list + version --json"
            Write-Host "[STEP] Smoke test target/release/ai-voice-interconnector.exe - FIN"
      - cargo_save_target:
          os: windows
          variant: full
      - sccache_save_cache:
          os: windows
      - run:
          name: Generar .engine-cachekey (clave TTS)
          shell: bash
          command: |
            echo "[STEP] Generar .engine-cachekey - INICIO"
            # Agregado determinista: Makefile + fuentes C/H (incluye vendor/lz4) + ingot
            # Usa /usr/bin/find y /usr/bin/sort + xargs -r para evitar el find de Windows (System32) y ruido "File not found - *.c"
            cat vendor/qwen3-tts/Makefile > vendor/qwen3-tts/.engine-cachekey
            /usr/bin/find vendor/qwen3-tts -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' \) -print | /usr/bin/sort | /usr/bin/xargs -r cat >> vendor/qwen3-tts/.engine-cachekey 2>/dev/null || true
            /usr/bin/find vendor/qwen3-tts/vendor -type f \( -name '*.c' -o -name '*.h' \) -print | /usr/bin/sort | /usr/bin/xargs -r cat >> vendor/qwen3-tts/.engine-cachekey 2>/dev/null || true
            /usr/bin/find vendor/qwen3-tts/third_party/ingot -type f \( -name '*.c' -o -name '*.h' \) -print | /usr/bin/sort | /usr/bin/xargs -r cat >> vendor/qwen3-tts/.engine-cachekey 2>/dev/null || true
            echo "[STEP] Generar .engine-cachekey - FIN"
      - restore_cache:
          keys:
            - tts-v1-{{ arch }}-gcc<< pipeline.parameters.msys2_gcc_version >>-ob<< pipeline.parameters.msys2_openblas_version >>-{{ checksum "vendor/qwen3-tts/.engine-cachekey" }}
      - run:
          # Interfaz uniforme (los 4 SO): `xtask build-engine` compila el motor con
          # mingw32-make bajo el entorno MSYS2 UCRT64 (PATH ucrt64/bin + usr/bin,
          # MSYSTEM=UCRT64, leído de MSYS2_ROOT default C:\msys64) y verifica con
          # --self-test. Produce vendor\qwen3-tts\qwen_tts.exe fresco desde fuente
          # (antes: blob de 33 MB versionado). El staging de abajo lo consume.
          # Cacheado: si qwen_tts.exe existe tras restore (clave exacta sin fallback),
          # es fresco y solo se verifica; si no, build completo.
          name: Compilar y verificar motor TTS
          command: |
            Write-Host "[STEP] Compilar y verificar motor TTS - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            $TtsExe = "vendor\qwen3-tts\qwen_tts.exe"
            if (Test-Path $TtsExe) {
              Write-Host "Motor TTS restaurado de caché; se ejecuta --self-test directo"
              & $TtsExe --self-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              cargo run -p xtask -- build-engine --self-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Write-Host "[STEP] Compilar y verificar motor TTS - FIN"
      - save_cache:
          key: tts-v1-{{ arch }}-gcc<< pipeline.parameters.msys2_gcc_version >>-ob<< pipeline.parameters.msys2_openblas_version >>-{{ checksum "vendor/qwen3-tts/.engine-cachekey" }}
          paths:
            - vendor/qwen3-tts/qwen_tts.exe
      - restore_cache:
          keys:
            - ort-v1-win-x64-<< pipeline.parameters.ort_version >>
      - run:
          # Autocontención (requisito duro): el crate `ort` en `load-dynamic`
          # busca onnxruntime.dll junto al ejecutable. Se empaqueta la librería
          # oficial de Microsoft (ONNX Runtime << pipeline.parameters.ort_version >>, pareja de ort rc.13) y sus
          # 3 DLLs del runtime VC++ (la dll de MS es /MD), de modo que el usuario
          # no necesite instalar el VC++ Redistributable ni nada previo.
          # Cacheado: si onnxruntime.dll existe tras restore, se omite descarga.
          name: Empaquetar ONNX Runtime + runtime VC++ (bundle load-dynamic)
          command: |
            Write-Host "[STEP] Empaquetar ONNX Runtime + runtime VC++ - INICIO"
            $ErrorActionPreference = "Stop"
            $OrtVersion = "<< pipeline.parameters.ort_version >>"
            $Bundle = "ort-bundle"
            if (-not (Test-Path "$Bundle\onnxruntime.dll")) {
              if (Test-Path $Bundle) { Remove-Item -Recurse -Force $Bundle }
              New-Item -ItemType Directory -Force -Path $Bundle | Out-Null
              # 1. Librería dinámica oficial de Microsoft (win-x64).
              $Zip = "onnxruntime-win-x64-$OrtVersion.zip"
              $Url = "https://github.com/microsoft/onnxruntime/releases/download/v$OrtVersion/$Zip"
              Invoke-WebRequest -Uri $Url -OutFile "$env:TEMP\$Zip"
              Expand-Archive -Path "$env:TEMP\$Zip" -DestinationPath "$env:TEMP\ort-extract" -Force
              $Dll = Get-ChildItem -Path "$env:TEMP\ort-extract" -Recurse -Filter "onnxruntime.dll" | Select-Object -First 1
              if (-not $Dll) { throw "onnxruntime.dll no encontrada en $Zip" }
              Copy-Item $Dll.FullName "$Bundle\onnxruntime.dll"
              # 2. Runtime VC++ (app-local): la dll de MS es /MD y depende de estas 3.
              #    onnxruntime-win-x64-1.28.0.zip ya no las incluye.
              #    Se obtienen de System32 (Windows Server 2022 -> VC++ 2022 CRT compatible).
              $Vc = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
              foreach ($Name in $Vc) {
                $Found = Get-ChildItem -Path "C:\Windows\System32" -Filter $Name -ErrorAction SilentlyContinue |
                         Select-Object -First 1
                if (-not $Found) { throw "No se encontró $Name en System32" }
                Copy-Item $Found.FullName "$Bundle\$Name"
              }
            } else {
              Write-Host "Bundle ONNX Runtime restaurado de caché; se omite descarga"
            }
            Write-Host "Bundle ONNX Runtime + VC++:"
            Get-ChildItem $Bundle | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Host "[STEP] Empaquetar ONNX Runtime + runtime VC++ - FIN"
      - save_cache:
          key: ort-v1-win-x64-<< pipeline.parameters.ort_version >>
          paths:
            - ort-bundle
      - run:
          # Nombre del artefacto con la versión REAL del CLI: la fuente de
          # verdad es `const VERSION` en src/main.rs (desacoplada de Cargo.toml,
          # que quedó en 0.1.0 tras la migración). Fail-fast: si difiere del tag
          # v*, el release saldría con nombre inconsistente → abortar.
          name: Preparar artefacto versionado (staging)
          command: |
            Write-Host "[STEP] Preparar artefacto versionado - INICIO"
            $ErrorActionPreference = "Stop"
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            $Version = [regex]::Match((Get-Content src\main.rs -Raw), 'const VERSION: &str = "([^"]+)"').Groups[1].Value
            if (-not $Version) { throw "No se pudo extraer const VERSION de src/main.rs" }
            $TagVersion = $env:CIRCLE_TAG -replace '^v',''
            if ($Version -ne $TagVersion) { throw "VERSION en main.rs ($Version) != tag ($TagVersion)" }
            $Src = "target\release\ai-voice-interconnector.exe"
            if (-not (Test-Path $Src)) { throw "Binario no encontrado: $Src" }
            # Staging de layout plano: binario (sin sufijo de arch) + los 4
            # documentos de la raíz + la librería ONNX Runtime y el runtime VC++
            # empaquetados en el step anterior, comprimidos a .zip para que el
            # one-liner de Windows extraiga todo junto al binario (GPLv3 +
            # autocontención STT).
            $Stage = "staging"
            if (Test-Path $Stage) { Remove-Item -Recurse -Force $Stage }
            New-Item -ItemType Directory -Force -Path $Stage | Out-Null
            Copy-Item $Src "$Stage\ai-voice-interconnector.exe"
            foreach ($Doc in @("LICENSE", "THIRD-PARTY-LICENSES.md", "SOURCE-OFFER.md", "README.md")) {
              Copy-Item $Doc "$Stage\$Doc"
            }
            # Librería ONNX Runtime + runtime VC++ (autocontención STT).
            Copy-Item "ort-bundle\*" $Stage
            # Motor TTS vendido (qwen_tts.exe): se incluye junto al binario para que
            # la resolución por defecto (<cwd>/vendor/qwen3-tts/qwen_tts.exe) funcione
            # en el instalador sin variables de entorno.
            $VendoredTTS = "vendor\qwen3-tts\qwen_tts.exe"
            if (-not (Test-Path $VendoredTTS)) { throw "qwen_tts.exe vendido no encontrado en $VendoredTTS" }
            $VendoredDst = "$Stage\vendor\qwen3-tts"
            New-Item -ItemType Directory -Force -Path $VendoredDst | Out-Null
            Copy-Item $VendoredTTS "$VendoredDst\qwen_tts.exe"
            $Dst = "artifacts\ai-voice-interconnector-$Version-x86_64-windows.zip"
            Compress-Archive -Path "$Stage\*" -DestinationPath $Dst -Force
            Write-Host "Artefacto: $Dst"
            Write-Host "[STEP] Preparar artefacto versionado - FIN"
      - run:
          name: Emitir SHA-256 del artefacto
          command: |
            Write-Host "[STEP] Emitir SHA-256 del artefacto - INICIO"
            Get-FileHash artifacts\ai-voice-interconnector-*-x86_64-windows.zip -Algorithm SHA256
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Emitir SHA-256 del artefacto - FIN"
      - persist_to_workspace:
          root: artifacts
          paths:
            - ai-voice-interconnector-*-x86_64-windows.zip

  build-linux-x64:
    # Linux x64: el más barato/rápido para la suite, pero el build necesita
    # `large` (8 GB RAM): el linking de cpal + tokio + ct2rs (ort es
    # load-dynamic) supera los 4 GB de `medium` (OOM silencioso). Simetría con
    # docs/BUILD.md §4 — `large` trae 4 vCPU de regalo no aprovechados.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463 # digest del índice multi-arch de 1.96.0 (ver parameters.rust_version)
    resource_class: large
    steps:
      - checkout
      - run:
          # libclang-dev es requisito de bindgen (ct2rs, solo con native-translation), igual que en test-linux.
          # libopenblas-dev aporta /usr/include/openblas y -lopenblas que exige el
          # target `blas` del Makefile de qwen_tts en Linux.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev, libopenblas-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev libopenblas-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches:
          os: linux
          variant: full
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - run:
          name: Limpiar target/release (invalidación determinista de binary de release)
          command: |
            echo "[STEP] Limpiar target/release por determinismo de release - INICIO"
            # Determinismo: `cargo clean --release` invalida target/release antes del
            # build, impidiendo que el binary empaquetado sea stale (cross-release
            # target/ cache). Preserva target/debug, registry (cargo-v2-*) y sccache
            # (objetos .o cacheados por hash de source conservan el speedup parcial).
            cargo clean --release || true
            echo "[STEP] Limpiar target/release por determinismo de release - FIN"
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            echo "[STEP] Compilar binario release (cargo build --release) - INICIO"
            cargo build --release --features full --verbose
            echo "[STEP] Compilar binario release (cargo build --release) - FIN"
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - INICIO"
            test -x target/release/ai-voice-interconnector || (echo "Binario no encontrado" && exit 1)
            target/release/ai-voice-interconnector version
            # Contrato JSON determinista (src/main.rs:349 handle_version ->
            # emit_raw_json(json!({ "name": APP_NAME, "version": VERSION })) +
            # crates/avi-core/src/json_emitter.rs:26 with_schema_version): version
            # --json DEBE exponer name + version + schema_version. Python3 parsea
            # sin depender de jq (cimg/rust ya lo provee, pero python3 es canónico).
            target/release/ai-voice-interconnector version --json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); assert d.get("version"), "campo version ausente: %r" % d; assert d.get("name")=="ai-voice-interconnector", "name incorrecto: %r" % d; assert d.get("schema_version")=="3", "schema_version !=3: %r" % d; tag=os.environ.get("CIRCLE_TAG","").lstrip("v"); assert not tag or d["version"]==tag, "version %r != CIRCLE_TAG %r" % (d["version"], tag); print("version --json OK: %r" % d)'
            # Valida la voz de fábrica 'default' (runner limpio: voice list
            # auto-inicializa el store y no carga el modelo). Prefijo '^  - default'
            # tolera el sufijo '(fábrica)' del CLI Rust sin aceptar otras voces.
            target/release/ai-voice-interconnector voice list | grep -q '^  - default'
            echo "Binario Linux x64 OK: version + voice list + version --json"
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - FIN"
      - run:
          # Interfaz uniforme (los 4 SO): `xtask build-engine` oculta el mecanismo
          # por plataforma (make/mingw32-make, entorno MSYS2 en Windows), centraliza
          # la política SIMD (SIMD=auto -> Makefile) y compila + verifica (--self-test,
          # oráculo de kernels sin pesos) en un solo paso. Antes: bloque `make blas` +
          # `--self-test` triplicado idéntico en los 3 jobs Unix.
          name: Compilar y verificar motor TTS
          command: cargo run -p xtask -- build-engine --self-test
      - cargo_save_target:
          os: linux
          variant: full
      - sccache_save_cache:
          os: linux
      - run:
          # Nombre del artefacto con la versión REAL del CLI: la fuente de
          # verdad es `const VERSION` en src/main.rs (desacoplada de Cargo.toml,
          # que quedó en 0.1.0 tras la migración). Fail-fast contra el tag.
          name: Preparar artefacto versionado (staging)
          command: |
            echo "[STEP] Preparar artefacto versionado - INICIO"
            set -euo pipefail
            mkdir -p artifacts
            VERSION=$(sed -n 's/^const VERSION: &str = "\(.*\)";/\1/p' src/main.rs)
            if [ -z "$VERSION" ]; then echo "ERROR: const VERSION no encontrada en src/main.rs" >&2; exit 1; fi
            if [ "$VERSION" != "${CIRCLE_TAG#v}" ]; then
              echo "ERROR: VERSION en main.rs ($VERSION) != tag (${CIRCLE_TAG#v})" >&2
              exit 1
            fi
            SRC="target/release/ai-voice-interconnector"
            test -x "$SRC" || (echo "Binario no encontrado: $SRC" && exit 1)
            # Staging de layout plano: binario (sin sufijo de arch) + los 4
            # documentos de la raíz + la librería ONNX Runtime, comprimidos a
            # tar.gz para que el one-liner extraiga y todo viaje junto al binario.
            STAGE="$(mktemp -d)"
            cp "$SRC" "$STAGE/ai-voice-interconnector"
            chmod +x "$STAGE/ai-voice-interconnector"
            cp LICENSE THIRD-PARTY-LICENSES.md SOURCE-OFFER.md README.md "$STAGE/"
            # Autocontención STT (requisito duro): el crate `ort` en `load-dynamic`
            # busca libonnxruntime.so junto al ejecutable. Se empaqueta la librería
            # oficial de Microsoft (ONNX Runtime << pipeline.parameters.ort_version >>, pareja de ort rc.13) con el
            # nombre por defecto que busca ort, sin que el usuario instale nada.
            ORT_VERSION="<< pipeline.parameters.ort_version >>"
            ORT_TGZ="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
            curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ORT_TGZ}" -o "/tmp/${ORT_TGZ}"
            ORT_EXTRACT="$(mktemp -d)"
            tar -xzf "/tmp/${ORT_TGZ}" -C "$ORT_EXTRACT"
            ORT_LIB="$(find "$ORT_EXTRACT" -name 'libonnxruntime.so.*' -type f | head -n1)"
            test -n "$ORT_LIB" || (echo "libonnxruntime.so no encontrada en ${ORT_TGZ}" && exit 1)
            cp "$ORT_LIB" "$STAGE/libonnxruntime.so"
            # Motor TTS vendido (qwen_tts): se incluye bajo vendor/qwen3-tts/ para
            # que la resolución por defecto (<cwd>/vendor/qwen3-tts/qwen_tts) funcione
            # tras extraer, sin variables de entorno (paridad con Windows).
            VENDORED_TTS="vendor/qwen3-tts/qwen_tts"
            test -x "$VENDORED_TTS" || (echo "qwen_tts vendido no encontrado en $VENDORED_TTS" && exit 1)
            mkdir -p "$STAGE/vendor/qwen3-tts"
            cp "$VENDORED_TTS" "$STAGE/vendor/qwen3-tts/qwen_tts"
            chmod +x "$STAGE/vendor/qwen3-tts/qwen_tts"
            DST="artifacts/ai-voice-interconnector-${VERSION}-x86_64-linux.tar.gz"
            tar -czf "$DST" -C "$STAGE" .
            echo "Artefacto: $DST"
            echo "[STEP] Preparar artefacto versionado - FIN"
      - run:
          name: Emitir SHA-256 del artefacto
          command: |
            echo "[STEP] Emitir SHA-256 del artefacto - INICIO"
            sha256sum artifacts/ai-voice-interconnector-*-x86_64-linux.tar.gz
            echo "[STEP] Emitir SHA-256 del artefacto - FIN"
      - persist_to_workspace:
          root: artifacts
          paths:
            - ai-voice-interconnector-*-x86_64-linux.tar.gz

