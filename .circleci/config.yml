  build-darwin-arm64:
    # macOS ARM64 (Apple Silicon, Xcode 26.4.0): clang nativo, sin cross.
    # El binario se valida con smoke test version + voice list (no carga modelo).
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    parameters:
      probe:
        type: boolean
        default: false
    steps:
      - checkout
      - toolchain_restore_cache:
          os: macos
      - run:
          name: Instalar Rust << pipeline.parameters.rust_pin >> vía rustup
          no_output_timeout: 10m
          command: |
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - INICIO"
            # Idempotente: si la caché de toolchain ya trae rustup, se omite
            # la instalación (ahorra ~2-3 min por corrida).
            if [ -x "$HOME/.cargo/bin/rustup" ]; then
              echo "Toolchain restaurado de caché; se omite rustup-init"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain << pipeline.parameters.rust_pin >> --profile minimal
            fi
            # No sourcear ~/.cargo/env: no está en la caché de toolchain
            # (solo ~/.rustup y ~/.cargo/bin), así que en caché tibia no existe.
            # El env de rustup solo antepone ~/.cargo/bin al PATH; lo hacemos directo.
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo --version
            rustc --version
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - FIN"
      - toolchain_save_cache:
          os: macos
      - run:
          name: Instalar dependencias de sistema (cmake, pkg-config, make)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
            if ! command -v pkg-config >/dev/null 2>&1; then brew install pkg-config; fi
            cmake --version
            # make y gcc/clang (el Makefile de qwen_tts invoca `gcc`, que en macOS
            # resuelve al shim de Apple clang) vienen con el toolchain de Xcode;
            # se verifica su presencia antes de `make blas` (BLAS = Accelerate,
            # sin dependencia por brew).
            make --version
            gcc --version
            echo "[STEP] Instalar dependencias de sistema - FIN"
      # NOTA: sin libomp — con --features full este build sí compila ct2rs, que
      # usa OPENMP_RUNTIME=NONE en macOS (features por target en
      # avi-translation/Cargo.toml): Apple clang no trae libomp y
      # find_package(OpenMP REQUIRED) fallaba (#2/#4).
      - unless:
          condition: << parameters.probe >>
          steps:
            - cargo_restore_caches:
                os: macos
                variant: full
                target: true
      - when:
          condition: << parameters.probe >>
          steps:
            - cargo_restore_caches:
                os: macos
                variant: full
                target: false
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: macos
          variant: full
      - sccache_setup_unix
      - native_sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            echo "[STEP] Compilar binario release (cargo build --release) - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            # Solo en modo sonda (target/ frío): el servidor sccache, que arranca
            # con la primera compilación de este step, registra sus errores en un
            # log publicado como artefacto (cargo oculta la salida de los build scripts).
            if [ "<< parameters.probe >>" = "true" ]; then
              export SCCACHE_ERROR_LOG="$PWD/sccache-error.log" SCCACHE_LOG=debug
            fi
            # --timings: desglose por crate en target/cargo-timings (artefacto).
            cargo build --release --features full --verbose --timings
            echo "[STEP] Compilar binario release (cargo build --release) - FIN"
      - store_artifacts:
          path: target/cargo-timings
          destination: cargo-timings
      - when:
          condition: << parameters.probe >>
          steps:
            - cmake_probe_diagnostics
            - store_artifacts:
                path: sccache-error.log
                destination: sccache-error-log
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            sccache --show-stats
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            test -x target/release/ai-voice-interconnector || (echo "Binario no encontrado" && exit 1)
            target/release/ai-voice-interconnector version
            # La versión del binario release debe coincidir con el tag; el
            # contrato JSON de `version --json` lo cubre el golden de la CLI.
            test "$(target/release/ai-voice-interconnector --version)" = "ai-voice-interconnector ${CIRCLE_TAG#v}" || { echo "versión del binario distinta del tag ${CIRCLE_TAG}" >&2; exit 1; }
            # Valida la voz de fábrica 'default' (runner limpio: voice list
            # auto-inicializa el store y no carga el modelo). Prefijo '^  - default'
            # tolera el sufijo '(fábrica)' del CLI Rust sin aceptar otras voces.
            # Captura previa en variable en lugar de tubería directa a `grep -q`:
            # `grep -q` sale en cuanto encuentra la coincidencia y cierra la
            # tubería; si el binario aún tiene líneas por escribir, esa
            # escritura devuelve EPIPE y `println!` hace panic (Rust ignora
            # SIGPIPE por defecto). Con `pipefail` eso tumbaba el paso de forma
            # intermitente (visto en v0.20.9, build-linux-x64).
            voice_list_out="$(target/release/ai-voice-interconnector voice list)"
            printf '%s\n' "$voice_list_out" | grep -q '^  - default'
            echo "Binario macOS ARM64 OK: version + voice list + versión del tag"
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - FIN"
      - run:
          # Interfaz uniforme (los 4 SO): `xtask build-engine` oculta el mecanismo
          # por plataforma (make + framework Accelerate en macOS), centraliza la
          # política SIMD (SIMD=auto -> Makefile) y compila + verifica (--self-test,
          # oráculo de kernels sin pesos) en un solo paso.
          name: Compilar y verificar motor TTS
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo xtask build-engine --self-test
      - unless:
          condition: << parameters.probe >>
          steps:
            - cargo_save_target:
                os: macos
                variant: full
                when: on_success
      - sccache_save_cache:
          os: macos
          variant: full
      - unless:
          condition: << parameters.probe >>
          steps:
            - run:
                # Empaquetado canónico: `xtask package` monta el bundle desde
                # packaging/bundle-manifest.json (la misma lista que valida
                # `self install`) y aborta si VERSION != tag.
                name: Empaquetar bundle con xtask package
                command: |
                  echo "[STEP] Empaquetar bundle con xtask package - INICIO"
                  set -euo pipefail
                  cargo xtask package --expect-version "${CIRCLE_TAG#v}"
                  echo "[STEP] Empaquetar bundle con xtask package - FIN"
            - run:
                # Humo de instalación: instala el artefacto empaquetado en un
                # sandbox con las cuatro raíces reubicadas y comprueba que el
                # binario instalado arranca.
                name: Humo de instalación en sandbox (self install)
                command: |
                  echo "[STEP] Humo de instalación en sandbox - INICIO"
                  set -euo pipefail
                  SANDBOX="$(mktemp -d)"
                  export AVI_INSTALL_DIR="$SANDBOX/program" AVI_BIN_DIR="$SANDBOX/bin" AVI_DATA_DIR="$SANDBOX/data" AVI_CACHE_DIR="$SANDBOX/cache"
                  mkdir -p "$AVI_INSTALL_DIR" "$AVI_BIN_DIR" "$AVI_DATA_DIR" "$AVI_CACHE_DIR"
                  STAGE_SMOKE="$(mktemp -d)"
                  tar -xzf artifacts/ai-voice-interconnector-*-arm64-macos.tar.gz -C "$STAGE_SMOKE"
                  "$STAGE_SMOKE/ai-voice-interconnector" self install --no-setup --no-modify-path --yes
                  "$AVI_INSTALL_DIR/ai-voice-interconnector" --version
                  rm -rf "$SANDBOX" "$STAGE_SMOKE"
                  echo "[STEP] Humo de instalación en sandbox - FIN"
            - run:
                name: Emitir SHA-256 del artefacto
                command: |
                  echo "[STEP] Emitir SHA-256 del artefacto - INICIO"
                  shasum -a 256 artifacts/ai-voice-interconnector-*-arm64-macos.tar.gz
                  echo "[STEP] Emitir SHA-256 del artefacto - FIN"
            - persist_to_workspace:
                root: artifacts
                paths:
                  - ai-voice-interconnector-*-arm64-macos.tar.gz

  # ──────────────────────────────────────────────────────────────
  # CD — publicación del GitHub Release (Rust nativo, 4 binarios)
  # ──────────────────────────────────────────────────────────────
  publish-release:
    # Recolecta los 4 binarios Rust versionados por workspace (no `gh run
    # download`: determinista, sin token API CircleCI), genera SHA256SUMS.txt
    # y publica el GitHub Release directo (sin borrador). Solo en tags v*.
    # Requiere context `github-release` con GH_TOKEN (contents:write).
    docker:
      # Mismo pin por digest que test-bootstrap-linux (cimg/base:2026.09).
      - image: cimg/base:2026.09@sha256:668174490adc470cd34eb3aa178939d65f817bc13ef657a94ff0278338f7d8da
    steps:
      - checkout
      - attach_workspace:
          at: artifacts
      - run:
          name: Instalar gh CLI (repo apt oficial, firmado)
          command: |
            echo "[STEP] Instalar gh CLI - INICIO"
            set -euo pipefail
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -nv -O- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
            echo "[STEP] Instalar gh CLI - FIN"
      - run:
          name: Estampar la versión del tag en los bootstrap
          command: |
            echo "[STEP] Estampar la versión en los bootstrap - INICIO"
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            for f in packaging/bootstrap/install.sh packaging/bootstrap/install.ps1; do
              count="$(grep -c "__AVI_STAMPED_VERSION__" "$f" || true)"
              if [ "$count" != "1" ]; then
                echo "ERROR: se esperaba exactamente un marcador en $f (hay $count)" >&2
                exit 1
              fi
              sed -i "s/__AVI_STAMPED_VERSION__/${VERSION}/" "$f"
              if grep -q "__AVI_STAMPED_VERSION__" "$f"; then
                echo "ERROR: marcador residual en $f tras estampar" >&2
                exit 1
              fi
              echo "Estampado $f con $VERSION"
            done
            echo "[STEP] Estampar la versión en los bootstrap - FIN"
      - run:
          name: Generar SHA256SUMS.txt sobre artefactos del workspace
          command: |
            echo "[STEP] Generar SHA256SUMS.txt - INICIO"
            set -euo pipefail
            cp packaging/bootstrap/install.sh packaging/bootstrap/install.ps1 artifacts/
            cd artifacts
            sha256sum ai-voice-interconnector-* install.sh install.ps1 > SHA256SUMS.txt
            cat SHA256SUMS.txt
            echo "Artefactos recolectados:"
            ls -lh ai-voice-interconnector-* install.sh install.ps1 SHA256SUMS.txt
            echo "[STEP] Generar SHA256SUMS.txt - FIN"
      - run:
          name: Extraer notas de release desde CHANGELOG
          command: |
            echo "[STEP] Extraer notas de release desde CHANGELOG - INICIO"
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            awk -v ver="## [$VERSION]" '
              index($0, ver) == 1 { grab=1; print; next }
              grab && /^## \[/ { exit }
              grab && /^\[[^][]*\]:/ { exit }
              grab { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "ERROR: no se encontró la sección [$VERSION] en CHANGELOG.md" >&2
              exit 1
            fi
            cat notes.md
            echo "[STEP] Extraer notas de release desde CHANGELOG - FIN"
      - run:
          name: Anexar pie de oferta GPLv3 a notas
          command: |
            echo "[STEP] Anexar pie de oferta GPLv3 - INICIO"
            set -euo pipefail
            {
              echo ""
              echo "---"
              echo ""
              echo "## Código fuente (oferta GPLv3 §6)"
              echo ""
              echo "Este release se distribuye bajo **GPL-3.0-or-later**. El código"
              echo "fuente correspondiente a este tag está disponible en:"
              echo ""
              echo "- Tarball de fuente: https://github.com/CristianRojas-SoftwareEngineer/AI-Voice-InterConnector/archive/refs/tags/${CIRCLE_TAG}.tar.gz"
              echo "- Etiqueta del release: https://github.com/CristianRojas-SoftwareEngineer/AI-Voice-InterConnector/releases/tag/${CIRCLE_TAG}"
            } >> notes.md
            echo "[STEP] Anexar pie de oferta GPLv3 - FIN"
      - run:
          name: Publicar GitHub Release con 7 assets
          command: |
            echo "[STEP] Publicar GitHub Release - INICIO"
            set -euo pipefail
            gh release create "$CIRCLE_TAG" \
              artifacts/ai-voice-interconnector-* artifacts/install.sh artifacts/install.ps1 artifacts/SHA256SUMS.txt \
              --title "$CIRCLE_TAG" \
              --notes-file notes.md
            echo "[STEP] Publicar GitHub Release - FIN"

  publish-metadata:
    # Actualiza el Cask de Homebrew tras cada Release (solo macOS). Requiere
    # contexts `github-release` y `homebrew-tap`. El Cask inicial es bootstrap
    # manual. `cargo xtask cask` genera un `binary` stanza sobre el tar.gz de
    # macOS (`*-arm64-macos.tar.gz`): Homebrew autoextrae el archivo y enlaza
    # `ai-voice-interconnector` desde la raíz del staged_path.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      # Caché: registry + sccache (sin target xtask) — coherente con los jobs pequeños/xtask.
      - cargo_restore_registry
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Instalar gh CLI (repo apt oficial, firmado)
          command: |
            echo "[STEP] Instalar gh CLI - INICIO"
            set -euo pipefail
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -nv -O- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh git ruby
            echo "[STEP] Instalar gh CLI - FIN"
      - run:
          name: Descargar SHA256SUMS.txt del release recién publicado
          command: |
            echo "[STEP] Descargar SHA256SUMS.txt del release - INICIO"
            set -euo pipefail
            gh release download "$CIRCLE_TAG" -R "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              -p SHA256SUMS.txt --dir /tmp/release-metadata
            cat /tmp/release-metadata/SHA256SUMS.txt
            echo "[STEP] Descargar SHA256SUMS.txt del release - FIN"
      - run:
          name: Renderizar Casks/ai-voice-interconnector.rb
          command: |
            echo "[STEP] Renderizar Cask - INICIO"
            set -euo pipefail
            cargo --quiet xtask cask \
              --tag "$CIRCLE_TAG" \
              --sums-file /tmp/release-metadata/SHA256SUMS.txt \
              --out /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            cat /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            echo "[STEP] Renderizar Cask - FIN"
      - run:
          name: Verificar sintaxis del Cask (ruby -c)
          command: |
            echo "[STEP] Verificar sintaxis del Cask - INICIO"
            ruby -c /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            echo "[STEP] Verificar sintaxis del Cask - FIN"
      - run:
          name: Clonar tap, commitear Cask y empujar
          command: |
            echo "[STEP] Clonar tap, commitear Cask y empujar - INICIO"
            set -euo pipefail
            RENDERED="/tmp/tap-clone/Casks/ai-voice-interconnector.rb"
            git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/CristianRojas-SoftwareEngineer/homebrew-ai-voice-interconnector.git" /tmp/tap-repo
            mkdir -p /tmp/tap-repo/Casks
            cp "$RENDERED" /tmp/tap-repo/Casks/ai-voice-interconnector.rb
            cd /tmp/tap-repo
            git config user.name "ai-voice-interconnector-ci"
            git config user.email "ci@ai-voice-interconnector.invalid"
            git add Casks/ai-voice-interconnector.rb
            if git diff --cached --quiet; then
              echo "Cask sin cambios (regeneración idempotente); nada que empujar."
            else
              git commit -m "Cask: actualizar a ${CIRCLE_TAG}"
              git push origin HEAD:main
            fi
            echo "[STEP] Clonar tap, commitear Cask y empujar - FIN"

# ══════════════════════════════════════════════════════════════════════
# UN pipeline de release (`build-all`), disparado SOLO en tags `v*`:
#
#   La triple puerta de tests por plataforma (test-linux/windows/macos) corre
#   como gate mecánico de los 4 builds DENTRO de esta misma pipeline. Así la
#   publicación (publish-release, irreversible) queda condicionada al resultado
#   completo de la suite sobre el commit taggeado, sin depender de disciplina
#   humana ni de una pipeline de rama que corra en paralelo: CircleCI no puede
#   encadenar pipelines distintas, de modo que la única garantía mecánica es
#   tener los tests en el grafo de dependencias del release.
#
#   Se descartó el pipeline de rama `validate`: al empujar commit+tag juntos
#   disparaba una segunda pipeline que re-ejecutaba la MISMA triple suite sobre
#   el mismo commit en paralelo (duplicación sin cobertura única). El feedback
#   pre-release vive en local sobre `main` (trunk-based) y en este gate al
#   taggear: si los tests fallan, los builds no corren y nada se publica.
#
#   `coverage`, instaladores y licencias/changelog completan los gates de los 4
#   builds nativos, que compilan las 4 plataformas en modo release.
# ══════════════════════════════════════════════════════════════════════
workflows:
  # ── Pipeline de RELEASE: tests (gate) + empaquetado + publicación en tags `v*` ──
  build-all:
    # CircleCI NO ejecuta un job en un tag salvo que el job Y todas sus
    # dependencias declaren `filters.tags`; por eso el filtro `v*` se propaga
    # por toda la cadena (tests/gates → builds → publish-*).
    # Todos los jobs declaran además `branches: ignore /.*/`: esta pipeline corre
    # SOLO en tags `v*`, nunca en pushes de rama.
    # Excluido explícitamente cuando se dispara la sonda (native_cache_probe).
    when:
      not: << pipeline.parameters.native_cache_probe >>
    jobs:
      # ── Triple suite (gate) + cobertura + instaladores + licencias ──
      # Los 4 builds requieren estos 9 gates verdes en la misma pipeline.
      - validate-licenses:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - validate-changelog:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-linux:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - coverage:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-bootstrap-linux:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-bootstrap-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-bootstrap-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      # ── Builds nativos Rust (requieren triple suite + cobertura + instaladores) ──
      - build-windows-x64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-bootstrap-linux
            - test-bootstrap-windows
            - test-bootstrap-macos
            - coverage
            - validate-licenses
            - validate-changelog
      - build-linux-x64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-bootstrap-linux
            - test-bootstrap-windows
            - test-bootstrap-macos
            - coverage
            - validate-licenses
            - validate-changelog
      - build-linux-arm64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-bootstrap-linux
            - test-bootstrap-windows
            - test-bootstrap-macos
            - coverage
            - validate-licenses
            - validate-changelog
      - build-darwin-arm64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-bootstrap-linux
            - test-bootstrap-windows
            - test-bootstrap-macos
            - coverage
            - validate-licenses
            - validate-changelog
      # ── Publicación — solo en tags v* ──
      - publish-release:
          context:
            - github-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build-windows-x64
            - build-linux-x64
            - build-linux-arm64
            - build-darwin-arm64
      - publish-metadata:
          context:
            - github-release
            - homebrew-tap
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - publish-release

  # ── Sonda de builds nativos (herramienta de diagnóstico, nunca publica) ──
  # Solo por API: POST /api/v2/project/gh/<org>/<repo>/pipeline con
  # {"branch":"main","parameters":{"native_cache_probe":true}}. Ejecuta los 4 build-* en modo `probe`: sin puertas,
  # sin publish-*, sin restaurar ni guardar target-*, sin empaquetado; con
  # --timings y el diagnóstico de CMake. Guarda sccache (por contenido). Sin
  # `requires` ni filtros de tags: corre en la rama indicada.
  native-cache-probe:
    when: << pipeline.parameters.native_cache_probe >>
    jobs:
      - build-windows-x64:
          probe: true
      - build-linux-x64:
          probe: true
      - build-linux-arm64:
          probe: true
      - build-darwin-arm64:
          probe: true
