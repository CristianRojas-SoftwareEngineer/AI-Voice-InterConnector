# Pipeline CircleCI Tier 1 — Rust nativo 3 SO (Linux/Windows/macOS)
# Triple puerta `cargo test --all` + `coverage` como gate de los 4 builds nativos.
# Artefactos: binarios Rust versionados vía `persist_to_workspace` → `publish-release`.
# Pines reproducibles: `rust_version` + digest de `cimg/rust` (ver §Reproducibilidad).
# Ver docs/BUILD.md §4 para arquitectura completa y docs/proposals/progress.md:340-346 para Fase 7.

version: 2.1

orbs:
  win: circleci/windows@5.0

# Fuente única de pines de toolchain Rust. Esta versión se interpola con
# << pipeline.parameters.rust_version >> en cada job Rust (no repetir literal).
# Bump de versión = editar solo aquí + actualizar digest de `cimg/rust` en las
# 4 referencias `image:` (obtenido vía `docker buildx imagetools inspect
# cimg/rust:<< pipeline.parameters.rust_version >>` o hub.docker.com, ver
# docs/BUILD.md §Reproducibilidad). Sin digest, el tag es flotante y pierde
# reproducibilidad; el digest congela el SO base + toolchain.
parameters:
  rust_version:
    type: string
    default: "1.96.0"
    description: >
      Versión exacta de Rust (toolchain) usada en todos los jobs Rust
      (cargo test/build). Espejo entre plataformas (Linux/Windows/macOS).

# Cachés duales compartidas por todos los jobs Rust (restore/save nativos,
# idénticos en bash y PowerShell). Separadas porque invalidan distinto:
# registry solo cambia con Cargo.lock; target además con el código.
commands:
  cargo_restore_caches:
    description: Restaura caché de registry/git y de target/ (con fallback parcial)
    steps:
      - restore_cache:
          keys:
            - cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v1-{{ arch }}-
      - restore_cache:
          keys:
            - target-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - target-v1-{{ arch }}-
  cargo_save_registry:
    description: Guarda registry/git antes de compilar (un fallo de test no pierde descargas)
    steps:
      - save_cache:
          key: cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
  cargo_save_target:
    description: Guarda target/ siempre (when always) — el parcial acelera el re-run
    steps:
      - save_cache:
          key: target-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - target
          when: always

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gate Rust — triple puerta simétrica (cargo test --all)
  # ──────────────────────────────────────────────────────────────
  test-linux:
    # Executor x86_64 Docker con Rust preinstalado. La suite es
    # arch-independiente y mockea el engine (whisper/Qwen no se ejercitan),
    # así que re-correrla en ARM64 no aportaría señal (ver docs/BUILD.md §4).
    # Es la arquitectura más barata/rápida disponible.
    docker:
      - image: cimg/rust:1.96.0 # TODO: pinnear por digest (ver parameters.rust_version)
    resource_class: medium
    steps:
      - checkout
      - run:
          # libclang-dev es REQUISITO de bindgen (whisper-rs-sys): sin él el
          # build-script muere con «Unable to find libclang» (pipeline #2).
          # cmake compila whisper.cpp; pkg-config expone ALSA a cpal.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches
      - run:
          name: Verificar toolchain Rust
          command: |
            echo "[STEP] Verificar toolchain Rust - INICIO"
            rustc --version
            cargo --version
            echo "rust_version parámetro: << pipeline.parameters.rust_version >>"
            echo "[STEP] Verificar toolchain Rust - FIN"
      - run:
          # Descarga TODAS las deps al registry antes de guardar su caché:
          # un fallo posterior de test no pierde las descargas.
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            cargo test --all --verbose
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - cargo_save_target

  test-windows:
    # Suite Rust en Windows nativo (cargo test --all). Puerta simétrica con
    # test-linux/macos: valida código específico de Windows (winsound, tray)
    # antes de compilar. Sin este gate, bugs de Windows solo se verían en build.
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Instalar Rust << pipeline.parameters.rust_version >> vía rustup
          command: |
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - INICIO"
            $ErrorActionPreference = "Stop"
            $RustVersion = "<< pipeline.parameters.rust_version >>"
            # rustup-init estático oficial (pin exacto, no choco): reproducible
            # e independiente del repo de Chocolatey; choco podría servir una
            # versión distinta sin cambio en el repo. Invoke-WebRequest no
            # setea $LASTEXITCODE: con ErrorActionPreference=Stop un fallo de
            # descarga lanza y aborta el step.
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain $RustVersion --profile minimal --no-modify-path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Prefijo de PATH SOLO para este step: los steps posteriores que
            # invocan cargo re-prefijan por sí mismos (PowerShell no tiene el
            # equivalente de $BASH_ENV).
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            rustc --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - FIN"
      - cargo_restore_caches
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            Write-Host "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo test --all --verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - cargo_save_target

  test-macos:
    # Suite Rust en macOS nativo (Apple Silicon, Xcode 26.4.0). Valida código
    # específico de macOS (afplay/CoreAudio, rutas POSIX, señales) — sin Mac
    # físico, este gate en CI es la única validación antes del usuario real.
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Instalar Rust << pipeline.parameters.rust_version >> vía rustup
          command: |
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - INICIO"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain << pipeline.parameters.rust_version >> --profile minimal
            echo 'source "$HOME/.cargo/env"' >> $BASH_ENV
            source "$HOME/.cargo/env"
            cargo --version
            rustc --version
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - FIN"
      - cargo_restore_caches
      - run:
          name: Instalar dependencias de sistema (cmake, pkg-config, libomp)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            # cmake y pkg-config pueden no estar en la imagen base de Xcode
            if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
            if ! command -v pkg-config >/dev/null 2>&1; then brew install pkg-config; fi
            cmake --version
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - run:
          # CTranslate2 (vía ct2rs) compila con OpenMP del compilador
          # (-DOPENMP_RUNTIME=COMP): Apple clang no trae libomp y CMake moría
          # con «OpenMP not found» (pipeline #2). Se instala vía Homebrew y se
          # exportan a $BASH_ENV las variables que consume FindOpenMP de CMake
          # en los steps posteriores (cargo test/build invocan cmake).
          name: Instalar libomp y exportar flags OpenMP para CMake
          command: |
            echo "[STEP] Instalar libomp y exportar flags OpenMP - INICIO"
            brew install libomp
            LIBOMP_PREFIX="$(brew --prefix libomp)"
            {
              echo "export OpenMP_C_FLAGS=\"-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include\""
              echo "export OpenMP_CXX_FLAGS=\"-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include\""
              echo "export OpenMP_C_LIB_NAMES=\"omp\""
              echo "export OpenMP_CXX_LIB_NAMES=\"omp\""
              echo "export OpenMP_omp_LIBRARY=\"${LIBOMP_PREFIX}/lib/libomp.dylib\""
            } >> $BASH_ENV
            source $BASH_ENV
            brew list --versions libomp
            echo "[STEP] Instalar libomp y exportar flags OpenMP - FIN"
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            source "$HOME/.cargo/env"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            source "$HOME/.cargo/env"
            cargo test --all --verbose
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - cargo_save_target

  coverage:
    # Job de cobertura Rust (cargo-llvm-cov, LLVM instrumentation). Corre solo
    # en Linux x86_64: coverage es agnóstico de SO, duplicarlo triplicaría coste
    # sin señal nueva (ver docs/BUILD.md §4). Reemplaza a pytest-cov; genera
    # lcov.info y resumen por líneas. Sin gate de % aún — solo valida que la
    # instrumentación no rompa la suite; el gate por módulo se añadirá con
    # `cargo llvm-cov --fail-under-lines` cuando se defina el umbral.
    docker:
      - image: cimg/rust:1.96.0 # TODO: pinnear por digest
    resource_class: medium
    steps:
      - checkout
      - run:
          # libclang-dev: requisito de bindgen (whisper-rs-sys), igual que en
          # test-linux — llvm-cov compila la misma workspace.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Instalar cargo-llvm-cov
          command: |
            echo "[STEP] Instalar cargo-llvm-cov - INICIO"
            rustup component add llvm-tools-preview
            cargo install cargo-llvm-cov --locked
            cargo llvm-cov --version
            echo "[STEP] Instalar cargo-llvm-cov - FIN"
      - run:
          name: Ejecutar suite con cobertura (cargo llvm-cov)
          command: |
            echo "[STEP] Ejecutar suite con cobertura - INICIO"
            # Genera lcov.info y resumen por líneas; falla si no hay tests
            cargo llvm-cov --workspace --lcov --output-path lcov.info --verbose
            cargo llvm-cov --workspace --summary-only
            echo "[STEP] Ejecutar suite con cobertura - FIN"
      - store_artifacts:
          path: lcov.info
          destination: coverage-lcov
      - cargo_save_target

  # ──────────────────────────────────────────────────────────────
  # Smoke tests de instaladores de una línea (mock por PATH, sin red)
  # Valida lógica de parsing de release, checksums y guards sin descargar.
  # ──────────────────────────────────────────────────────────────
  test-installer-linux:
    # Valida install-linux.sh sin red real, mockeando curl/uname/sha256sum
    # por PATH (tests/installer/). Decisión consciente: el flujo real se
    # valida en el proceso de release y en los smoke tests de los builds.
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Instalar bats-core
          command: |
            echo "[STEP] Instalar bats-core - INICIO"
            sudo apt-get update
            sudo apt-get install -y bats
            echo "[STEP] Instalar bats-core - FIN"
      - run:
          name: Ejecutar smoke-test install-linux.sh (bats)
          command: |
            echo "[STEP] Ejecutar smoke-test install-linux.sh (bats) - INICIO"
            bats tests/installer/install-linux.bats
            echo "[STEP] Ejecutar smoke-test install-linux.sh (bats) - FIN"

  test-installer-windows:
    # Smoke-test de install-windows.ps1 con Pester v5 pineado (el executor
    # trae Pester 3.x; un release nuevo no debe romper el job sin cambios).
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Instalar Pester (pineado 5.8.0)
          command: |
            Write-Host "[STEP] Instalar Pester (pineado 5.8.0) - INICIO"
            Install-Module Pester -RequiredVersion 5.8.0 -Force -SkipPublisherCheck -Scope CurrentUser
            if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Instalar Pester (pineado 5.8.0) - FIN"
      - run:
          name: Ejecutar smoke-test install-windows.ps1 (Pester)
          command: |
            Write-Host "[STEP] Ejecutar smoke-test install-windows.ps1 (Pester) - INICIO"
            Import-Module Pester -RequiredVersion 5.8.0
            Invoke-Pester tests/installer/install-windows.tests.ps1 -CI
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Ejecutar smoke-test install-windows.ps1 (Pester) - FIN"

  test-installer-macos:
    # Smoke-test de install-macos.sh en el executor macOS real (bats): única
    # validación del shell nativo de la plataforma sin un Mac físico.
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Instalar bats-core
          command: |
            echo "[STEP] Instalar bats-core - INICIO"
            brew install bats-core
            echo "[STEP] Instalar bats-core - FIN"
      - run:
          name: Ejecutar smoke-test install-macos.sh (bats)
          command: |
            echo "[STEP] Ejecutar smoke-test install-macos.sh (bats) - INICIO"
            bats tests/installer/install-macos.bats
            echo "[STEP] Ejecutar smoke-test install-macos.sh (bats) - FIN"

  # ──────────────────────────────────────────────────────────────
  # Builds nativos Rust — 4 targets de distribución (cargo build --release)
  # Cada build hace smoke test (version + voice list) y stagea el binario
  # versionado al workspace para publish-release. Requieren triple puerta +
  # coverage + instaladores (ver workflow build-all).
  # ──────────────────────────────────────────────────────────────
  build-windows-x64:
    # Windows x64: binario + smoke test nativo. No usa Inno Setup aún (el
    # bundle nativo scripts/build_release_native.py se invocará en Fase 7.2).
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Instalar Rust << pipeline.parameters.rust_version >> vía rustup
          command: |
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - INICIO"
            $ErrorActionPreference = "Stop"
            $RustVersion = "<< pipeline.parameters.rust_version >>"
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain $RustVersion --profile minimal --no-modify-path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Prefijo de PATH SOLO para este step: los steps posteriores que
            # invocan cargo re-prefijan por sí mismos (PowerShell no tiene el
            # equivalente de $BASH_ENV).
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo --version
            rustc --version
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - FIN"
      - cargo_restore_caches
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            Write-Host "[STEP] Compilar binario release (cargo build --release) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo build --release --verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Compilar binario release (cargo build --release) - FIN"
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            Write-Host "[STEP] Smoke test target/release/ai-voice-interconnector.exe - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            $Exe = "target\release\ai-voice-interconnector.exe"
            if (-not (Test-Path $Exe)) { throw "Binario no encontrado: $Exe" }
            & $Exe version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Valida que la voz de fábrica 'default' quede registrada en un
            # runner limpio (voice list no carga el modelo y auto-inicializa
            # el store). El CLI imprime '  - default (fábrica)': se compara por
            # prefijo con -like (nunca -notmatch sobre array: filtra en vez de
            # dar booleano).
            $voiceList = & $Exe voice list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($voiceList | Where-Object { $_ -like '  - default*' })) { throw "La voz de fábrica 'default' no está registrada" }
            Write-Host "Binario Windows OK: version + voice list"
            Write-Host "[STEP] Smoke test target/release/ai-voice-interconnector.exe - FIN"
      - cargo_save_target
      - run:
          # Nombre del artefacto con la versión REAL del CLI: la fuente de
          # verdad es `const VERSION` en src/main.rs (desacoplada de Cargo.toml,
          # que quedó en 0.1.0 tras la migración). Fail-fast: si difiere del tag
          # v*, el release saldría con nombre inconsistente → abortar.
          name: Preparar artefacto versionado (staging)
          command: |
            Write-Host "[STEP] Preparar artefacto versionado - INICIO"
            $ErrorActionPreference = "Stop"
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            $Version = [regex]::Match((Get-Content src\main.rs -Raw), 'const VERSION: &str = "([^"]+)"').Groups[1].Value
            if (-not $Version) { throw "No se pudo extraer const VERSION de src/main.rs" }
            $TagVersion = $env:CIRCLE_TAG -replace '^v',''
            if ($Version -ne $TagVersion) { throw "VERSION en main.rs ($Version) != tag ($TagVersion)" }
            $Src = "target\release\ai-voice-interconnector.exe"
            $Dst = "artifacts\ai-voice-interconnector-$Version-x86_64-windows.exe"
            if (-not (Test-Path $Src)) { throw "Binario no encontrado: $Src" }
            Copy-Item $Src $Dst
            Write-Host "Artefacto: $Dst"
            Write-Host "[STEP] Preparar artefacto versionado - FIN"
      - run:
          name: Emitir SHA-256 del artefacto
          command: |
            Write-Host "[STEP] Emitir SHA-256 del artefacto - INICIO"
            Get-FileHash artifacts\ai-voice-interconnector-*-x86_64-windows.exe -Algorithm SHA256
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Emitir SHA-256 del artefacto - FIN"
      - persist_to_workspace:
          root: artifacts
          paths:
            - ai-voice-interconnector-*-x86_64-windows.exe

  build-linux-x64:
    # Linux x64: el más barato/rápido para la suite, pero el build necesita
    # `large` (8 GB RAM): el linking de whisper-rs + tokio + cpal +
    # ct2rs supera los 4 GB de `medium` (OOM silencioso). Simetría con
    # docs/BUILD.md §4 — `large` trae 4 vCPU de regalo no aprovechados.
    docker:
      - image: cimg/rust:1.96.0 # TODO: pinnear por digest
    resource_class: large
    steps:
      - checkout
      - run:
          # patchelf lo necesita el bundling de AppImage (legado); libclang-dev
          # es requisito de bindgen (whisper-rs-sys), igual que en test-linux.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev, patchelf)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev patchelf
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            echo "[STEP] Compilar binario release (cargo build --release) - INICIO"
            cargo build --release --verbose
            echo "[STEP] Compilar binario release (cargo build --release) - FIN"
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - INICIO"
            test -x target/release/ai-voice-interconnector || (echo "Binario no encontrado" && exit 1)
            target/release/ai-voice-interconnector version
            # Valida la voz de fábrica 'default' (runner limpio: voice list
            # auto-inicializa el store y no carga el modelo). Prefijo '^  - default'
            # tolera el sufijo '(fábrica)' del CLI Rust sin aceptar otras voces.
            target/release/ai-voice-interconnector voice list | grep -q '^  - default'
            echo "Binario Linux x64 OK: version + voice list"
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - FIN"
      - cargo_save_target
      - run:
          # Nombre del artefacto con la versión REAL del CLI: la fuente de
          # verdad es `const VERSION` en src/main.rs (desacoplada de Cargo.toml,
          # que quedó en 0.1.0 tras la migración). Fail-fast contra el tag.
          name: Preparar artefacto versionado (staging)
          command: |
            echo "[STEP] Preparar artefacto versionado - INICIO"
            set -euo pipefail
            mkdir -p artifacts
            VERSION=$(sed -n 's/^const VERSION: &str = "\(.*\)";/\1/p' src/main.rs)
            if [ -z "$VERSION" ]; then echo "ERROR: const VERSION no encontrada en src/main.rs" >&2; exit 1; fi
            if [ "$VERSION" != "${CIRCLE_TAG#v}" ]; then
              echo "ERROR: VERSION en main.rs ($VERSION) != tag (${CIRCLE_TAG#v})" >&2
              exit 1
            fi
            SRC="target/release/ai-voice-interconnector"
            DST="artifacts/ai-voice-interconnector-${VERSION}-x86_64-linux"
            test -x "$SRC" || (echo "Binario no encontrado: $SRC" && exit 1)
            cp "$SRC" "$DST"
            chmod +x "$DST"
            echo "Artefacto: $DST"
            echo "[STEP] Preparar artefacto versionado - FIN"
      - run:
          name: Emitir SHA-256 del artefacto
          command: |
            echo "[STEP] Emitir SHA-256 del artefacto - INICIO"
            sha256sum artifacts/ai-voice-interconnector-*-x86_64-linux
            echo "[STEP] Emitir SHA-256 del artefacto - FIN"
      - persist_to_workspace:
          root: artifacts
          paths:
            - ai-voice-interconnector-*-x86_64-linux

  build-linux-arm64:
    # Linux ARM64 nativo (no cross-compile): Docker arm.medium ejecuta
    # aarch64 real, evitando toolchain de cross-compilación y sysroot.
    # Sin test-linux-arm64 (suite mockeada arch-independiente), el smoke
    # test de este build es el único gate del stack aarch64 (wheels nativas).
    docker:
      - image: cimg/rust:1.96.0 # TODO: pinnear por digest
    resource_class: arm.medium
    steps:
      - checkout
      - run:
          # patchelf lo necesita el bundling de AppImage (legado); libclang-dev
          # es requisito de bindgen (whisper-rs-sys), igual que en test-linux.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev, patchelf)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev patchelf
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            echo "[STEP] Compilar binario release (cargo build --release) - INICIO"
            cargo build --release --verbose
            echo "[STEP] Compilar binario release (cargo build --release) - FIN"
      - run:
          # Gate de facto ARM64: no hay test-linux-arm64 (suite mockeada),
          # así que este smoke test es la única validación del stack aarch64.
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - INICIO"
            test -x target/release/ai-voice-interconnector || (echo "Binario no encontrado" && exit 1)
            target/release/ai-voice-interconnector version
            # Valida la voz de fábrica 'default' (runner limpio: voice list
            # auto-inicializa el store y no carga el modelo). Prefijo '^  - default'
            # tolera el sufijo '(fábrica)' del CLI Rust sin aceptar otras voces.
            target/release/ai-voice-interconnector voice list | grep -q '^  - default'
            echo "Binario Linux ARM64 OK: version + voice list"
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - FIN"
      - cargo_save_target
      - run:
          # Nombre del artefacto con la versión REAL del CLI: la fuente de
          # verdad es `const VERSION` en src/main.rs (desacoplada de Cargo.toml,
          # que quedó en 0.1.0 tras la migración). Fail-fast contra el tag.
          name: Preparar artefacto versionado (staging)
          command: |
            echo "[STEP] Preparar artefacto versionado - INICIO"
            set -euo pipefail
            mkdir -p artifacts
            VERSION=$(sed -n 's/^const VERSION: &str = "\(.*\)";/\1/p' src/main.rs)
            if [ -z "$VERSION" ]; then echo "ERROR: const VERSION no encontrada en src/main.rs" >&2; exit 1; fi
            if [ "$VERSION" != "${CIRCLE_TAG#v}" ]; then
              echo "ERROR: VERSION en main.rs ($VERSION) != tag (${CIRCLE_TAG#v})" >&2
              exit 1
            fi
            SRC="target/release/ai-voice-interconnector"
            DST="artifacts/ai-voice-interconnector-${VERSION}-arm64-linux"
            test -x "$SRC" || (echo "Binario no encontrado: $SRC" && exit 1)
            cp "$SRC" "$DST"
            chmod +x "$DST"
            echo "Artefacto: $DST"
            echo "[STEP] Preparar artefacto versionado - FIN"
      - run:
          name: Emitir SHA-256 del artefacto
          command: |
            echo "[STEP] Emitir SHA-256 del artefacto - INICIO"
            sha256sum artifacts/ai-voice-interconnector-*-arm64-linux
            echo "[STEP] Emitir SHA-256 del artefacto - FIN"
      - persist_to_workspace:
          root: artifacts
          paths:
            - ai-voice-interconnector-*-arm64-linux

  build-darwin-arm64:
    # macOS ARM64 (Apple Silicon, Xcode 26.4.0): clang nativo, sin cross.
    # El binario se valida con smoke test version + voice list (no carga modelo).
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Instalar Rust << pipeline.parameters.rust_version >> vía rustup
          no_output_timeout: 10m
          command: |
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - INICIO"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain << pipeline.parameters.rust_version >> --profile minimal
            echo 'source "$HOME/.cargo/env"' >> $BASH_ENV
            source "$HOME/.cargo/env"
            cargo --version
            rustc --version
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_version >> vía rustup - FIN"
      - run:
          name: Instalar dependencias de sistema (cmake, pkg-config, libomp)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
            if ! command -v pkg-config >/dev/null 2>&1; then brew install pkg-config; fi
            cmake --version
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - run:
          # CTranslate2 (vía ct2rs) compila con OpenMP del compilador: Apple
          # clang no trae libomp y CMake moría con «OpenMP not found»
          # (pipeline #2). Mismo fix que en test-macos — ver comentario allí.
          name: Instalar libomp y exportar flags OpenMP para CMake
          command: |
            echo "[STEP] Instalar libomp y exportar flags OpenMP - INICIO"
            brew install libomp
            LIBOMP_PREFIX="$(brew --prefix libomp)"
            {
              echo "export OpenMP_C_FLAGS=\"-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include\""
              echo "export OpenMP_CXX_FLAGS=\"-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include\""
              echo "export OpenMP_C_LIB_NAMES=\"omp\""
              echo "export OpenMP_CXX_LIB_NAMES=\"omp\""
              echo "export OpenMP_omp_LIBRARY=\"${LIBOMP_PREFIX}/lib/libomp.dylib\""
            } >> $BASH_ENV
            source $BASH_ENV
            brew list --versions libomp
            echo "[STEP] Instalar libomp y exportar flags OpenMP - FIN"
      - cargo_restore_caches
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            source "$HOME/.cargo/env"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            echo "[STEP] Compilar binario release (cargo build --release) - INICIO"
            source "$HOME/.cargo/env"
            cargo build --release --verbose
            echo "[STEP] Compilar binario release (cargo build --release) - FIN"
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - INICIO"
            source "$HOME/.cargo/env"
            test -x target/release/ai-voice-interconnector || (echo "Binario no encontrado" && exit 1)
            target/release/ai-voice-interconnector version
            # Valida la voz de fábrica 'default' (runner limpio: voice list
            # auto-inicializa el store y no carga el modelo). Prefijo '^  - default'
            # tolera el sufijo '(fábrica)' del CLI Rust sin aceptar otras voces.
            target/release/ai-voice-interconnector voice list | grep -q '^  - default'
            echo "Binario macOS ARM64 OK: version + voice list"
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - FIN"
      - cargo_save_target
      - run:
          # Nombre del artefacto con la versión REAL del CLI: la fuente de
          # verdad es `const VERSION` en src/main.rs (desacoplada de Cargo.toml,
          # que quedó en 0.1.0 tras la migración). Fail-fast contra el tag.
          name: Preparar artefacto versionado (staging)
          command: |
            echo "[STEP] Preparar artefacto versionado - INICIO"
            set -euo pipefail
            mkdir -p artifacts
            VERSION=$(sed -n 's/^const VERSION: &str = "\(.*\)";/\1/p' src/main.rs)
            if [ -z "$VERSION" ]; then echo "ERROR: const VERSION no encontrada en src/main.rs" >&2; exit 1; fi
            if [ "$VERSION" != "${CIRCLE_TAG#v}" ]; then
              echo "ERROR: VERSION en main.rs ($VERSION) != tag (${CIRCLE_TAG#v})" >&2
              exit 1
            fi
            SRC="target/release/ai-voice-interconnector"
            DST="artifacts/ai-voice-interconnector-${VERSION}-arm64-macos"
            test -x "$SRC" || (echo "Binario no encontrado: $SRC" && exit 1)
            cp "$SRC" "$DST"
            chmod +x "$DST"
            echo "Artefacto: $DST"
            echo "[STEP] Preparar artefacto versionado - FIN"
      - run:
          name: Emitir SHA-256 del artefacto
          command: |
            echo "[STEP] Emitir SHA-256 del artefacto - INICIO"
            shasum -a 256 artifacts/ai-voice-interconnector-*-arm64-macos
            echo "[STEP] Emitir SHA-256 del artefacto - FIN"
      - persist_to_workspace:
          root: artifacts
          paths:
            - ai-voice-interconnector-*-arm64-macos

  # ──────────────────────────────────────────────────────────────
  # CD — publicación del GitHub Release (Rust nativo, 4 binarios)
  # ──────────────────────────────────────────────────────────────
  publish-release:
    # Recolecta los 4 binarios Rust versionados por workspace (no `gh run
    # download`: determinista, sin token API CircleCI), genera SHA256SUMS.txt
    # y publica el GitHub Release directo (sin borrador). Solo en tags v*.
    # Requiere context `github-release` con GH_TOKEN (contents:write).
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: artifacts
      - run:
          name: Instalar gh CLI (repo apt oficial, firmado)
          command: |
            echo "[STEP] Instalar gh CLI - INICIO"
            set -euo pipefail
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -nv -O- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
            echo "[STEP] Instalar gh CLI - FIN"
      - run:
          name: Generar SHA256SUMS.txt sobre artefactos del workspace
          command: |
            echo "[STEP] Generar SHA256SUMS.txt - INICIO"
            set -euo pipefail
            cd artifacts
            sha256sum ai-voice-interconnector-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
            echo "Artefactos recolectados:"
            ls -lh ai-voice-interconnector-*
            echo "[STEP] Generar SHA256SUMS.txt - FIN"
      - run:
          name: Extraer notas de release desde CHANGELOG
          command: |
            echo "[STEP] Extraer notas de release desde CHANGELOG - INICIO"
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            awk -v ver="## [$VERSION]" '
              index($0, ver) == 1 { grab=1; print; next }
              grab && /^## \[/ { exit }
              grab && /^\[[^][]*\]:/ { exit }
              grab { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "ERROR: no se encontró la sección [$VERSION] en CHANGELOG.md" >&2
              exit 1
            fi
            cat notes.md
            echo "[STEP] Extraer notas de release desde CHANGELOG - FIN"
      - run:
          name: Anexar pie de oferta GPLv3 a notas
          command: |
            echo "[STEP] Anexar pie de oferta GPLv3 - INICIO"
            set -euo pipefail
            {
              echo ""
              echo "---"
              echo ""
              echo "## Código fuente (oferta GPLv3 §6)"
              echo ""
              echo "Este release se distribuye bajo **GPL-3.0-or-later**. El código"
              echo "fuente correspondiente a este tag está disponible en:"
              echo ""
              echo "- Tarball de fuente: https://github.com/CristianRojas-SoftwareEngineer/AI-Voice-InterConnector/archive/refs/tags/${CIRCLE_TAG}.tar.gz"
              echo "- Etiqueta del release: https://github.com/CristianRojas-SoftwareEngineer/AI-Voice-InterConnector/releases/tag/${CIRCLE_TAG}"
            } >> notes.md
            echo "[STEP] Anexar pie de oferta GPLv3 - FIN"
      - run:
          name: Publicar GitHub Release con 4 binarios + SHA256SUMS
          command: |
            echo "[STEP] Publicar GitHub Release - INICIO"
            set -euo pipefail
            gh release create "$CIRCLE_TAG" \
              artifacts/ai-voice-interconnector-* artifacts/SHA256SUMS.txt \
              --title "$CIRCLE_TAG" \
              --notes-file notes.md
            echo "[STEP] Publicar GitHub Release - FIN"

  publish-metadata:
    # Actualiza el Cask de Homebrew tras cada Release (solo macOS). Requiere
    # contexts `github-release` y `homebrew-tap`. El Cask inicial es bootstrap
    # manual. NOTA Fase 7.1: `render_cask.py` aún espera `*.dmg` (legado
    # PyInstaller); con binario Rust crudo `*-arm64-macos` el SHA del Cask debe
    # adaptarse en la siguiente entrega (generar .dmg o tar.gz, o cambiar Cask
    # a `binary` stanza). Hasta entonces, este job fallará si el .dmg no existe.
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Instalar gh CLI (repo apt oficial, firmado)
          command: |
            echo "[STEP] Instalar gh CLI - INICIO"
            set -euo pipefail
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -nv -O- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh git python3 ruby
            echo "[STEP] Instalar gh CLI - FIN"
      - run:
          name: Descargar SHA256SUMS.txt del release recién publicado
          command: |
            echo "[STEP] Descargar SHA256SUMS.txt del release - INICIO"
            set -euo pipefail
            gh release download "$CIRCLE_TAG" -R "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              -p SHA256SUMS.txt --dir /tmp/release-metadata
            cat /tmp/release-metadata/SHA256SUMS.txt
            echo "[STEP] Descargar SHA256SUMS.txt del release - FIN"
      - run:
          name: Renderizar Casks/ai-voice-interconnector.rb
          command: |
            echo "[STEP] Renderizar Cask - INICIO"
            set -euo pipefail
            python3 scripts/render_cask.py \
              --tag "$CIRCLE_TAG" \
              --sums-file /tmp/release-metadata/SHA256SUMS.txt \
              --out /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            cat /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            echo "[STEP] Renderizar Cask - FIN"
      - run:
          name: Verificar sintaxis del Cask (ruby -c)
          command: |
            echo "[STEP] Verificar sintaxis del Cask - INICIO"
            ruby -c /tmp/tap-clone/Casks/ai-voice-interconnector.rb
            echo "[STEP] Verificar sintaxis del Cask - FIN"
      - run:
          name: Clonar tap, commitear Cask y empujar
          command: |
            echo "[STEP] Clonar tap, commitear Cask y empujar - INICIO"
            set -euo pipefail
            RENDERED="/tmp/tap-clone/Casks/ai-voice-interconnector.rb"
            git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/CristianRojas-SoftwareEngineer/homebrew-ai-voice-interconnector.git" /tmp/tap-repo
            mkdir -p /tmp/tap-repo/Casks
            cp "$RENDERED" /tmp/tap-repo/Casks/ai-voice-interconnector.rb
            cd /tmp/tap-repo
            git config user.name "ai-voice-interconnector-ci"
            git config user.email "ci@ai-voice-interconnector.invalid"
            git add Casks/ai-voice-interconnector.rb
            if git diff --cached --quiet; then
              echo "Cask sin cambios (regeneración idempotente); nada que empujar."
            else
              git commit -m "Cask: actualizar a ${CIRCLE_TAG}"
              git push origin HEAD:main
            fi
            echo "[STEP] Clonar tap, commitear Cask y empujar - FIN"

  # ──────────────────────────────────────────────────────────────
  # Canal Python (legado) — se retirará en Fase 7 paso 4
  # Mantiene compatibilidad hasta que `publish-pypi` sea eliminado y el
  # repo quede 100% Rust. Requiere jobs Rust como gate para evitar
  # publicar Python si Rust está roto.
  # ──────────────────────────────────────────────────────────────
  publish-pypi:
    docker:
      - image: cimg/python:3.13@sha256:9d189f873178a2bea234b7d51e31e1ae01a73646e962cf697f757b588f8d77b6
    steps:
      - checkout
      - run:
          name: Instalar tooling de build (build, twine)
          command: |
            echo "[STEP] Instalar tooling de build (build, twine) - INICIO"
            pip install build==1.2.2.post1 twine==6.1.0
            echo "[STEP] Instalar tooling de build (build, twine) - FIN"
      - run:
          name: Compilar sdist y wheel
          command: |
            echo "[STEP] Compilar sdist y wheel - INICIO"
            python -m build
            echo "[STEP] Compilar sdist y wheel - FIN"
      - run:
          name: Validar metadata del paquete (twine check)
          command: |
            echo "[STEP] Validar metadata del paquete (twine check) - INICIO"
            twine check dist/*
            echo "[STEP] Validar metadata del paquete (twine check) - FIN"
      - run:
          name: Smoke test del wheel en venv limpio
          command: |
            echo "[STEP] Smoke test del wheel en venv limpio - INICIO"
            set -euo pipefail
            python -m venv /tmp/smoke-venv
            source /tmp/smoke-venv/bin/activate
            pip install dist/*.whl
            EXPECTED_VERSION="${CIRCLE_TAG#v}"
            ACTUAL_VERSION="$(ai-voice-interconnector version --json | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
            if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "ERROR: versión del wheel ($ACTUAL_VERSION) no coincide con tag ($EXPECTED_VERSION)" >&2
              exit 1
            fi
            python -c "from ai_voice_interconnector import voices; assert 'default' in voices.list_voices(), 'voz default ausente del wheel'"
            deactivate
            echo "[STEP] Smoke test del wheel en venv limpio - FIN"
      - run:
          name: Publicar en PyPI (twine upload)
          command: |
            echo "[STEP] Publicar en PyPI (twine upload) - INICIO"
            TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" twine upload --skip-existing dist/*
            echo "[STEP] Publicar en PyPI (twine upload) - FIN"

workflows:
  build-all:
    # CircleCI NO ejecuta un job en un tag salvo que el job Y todas sus
    # dependencias declaren `filters.tags`; por eso el filtro `v*` se propaga
    # por toda la cadena (gates Rust/instaladores → builds → publish-*).
    # Todos los jobs declaran además `branches: ignore /.*/`: el pipeline
    # completo corre SOLO en tags `v*`, nunca en pushes de rama (contrato del
    # pipeline Python legacy preservado; validación local previa al tag vía
    # docs/BUILD.md).
    jobs:
      # ── Gates Rust (triple puerta) + cobertura + instaladores ──
      # Los 4 builds requieren estos 7 gates verdes en la misma pipeline.
      - test-linux:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - coverage:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-installer-linux:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-installer-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - test-installer-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      # ── Builds nativos Rust (requieren triple puerta + cobertura + instaladores) ──
      - build-windows-x64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-installer-linux
            - test-installer-windows
            - test-installer-macos
            - coverage
      - build-linux-x64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-installer-linux
            - test-installer-windows
            - test-installer-macos
            - coverage
      - build-linux-arm64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-installer-linux
            - test-installer-windows
            - test-installer-macos
            - coverage
      - build-darwin-arm64:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - test-installer-linux
            - test-installer-windows
            - test-installer-macos
            - coverage
      # ── Publicación — solo en tags v* ──
      - publish-release:
          context:
            - github-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - build-windows-x64
            - build-linux-x64
            - build-linux-arm64
            - build-darwin-arm64
      - publish-metadata:
          context:
            - github-release
            - homebrew-tap
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - publish-release
      - publish-pypi:
          context:
            - pypi-publish
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test-linux
            - test-windows
            - test-macos
            - coverage
