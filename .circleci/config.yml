# Pipeline CircleCI Tier 1 — Rust nativo 3 SO (Linux/Windows/macOS)
# UN pipeline de release (`build-all`), disparado SOLO en tags v* (ver
# `workflows:`): la triple puerta `cargo test --all` por plataforma
# (test-linux/windows/macos) es gate mecánico de los 4 builds, de modo que la
# publicación queda condicionada a los tests dentro de la MISMA pipeline
# (CircleCI no encadena pipelines distintas). Empaquetado + publicación tras
# los gates + `coverage` + instaladores + licencias/changelog.
# El trabajo diario vive en `main` (trunk-based); sus commits no disparan CI.
# Segundo punto de entrada, solo por API: el workflow `native-cache-probe`
# (parámetro `native_cache_probe`) mide los 4 build-* sin publicar nunca.
# Artefactos: archivos comprimidos (tar.gz/zip) con binario Rust + documentos de
# licencia, versionados vía `persist_to_workspace` → `publish-release`.
# Pines reproducibles: `rust_pin` + `ort_pin` + digest de `cimg/rust`.

version: 2.1

orbs:
  win: circleci/windows@5.0

# Espejo del pin de Rust: la fuente única es `packaging/pins.json` y este
# parámetro la espeja porque se interpola con
# << pipeline.parameters.rust_pin >> en cada job Rust (no repetir literal).
# Bump de versión = editar el JSON (el validador falla si divergen) +
# actualizar el digest de `cimg/rust` en las 7 referencias `image:`
# (obtenido vía `docker buildx imagetools inspect
# cimg/rust:<< pipeline.parameters.rust_pin >>` o hub.docker.com). Sin digest,
# el tag es flotante y pierde
# reproducibilidad; el digest congela el SO base + toolchain.
parameters:
  rust_pin:
    type: string
    default: "1.96.0"
    description: >
      Versión exacta de Rust (toolchain) usada en todos los jobs Rust
      (cargo test/build). Espejo entre plataformas (Linux/Windows/macOS).
  # Pines del toolchain C del motor TTS en Windows (MSYS2 UCRT64). Espejan a
  # `packaging/pins.json`, que es la fuente única. El release base fija un
  # snapshot reproducible; la caché de C:\msys64 (msys2_*_cache) es el
  # mecanismo de determinismo, y el assert de gcc en el bootstrap ataja el
  # drift upstream en caché fría. Bump = editar el JSON (invalida la caché por
  # clave).
  msys2_base_pin:
    type: string
    default: "2026-06-11"
    description: >
      Release del instalador base de MSYS2 (github.com/msys2/msys2-installer) del
      que se extrae C:\msys64. Debe ser posterior a la publicación de gcc del pin.
  msys2_gcc_pin:
    type: string
    default: "16.2.0"
    description: Versión de gcc UCRT64 (ancla de la GCC Runtime Library Exception).
  msys2_openblas_pin:
    type: string
    default: "0.3.34-1"
    description: Versión de mingw-w64-ucrt-x86_64-openblas.
  msys2_make_pin:
    type: string
    default: "4.4.1-5"
    description: Versión de make/mingw32-make (mingw-w64-ucrt-x86_64-make).
  ort_pin:
    type: string
    default: "1.28.0"
    description: Versión de ONNX Runtime (pareja de ort 2.0.0-rc.13) empaquetada en los 4 builds.
  # Sonda de builds nativos: solo se activa por API (POST /pipeline con
  # `native_cache_probe: true`). Ejecuta únicamente los 4 build-* en modo
  # `probe` (sin target-*, sin empaquetado) y excluye `build-all`, así que
  # NUNCA publica. Ver workflow `native-cache-probe`.
  native_cache_probe:
    type: boolean
    default: false
    description: Activa el workflow de sonda native-cache-probe (solo por API; nunca publica).
  ninja_pin:
    type: string
    default: "1.13.2"
    description: Versión de Ninja (release oficial ninja-win.zip) usada como generador CMake en Windows.
  sccache_cache_size:
    type: string
    default: "3G"
    description: >
      Tamaño máximo de la caché local de sccache (SCCACHE_CACHE_SIZE) en todos
      los jobs que la activan. Al superarlo, sccache desaloja por LRU los objetos
      sin uso; debe holgar sobre el working set de la variante más grande.
  bats_pin:
    type: string
    default: "1.14.0"
    description: >
      Versión de bats-core de la suite del bootstrap (Linux y macOS).
      Se instala desde el tag de git en $HOME/.local y la instalación aborta si
      `bats --version` no coincide: misma versión en ambos SO, sin apt/brew.
  pwsh_pin:
    type: string
    default: "7.6.6"
    description: >
      Versión de PowerShell 7 con la que la suite de Windows ejecuta
      `irm | iex` (además de Windows PowerShell 5.1). Se instala desde el zip
      del release oficial en C:\pwsh y el paso aborta si `pwsh` informa una
      versión distinta.

# Cachés compartidas por los jobs Rust (restore/save nativos, idénticos en bash
# y PowerShell). Ninguna clave depende del código fuente del workspace: editar
# src/ o crates/* restaura el mismo target/, y cargo recompila los crates del
# workspace (Dirty por mtime tras el checkout) con ayuda de sccache.
#
# Clave normalizada: la clave exacta de registry y target se computa del checksum
# de `Cargo.lock.cachekey`, un lock efímero que genera `perl` neutralizando la
# línea `version` del propio crate. Así el bump de cada release no cambia la
# clave; solo la cambian dependencias reales.
# Invalidación por familia de caché:
#   - registry (cargo-v2): cambia con dependencias reales en Cargo.lock;
#     conserva fallback por prefijo.
#   - target (v5): cambia con dependencias reales en Cargo.lock y con el tree hash
#     git de vendor/cmake-0.1.58 y de vendor/hf-hub-1.0.0. Clave exacta SIN
#     fallback: un acierto garantiza que lo compilado corresponde a los parches
#     actuales, así que su mtime se fija tras restaurar y cargo no los marca Dirty.
#   - toolchain (v1): cambia con rust_pin.
#   - msys2 (v1): cambia con los pines de versión MSYS2 (solo build-windows-x64).
#   - sccache (v1): rolling con epoch, por variant.
#   - ort-bundle (v1): cambia con ort_pin (solo build-windows-x64).
#   - tts (v1): cambia con checksum de vendor/qwen3-tts/.engine-cachekey + msys2
#     gcc/openblas (solo build-windows-x64).
commands:
  cargo_restore_caches:
    description: Restaura caché de registry/git y de target/ (clave exacta, sin fallback)
    # `variant` discrimina el feature set del target/ (test featureless, full con
    # C++, cov instrumentado): sin él, jobs de distinta variante colisionan en una
    # clave inmutable (first-write-wins) y se envenenan mutuamente. El registry
    # (cargo-v2-…) NO lleva variante: es independiente del feature set.
    # `os` discrimina el sistema operativo: target/ es triple-específico
    # (x86_64-unknown-linux-gnu vs x86_64-pc-windows-msvc vs aarch64-apple-darwin)
    # y sin él Linux/Windows/macOS se pisan mutuamente (0% sccache hits en Windows).
    #
    # Identidad de vendor/cmake-0.1.58 y vendor/hf-hub-1.0.0: `[patch.crates-io]`
    # apunta a copias locales, que cargo fingerprintea por mtime. El checkout les
    # da mtime nuevo en cada corrida, las marca Dirty y arrastra la re-ejecución
    # de lo que dependa de ellas (para cmake, toda la cadena nativa: aws-lc-sys,
    # onednn-src, sentencepiece-sys, ct2rs…). Por eso la clave exacta de la caché
    # de `target/` incluye el tree hash git de ambos parches y NO tiene fallback por prefijo:
    # un acierto garantiza que lo compilado en target/ corresponde al contenido
    # actual de los parches, y fijar su mtime antiguo es seguro sin comparar
    # nada. Un fallo de caché deja target/ vacío, donde la fijación es inocua. El
    # hash se toma con `git rev-parse` y no con `find | sort`: en Windows el PATH
    # resuelve `sort` al sort.exe de System32, que no entiende las opciones POSIX.
    # `/usr/bin/find` se usa por la misma razón (el find.exe de Windows).
    #
    # `target: false` (modo sonda de los build-*) omite la restauración de
    # la caché de `target/` y la fijación de mtime: cada corrida de sonda compila con
    # target/ frío y nunca depende de una clave de producción.
    parameters:
      variant:
        type: string
        default: "test"
      os:
        type: string
        default: "linux"
      target:
        type: boolean
        default: true
    steps:
      # Genera Cargo.lock.cachekey ANTES de restore_cache: la clave de CircleCI se
      # forma en tiempo de config, así que el insumo del checksum debe existir en el
      # working dir antes de restaurar. `shell: bash` está disponible en los tres
      # executors (nativo Linux/macOS, Git-bash en el orb de Windows) y `perl`
      # viene bundleado con Git-bash (presente también en los SO *nix). Generar la
      # clave con un transform de texto, y no con `cargo xtask`, porque ningún paso
      # puede compilar antes de restaurar `target/`: una restauración extraída sobre
      # un `target/` ya poblado mezcla el estado de dos ejecuciones. Un único
      # mecanismo cross-platform, sin ramas por shell.
      - run:
          name: Generar Cargo.lock.cachekey (clave de caché normalizada)
          shell: bash
          command: perl -0777 -pe 's/(name = "ai-voice-interconnector"\nversion = ")[^"]+/${1}0.0.0/' Cargo.lock > Cargo.lock.cachekey
      - run:
          name: Calcular identidad de contenido de los parches vendorizados (clave de target/)
          shell: bash
          command: |
            set -euo pipefail
            {
              git rev-parse HEAD:vendor/cmake-0.1.58
              git rev-parse HEAD:vendor/hf-hub-1.0.0
            } > .vendor-patches.tree
            [ "$(grep -Ec '^[0-9a-f]{40}$' .vendor-patches.tree)" = 2 ] || { echo "tree hash inválido en los parches vendorizados (se esperaban 2 líneas de 40 hex)"; exit 1; }
            echo "vendor/cmake-0.1.58 tree: $(sed -n 1p .vendor-patches.tree)"
            echo "vendor/hf-hub-1.0.0 tree: $(sed -n 2p .vendor-patches.tree)"
      - restore_cache:
          keys:
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_pin >>-{{ checksum "Cargo.lock.cachekey" }}
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_pin >>-
      - when:
          condition: << parameters.target >>
          steps:
            - restore_cache:
                keys:
                  - target-v5-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_pin >>-<< parameters.variant >>-{{ checksum "Cargo.lock.cachekey" }}-{{ checksum ".vendor-patches.tree" }}
            - run:
                name: Fijar mtime de los parches vendorizados cmake y hf-hub (evita cascada Dirty)
                shell: bash
                command: |
                  set -euo pipefail
                  /usr/bin/find vendor/cmake-0.1.58 vendor/hf-hub-1.0.0 -exec touch -t 200001010000 {} +
                  if [ -d target ]; then
                    echo "target/ restaurado por clave exacta: cmake y hf-hub Fresh esperados"
                  else
                    echo "target/ vacío (sin acierto): compilación en frío"
                  fi
  cargo_save_registry:
    description: Guarda registry/git antes de compilar (un fallo de test no pierde descargas)
    steps:
      - save_cache:
          key: cargo-v2-{{ arch }}-<< pipeline.parameters.rust_pin >>-{{ checksum "Cargo.lock.cachekey" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
  cargo_save_target:
    description: Guarda target/ — la clave es inmutable, solo se escribe si aún no existe
    # `variant` debe coincidir con el pasado a cargo_restore_caches en el mismo job.
    # `os` debe coincidir también: target/ es OS-específico.
    # Usado por test-windows/test-linux/test-macos/coverage (variant test/test/test/cov)
    # y build-* (variant full). build-* combina sccache (Rust por contenido) + target
    # (C++ OUT_DIR de ct2rs/oneDNN): el bump de VERSION en el crate raíz ya
    # invalida su propio fingerprint de cargo (mtime del checkout + `-C metadata`
    # derivado de la versión del paquete) sin necesidad de limpiarlo a mano, y
    # sccache nunca cachea crates `--crate-type bin` (el binario final siempre
    # pasa por `rustc` real).
    #
    # `when` por defecto es `always` (test-linux/test-windows/test-macos/coverage):
    # ahí un fallo del job suele ser un test que falló, no una compilación
    # incompleta, así que guardar igual sigue siendo útil para acelerar la
    # próxima corrida. build-* (variant: full) pasa `when: on_success` de forma
    # explícita: como la clave de la caché de `target/` es inmutable (el primer
    # `save_cache` gana), un build-* que falla a medio `cargo build --release`
    # persistiría un `target/` incompleto bajo esa clave para siempre — exactamente
    # lo que ocurrió con `target-v2` `full` de linux-x64 en v0.20.9.
    parameters:
      variant:
        type: string
        default: "test"
      os:
        type: string
        default: "linux"
      when:
        type: string
        default: "always"
    steps:
      - save_cache:
          key: target-v5-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_pin >>-<< parameters.variant >>-{{ checksum "Cargo.lock.cachekey" }}-{{ checksum ".vendor-patches.tree" }}
          paths:
            - target
          when: << parameters.when >>

  cargo_restore_registry:
    description: Restaura solo registry/git (sin target) — para los jobs pequeños xtask/changelog-gate (validate-licenses, validate-changelog, publish-metadata); test-linux/test-macos/test-windows/coverage y build-* usan cargo_restore_caches con la caché de target/
    steps:
      - run:
          name: Generar Cargo.lock.cachekey (clave de caché normalizada)
          shell: bash
          command: perl -0777 -pe 's/(name = "ai-voice-interconnector"\nversion = ")[^"]+/${1}0.0.0/' Cargo.lock > Cargo.lock.cachekey
      - restore_cache:
          keys:
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_pin >>-{{ checksum "Cargo.lock.cachekey" }}
            - cargo-v2-{{ arch }}-<< pipeline.parameters.rust_pin >>-

  # Caché de toolchain: ~/.rustup (toolchain + componentes) y ~/.cargo/bin
  # (binarios instalados: rustup, cargo, cargo-llvm-cov). Clave sin checksum —
  # solo depende de arch + rust_pin — así que es inmutable y se reconstruye
  # al bumpear rust_pin. Evita rustup-init (Win/macOS) y el `cargo install
  # cargo-llvm-cov --locked` (coverage) en cada corrida.
  toolchain_restore_cache:
    description: Restaura ~/.rustup y ~/.cargo/bin por arch + rust_pin + OS
    parameters:
      os:
        type: string
        default: "linux"
    steps:
      - restore_cache:
          keys:
            - toolchain-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_pin >>
  toolchain_save_cache:
    description: Guarda ~/.rustup y ~/.cargo/bin (clave inmutable por arch + rust_pin + OS)
    parameters:
      os:
        type: string
        default: "linux"
    steps:
      - save_cache:
          key: toolchain-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_pin >>
          paths:
            - ~/.rustup
            - ~/.cargo/bin

  # Caché del toolchain C del motor TTS en Windows (MSYS2 UCRT64 en C:\msys64).
  # Espejo de toolchain_*_cache pero solo-Windows: clave inmutable por arch + los
  # pines de versión (release base + gcc/openblas/make), así un bump de pin
  # invalida la caché y reconstruye. Es el mecanismo de determinismo del release.
  msys2_restore_cache:
    description: Restaura C:\msys64 por arch + pines de versión MSYS2
    steps:
      - restore_cache:
          keys:
            - msys2-v1-{{ arch }}-<< pipeline.parameters.msys2_base_pin >>-gcc<< pipeline.parameters.msys2_gcc_pin >>-ob<< pipeline.parameters.msys2_openblas_pin >>-make<< pipeline.parameters.msys2_make_pin >>
  msys2_save_cache:
    description: Guarda C:\msys64 (clave inmutable por arch + pines de versión MSYS2)
    steps:
      - save_cache:
          key: msys2-v1-{{ arch }}-<< pipeline.parameters.msys2_base_pin >>-gcc<< pipeline.parameters.msys2_gcc_pin >>-ob<< pipeline.parameters.msys2_openblas_pin >>-make<< pipeline.parameters.msys2_make_pin >>
          paths:
            - C:\msys64

  # sccache: envuelve `rustc` (RUSTC_WRAPPER) y cachea objetos Rust por
  # hash de contenido en ~/.cache/sccache. Cada variante (test/full/cov) guarda
  # y restaura solo su propio blob (clave segmentada por variant, espejo de
  # la caché de `target/`), sobreviviendo a bumps de Cargo.lock que invalidan target/.
  # Cobertura: `rustc`, los nativos compilados con el crate `cc` (que detecta
  # RUSTC_WRAPPER=sccache y lo usa como wrapper; en Windows solo si CC/CXX es la
  # ruta absoluta de cl.exe, ver build-windows-x64) y los proyectos CMake
  # (ct2rs/CTranslate2, onednn-src, sentencepiece-sys) vía
  # CMAKE_<LANG>_COMPILER_LAUNCHER, con el generador Ninja en Windows (ver
  # native_sccache_setup_*). Clave de caché rolling: guarda con {{ epoch }}
  # (siempre escribe) y restaura por prefijo (último estado de la misma
  # variante en el mismo arch+toolchain).
  sccache_restore_cache:
    description: Restaura el directorio de sccache (rolling, fallback por prefijo, OS-específico)
    parameters:
      os:
        type: string
        default: "linux"
      variant:
        type: string
        default: "test"
    steps:
      - restore_cache:
          keys:
            - sccache-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_pin >>-<< parameters.variant >>-
  sccache_save_cache:
    description: Guarda el directorio de sccache (clave rolling con epoch, OS-específico)
    parameters:
      os:
        type: string
        default: "linux"
      variant:
        type: string
        default: "test"
    steps:
      - save_cache:
          key: sccache-v1-{{ arch }}-<< parameters.os >>-<< pipeline.parameters.rust_pin >>-<< parameters.variant >>-{{ epoch }}
          paths:
            - ~/.cache/sccache
          when: always

  sccache_setup_unix:
    description: Instala sccache (pin) y lo activa como RUSTC_WRAPPER (bash)
    steps:
      - run:
          name: Configurar sccache (RUSTC_WRAPPER)
          command: |
            echo "[STEP] Configurar sccache - INICIO"
            # Versión viva desde packaging/pins.json: sin literales que se desalineen.
            SCCACHE_VERSION="$(sed -n 's/.*"sccache": *"\([^"]*\)".*/\1/p' packaging/pins.json)"
            if ! command -v sccache >/dev/null 2>&1; then
              case "$(uname -m)" in
                x86_64|amd64) SCCACHE_ARCH="x86_64" ;;
                aarch64|arm64) SCCACHE_ARCH="aarch64" ;;
                *) echo "arch no soportada por sccache: $(uname -m)" >&2; exit 1 ;;
              esac
              case "$(uname -s)" in
                Linux) SCCACHE_TRIPLE="${SCCACHE_ARCH}-unknown-linux-musl" ;;
                Darwin) SCCACHE_TRIPLE="${SCCACHE_ARCH}-apple-darwin" ;;
                *) echo "SO no soportado por sccache: $(uname -s)" >&2; exit 1 ;;
              esac
              SCCACHE_PKG="sccache-v${SCCACHE_VERSION}-${SCCACHE_TRIPLE}"
              curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${SCCACHE_PKG}.tar.gz" -o /tmp/sccache.tar.gz
              tar -xzf /tmp/sccache.tar.gz -C /tmp
              sudo install -m 755 "/tmp/${SCCACHE_PKG}/sccache" /usr/local/bin/sccache
            fi
            # Persistir env a $BASH_ENV para los steps de compilación siguientes.
            echo 'export RUSTC_WRAPPER=sccache' >> "$BASH_ENV"
            echo 'export SCCACHE_DIR=$HOME/.cache/sccache' >> "$BASH_ENV"
            # Límite de la caché rolling: sin él rige el máximo por defecto (10 GiB)
            # y cada cambio de Cargo.lock acumula objetos que ya nadie usa. Al
            # superarlo, sccache desaloja por LRU (un acierto refresca el mtime de
            # la entrada, también tras restaurar la caché desde el tar).
            echo 'export SCCACHE_CACHE_SIZE=<< pipeline.parameters.sccache_cache_size >>' >> "$BASH_ENV"
            sccache --version
            echo "[STEP] Configurar sccache - FIN"
  sccache_setup_windows:
    description: Instala sccache (pin) como RUSTC_WRAPPER (PowerShell)
    steps:
      - run:
          name: Configurar sccache (RUSTC_WRAPPER)
          command: |
            Write-Host "[STEP] Configurar sccache - INICIO"
            $ErrorActionPreference = "Stop"
            # Versión viva desde packaging/pins.json: sin literales que se desalineen.
            $SccacheVersion = (Get-Content packaging/pins.json -Raw | ConvertFrom-Json).sccache
            $Pkg = "sccache-v$SccacheVersion-x86_64-pc-windows-msvc"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # sccache.exe en ~/.cargo/bin (en PATH). PowerShell no tiene $BASH_ENV:
            # los steps de compilación exportan RUSTC_WRAPPER/SCCACHE_DIR inline.
            $Dest = "$env:USERPROFILE\.cargo\bin\sccache.exe"
            if (-not (Test-Path $Dest)) {
              # Asegura ~/.cargo/bin: el destino de sccache puede no existir aún
              # (p. ej. si rustup instaló en un perfil distinto). Copy-Item no
              # crea directorios intermedios y fallaría con DirectoryNotFound.
              New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cargo\bin" | Out-Null
              Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/v$SccacheVersion/$Pkg.tar.gz" -OutFile "$env:TEMP\sccache.tar.gz"
              tar -xzf "$env:TEMP\sccache.tar.gz" -C "$env:TEMP"
              Copy-Item "$env:TEMP\$Pkg\sccache.exe" $Dest -Force
            }
            & $Dest --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Configurar sccache - FIN"

  # Launcher sccache para CMake. CMake >= 3.17 lee CMAKE_<LANG>_COMPILER_LAUNCHER
  # del entorno al configurar, así que basta con exportarlo: no se toca ningún
  # build.rs ni el parche de vendor/cmake-0.1.58. No hay doble envoltura: el
  # crate `cmake` fija CMAKE_<LANG>_COMPILER a la ruta real del compilador
  # (`cc` solo antepone sccache al invocar, no en la ruta de la herramienta).
  native_sccache_setup_unix:
    description: Exporta sccache como launcher C/C++ de CMake (bash)
    steps:
      - run:
          name: Configurar sccache como launcher de CMake
          command: |
            echo 'export CMAKE_C_COMPILER_LAUNCHER=sccache' >> "$BASH_ENV"
            echo 'export CMAKE_CXX_COMPILER_LAUNCHER=sccache' >> "$BASH_ENV"
            echo "CMAKE_{C,CXX}_COMPILER_LAUNCHER=sccache exportados a BASH_ENV"
  # En Windows el generador Visual Studio (el que elige el crate `cmake` por
  # defecto con MSVC) ignora los launchers; con Ninja sí se aplican. Ninja se
  # descarga en cada corrida (≈300 KB) a un directorio temporal fuera de toda
  # caché, así ninguna caché puede aportar otra versión. El crate `cmake` lee
  # CMAKE_GENERATOR del entorno. Ninja no carga el entorno de MSVC por sí mismo
  # (el generador Visual Studio sí): el paso de compilación importa vcvars64 y
  # fija CC/CXX a la ruta de cl.exe. PowerShell no tiene $BASH_ENV: ese paso
  # fija PATH y las variables inline.
  native_sccache_setup_windows:
    description: Instala Ninja (pin) en $env:TEMP\ninja para el generador CMake de Windows
    steps:
      - run:
          name: Instalar Ninja << pipeline.parameters.ninja_pin >> (generador CMake)
          command: |
            Write-Host "[STEP] Instalar Ninja - INICIO"
            $ErrorActionPreference = "Stop"
            $NinjaVersion = "<< pipeline.parameters.ninja_pin >>"
            $Dir = "$env:TEMP\ninja"
            New-Item -ItemType Directory -Force -Path $Dir | Out-Null
            Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$NinjaVersion/ninja-win.zip" -OutFile "$env:TEMP\ninja-win.zip"
            Expand-Archive -Path "$env:TEMP\ninja-win.zip" -DestinationPath $Dir -Force
            $Got = (& "$Dir\ninja.exe" --version).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($Got -ne $NinjaVersion) { throw "ninja --version ($Got) != pin ($NinjaVersion)" }
            Write-Host "Ninja $Got en $Dir"
            Write-Host "[STEP] Instalar Ninja - FIN"

  # Diagnóstico del modo sonda de los build-*: herramientas del executor y, por
  # cada proyecto CMake compilado bajo target/release/build/*/out, el generador,
  # compilador, launcher, tipo de build, runtime MSVC y flags efectivos, más una
  # línea de flags de compilación real (build.ninja, flags.make o .vcxproj) y
  # cuántos ficheros de build invocan sccache. Responde qué crates usan CMake
  # (p. ej. aws-lc-sys) y si el launcher quedó aplicado. `when: always`: si la
  # compilación falla, el diagnóstico sigue saliendo al log. Sin tuberías hacia
  # consumidores que salgan antes (se capturan listas en variables).
  cmake_probe_diagnostics:
    description: Imprime el diagnóstico de los builds CMake (solo modo sonda)
    steps:
      - run:
          name: Diagnóstico de builds CMake (sonda)
          shell: bash
          when: always
          command: |
            set -uo pipefail
            echo "[STEP] Diagnóstico de builds CMake (sonda) - INICIO"
            cmake --version
            # En Windows, Ninja vive en $env:TEMP\ninja (solo en el PATH del paso de compilación).
            if command -v ninja >/dev/null 2>&1; then echo "ninja $(ninja --version)"
            elif [ -x "${TEMP:-/tmp}/ninja/ninja.exe" ]; then echo "ninja $("${TEMP:-/tmp}/ninja/ninja.exe" --version) (${TEMP:-/tmp}/ninja)"
            else echo "ninja: no disponible"; fi
            echo "CPU: $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-?}")"
            caches="$(/usr/bin/find target/release/build -path '*/out/*' -name CMakeCache.txt 2>/dev/null)"
            if [ -z "$caches" ]; then echo "Sin CMakeCache.txt bajo target/release/build"; fi
            vars='^(CMAKE_GENERATOR|CMAKE_C_COMPILER|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER_LAUNCHER|CMAKE_CXX_COMPILER_LAUNCHER|CMAKE_BUILD_TYPE|CMAKE_MSVC_RUNTIME_LIBRARY|CMAKE_CXX_FLAGS|CMAKE_CXX_FLAGS_RELEASE)(:[A-Z]+)?='
            printf '%s\n' "$caches" | while IFS= read -r cache; do
              [ -n "$cache" ] || continue
              dir="$(dirname "$cache")"
              echo "=== ${dir#target/release/build/} ==="
              grep -E "$vars" "$cache" || true
              if [ -f "$dir/build.ninja" ]; then
                echo "-- flags de compilación (build.ninja):"
                grep -m2 -E '^ +FLAGS = ' "$dir/build.ninja" || true
              else
                makes="$(/usr/bin/find "$dir" -name flags.make 2>/dev/null)"
                vcx="$(/usr/bin/find "$dir" -name '*.vcxproj' ! -name 'ALL_BUILD*' ! -name 'ZERO_CHECK*' ! -name 'INSTALL*' 2>/dev/null)"
                if [ -n "$makes" ]; then
                  echo "-- flags de compilación (${makes%%$'\n'*}):"
                  grep -m2 -E '^(C|CXX)_FLAGS = ' "${makes%%$'\n'*}" || true
                elif [ -n "$vcx" ]; then
                  echo "-- propiedades de compilación (${vcx%%$'\n'*}):"
                  grep -m12 -E '<(Optimization|InlineFunctionExpansion|RuntimeLibrary|DebugInformationFormat|PreprocessorDefinitions|AdditionalOptions)>' "${vcx%%$'\n'*}" || true
                fi
              fi
              launched="$(grep -rlE 'sccache' "$dir" --include=build.ninja --include=build.make --include='*.vcxproj' 2>/dev/null)"
              echo "-- ficheros de build que invocan sccache: $(printf '%s' "$launched" | grep -c . || true)"
            done
            echo "[STEP] Diagnóstico de builds CMake (sonda) - FIN"

  # Fuente única de pines: `packaging/pins.json` es la única tabla de versiones;
  # los parámetros del pipeline la espejan. Este paso invoca al validador único
  # (`cargo xtask pins --check`), que es la primera compilación del workspace,
  # tras restaurar las cachés y activar `sccache`, y falla antes de compilar el
  # producto si algún pin diverge del JSON. No genera pasos de instalación: la
  # CI conserva sus comandos (`apt`, `brew`, MSYS2).
  validate_pins:
    description: Valida los pines del pipeline contra packaging/pins.json (falla si divergen)
    steps:
      - run:
          name: Validar pines del pipeline contra packaging/pins.json
          shell: bash
          command: |
            echo "[STEP] Validar pines contra packaging/pins.json - INICIO"
            set -euo pipefail
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo xtask pins --check
            echo "[STEP] Validar pines contra packaging/pins.json - FIN"

  # Puerta de la cadena de features. Qué capacidades expone el producto está
  # declarado en los manifiestos y en los `cfg` del código, y nada ata las dos
  # declaraciones: un eslabón ausente produce un binario que compila y arranca
  # pero que no incluye la pieza. Este paso invoca al validador único
  # (`cargo xtask features --check`), que exige que todo feature que el código
  # usa sea alcanzable desde el paquete raíz. Va junto a la puerta de pines,
  # como primera compilación del workspace tras restaurar las cachés y activar
  # `sccache`, y falla antes de compilar el producto si falta alguno. Es la
  # misma forma que la puerta de pines y también sin C++.
  validate_features:
    description: Valida la cadena de features del workspace (falla si un eslabón falta)
    steps:
      - run:
          name: Validar la cadena de features del workspace
          shell: bash
          command: |
            echo "[STEP] Validar cadena de features - INICIO"
            set -euo pipefail
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo xtask features --check
            echo "[STEP] Validar cadena de features - FIN"

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gate Rust — triple puerta simétrica (cargo test --all)
  # ──────────────────────────────────────────────────────────────
  test-linux:
    # Executor x86_64 Docker con Rust preinstalado. La suite es
    # arch-independiente y mockea el engine (Parakeet/Qwen no se ejercitan),
    # así que re-correrla en ARM64 no aportaría señal.
    # Es la arquitectura más barata/rápida disponible.
    # Caché: registry + target/ + sccache autoconsistente (variant: test),
    # igual que test-windows/test-macos/coverage.
    # La caché de target/ evita recompilar dependencias externas, pero los crates
    # propios del workspace (path dependencies) recompilan siempre: el fingerprinting
    # de cargo para dependencias de ruta local es por mtime en los tres SO
    # (evidencia v0.20.4: 264/290 Fresh en Linux). sccache por contenido es
    # inmune al mtime y cubre ese residuo con hits de su propio perfil.
    # Las puertas validate_* son la primera compilación del workspace: van tras
    # restaurar las cachés y activar sccache.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463 # digest del índice multi-arch de 1.96.0 (ver parameters.rust_pin)
    resource_class: medium
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      - run:
          # libasound2-dev + pkg-config exponen ALSA a cpal (sí se compila en la
          # suite). libclang-dev (bindgen/ct2rs, solo con native-translation) ya
          # NO se ejercita con native-stt/native-translation off (la suite no
          # compila C++); se conserva por simetría con coverage y con los build-*,
          # que activan --features full. Contexto histórico: sin libclang-dev el
          # build-script moría con «Unable to find libclang» (pipeline #2).
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches:
          os: linux
          variant: test
      - run:
          name: Verificar toolchain Rust
          command: |
            echo "[STEP] Verificar toolchain Rust - INICIO"
            rustc --version
            cargo --version
            echo "rust_pin parámetro: << pipeline.parameters.rust_pin >>"
            echo "[STEP] Verificar toolchain Rust - FIN"
      - run:
          # Descarga TODAS las deps al registry antes de guardar su caché:
          # un fallo posterior de test no pierde las descargas.
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: linux
          variant: test
      - sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            cargo test --all --verbose
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats
      - sccache_save_cache:
          os: linux
          variant: test
      - cargo_save_target:
          os: linux
          variant: test

  test-windows:
    # Suite Rust en Windows nativo (cargo test --all). Puerta simétrica con
    # test-linux/macos: valida código específico de Windows (winsound, tray)
    # antes de compilar. Sin este gate, bugs de Windows solo se verían en build.
    # Caché: registry + target/ + sccache autoconsistente (cargo_restore_caches
    # os: windows variant: test; sccache os: windows variant: test). La caché de
    # target/ tiene coste de I/O NTFS significativo en restore/save, pero sin ella
    # la recompilación en Windows es total (evidencia v0.20.4: 0 Fresh / 154
    # Compiling con hit exacto, incluyendo dependencias externas).
    # Las puertas validate_* son la primera compilación del workspace: van tras
    # restaurar las cachés y configurar sccache.
    executor: win/server-2022
    # Límite de sccache a nivel de job: PowerShell no tiene $BASH_ENV (ver
    # sccache_setup_unix) y el paso de compilación no interpola parámetros de pipeline.
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
      # Puertas y suite comparten flags: RUSTFLAGS entra en el fingerprint de cargo y reemplaza los rustflags del target.
      RUSTFLAGS: "-C linker=rust-lld"
      SCCACHE_CACHE_SIZE: << pipeline.parameters.sccache_cache_size >>
    steps:
      - checkout
      - toolchain_restore_cache:
          os: windows
      - run:
          name: Instalar Rust << pipeline.parameters.rust_pin >> vía rustup
          command: |
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - INICIO"
            $ErrorActionPreference = "Stop"
            $RustVersion = "<< pipeline.parameters.rust_pin >>"
            # Prefijo de PATH SOLO para este step: los steps posteriores que
            # invocan cargo re-prefijan por sí mismos (PowerShell no tiene el
            # equivalente de $BASH_ENV).
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # Idempotente: si la caché de toolchain ya trae cargo, no
            # re-ejecutar rustup-init (ahorra ~2-3 min por corrida). rustup-init
            # estático oficial (pin exacto, no choco): reproducible e
            # independiente del repo de Chocolatey. Invoke-WebRequest no setea
            # $LASTEXITCODE: con ErrorActionPreference=Stop un fallo de descarga
            # lanza y aborta el step.
            # La guarda comprueba la RUTA específica del toolchain fijado
            # (~/.cargo/bin/cargo.exe), no Get-Command: el executor trae Rust
            # preinstalado en PATH, así que Get-Command siempre acertaría y
            # saltaría rustup-init, dejando el 1.96.0 sin instalar y ~/.cargo/bin
            # inexistente (espeja la guarda de macOS).
            if (Test-Path "$env:USERPROFILE\.cargo\bin\cargo.exe") {
              Write-Host "Toolchain restaurado de caché; se omite rustup-init"
            } else {
              Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain $RustVersion --profile minimal --no-modify-path
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            cargo --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            rustc --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - FIN"
      - toolchain_save_cache:
          os: windows
      - cargo_restore_caches:
          os: windows
          variant: test
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: windows
          variant: test
      - sccache_setup_windows
      - validate_pins
      - validate_features
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            Write-Host "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # PowerShell no tiene $BASH_ENV: activar sccache inline para este step.
            $env:RUSTC_WRAPPER = "sccache"
            $env:SCCACHE_DIR = "$env:USERPROFILE\.cache\sccache"
            cargo test --all --verbose
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sccache --show-stats
            Write-Host "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - sccache_save_cache:
          os: windows
          variant: test
      - cargo_save_target:
          os: windows
          variant: test

  test-macos:
    # Suite Rust en macOS nativo (Apple Silicon, Xcode 26.4.0). Valida código
    # específico de macOS (afplay/CoreAudio, rutas POSIX, señales) — sin Mac
    # físico, este gate en CI es la única validación antes del usuario real.
    # Caché: registry + target/ + sccache autoconsistente (variant: test),
    # igual que test-linux/test-windows/coverage.
    # La caché de target/ evita recompilar dependencias externas, pero los crates
    # propios del workspace (path dependencies) recompilan siempre: el fingerprinting
    # de cargo para dependencias de ruta local es por mtime en los tres SO
    # (evidencia v0.20.4: 287/313 Fresh en macOS). sccache por contenido es
    # inmune al mtime y cubre ese residuo con hits de su propio perfil.
    # Las puertas validate_* son la primera compilación del workspace: van tras
    # restaurar las cachés y activar sccache.
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      - toolchain_restore_cache:
          os: macos
      - run:
          name: Instalar Rust << pipeline.parameters.rust_pin >> vía rustup
          command: |
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - INICIO"
            # Idempotente: si la caché de toolchain ya trae rustup, se omite
            # la instalación (ahorra ~2-3 min por corrida).
            if [ -x "$HOME/.cargo/bin/rustup" ]; then
              echo "Toolchain restaurado de caché; se omite rustup-init"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain << pipeline.parameters.rust_pin >> --profile minimal
            fi
            # No sourcear ~/.cargo/env: no está en la caché de toolchain
            # (solo ~/.rustup y ~/.cargo/bin), así que en caché tibia no existe.
            # El env de rustup solo antepone ~/.cargo/bin al PATH; lo hacemos directo.
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo --version
            rustc --version
            echo "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - FIN"
      - toolchain_save_cache:
          os: macos
      - cargo_restore_caches:
          os: macos
          variant: test
      - run:
          name: Instalar dependencias de sistema (cmake, pkg-config)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            # cmake y pkg-config pueden no estar en la imagen base de Xcode
            if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
            if ! command -v pkg-config >/dev/null 2>&1; then brew install pkg-config; fi
            cmake --version
            echo "[STEP] Instalar dependencias de sistema - FIN"
      # NOTA: la suite featureless no compila ct2rs (native-translation off).
      # Cuando sí se compila (build-darwin-arm64 con --features full),
      # avi-translation usa OPENMP_RUNTIME=NONE en macOS (features por target en
      # su Cargo.toml): los runners con Apple clang no traen libomp y
      # find_package(OpenMP REQUIRED) fallaba (#2/#4).
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: macos
          variant: test
      - sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Ejecutar suite Rust (cargo test --all)
          command: |
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - INICIO"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo test --all --verbose
            echo "[STEP] Ejecutar suite Rust (cargo test --all) - FIN"
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats
      - sccache_save_cache:
          os: macos
          variant: test
      - cargo_save_target:
          os: macos
          variant: test

  coverage:
    # Job de cobertura Rust (cargo-llvm-cov, LLVM instrumentation). Corre solo
    # en Linux x86_64: coverage es agnóstico de SO, duplicarlo triplicaría coste
    # sin señal nueva. Reemplaza a pytest-cov; genera lcov.info y resumen por
    # líneas. Sin gate de % por diseño — solo valida
    # que la instrumentación no rompa la suite.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463 # digest del índice multi-arch de 1.96.0 (ver parameters.rust_pin)
    resource_class: medium
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      - run:
          # NOTA: con native-stt/native-translation off por defecto,
          # coverage compila la workspace SIN los stacks C++ (no aparece
          # ct2rs con C++); libclang-dev/cmake se conservan por simetría
          # con test-linux y por si un futuro umbral corre coverage con features.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - cargo_restore_caches:
          os: linux
          variant: cov
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - toolchain_restore_cache:
          os: linux
      - run:
          name: Instalar cargo-llvm-cov
          command: |
            echo "[STEP] Instalar cargo-llvm-cov - INICIO"
            rustup component add llvm-tools-preview
            # Idempotente: si la caché de toolchain ya trae el binario, no
            # recompilar desde fuente (ahorra ~2-4 min por corrida).
            if command -v cargo-llvm-cov >/dev/null 2>&1; then
              echo "cargo-llvm-cov restaurado de caché; se omite cargo install"
            else
              cargo install cargo-llvm-cov --locked
            fi
            cargo llvm-cov --version
            echo "[STEP] Instalar cargo-llvm-cov - FIN"
      - toolchain_save_cache:
          os: linux
      - sccache_restore_cache:
          os: linux
          variant: cov
      - sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Ejecutar suite con cobertura (cargo llvm-cov)
          command: |
            echo "[STEP] Ejecutar suite con cobertura - INICIO"
            # Genera lcov.info; el resumen se imprime sin re-ejecutar la suite
            cargo llvm-cov --workspace --lcov --output-path lcov.info --verbose
            cargo llvm-cov report
            echo "[STEP] Ejecutar suite con cobertura - FIN"
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats
      - sccache_save_cache:
          os: linux
          variant: cov
      - store_artifacts:
          path: lcov.info
          destination: coverage-lcov
      - cargo_save_target:
          os: linux
          variant: cov

  # ──────────────────────────────────────────────────────────────
  # Validación GPLv3 — SOURCE-OFFER.md y THIRD-PARTY-LICENSES.md vivos
  # ──────────────────────────────────────────────────────────────
  validate-licenses:
    # Gate de licencias GPLv3: verifica que SOURCE-OFFER.md esté regenerado para
    # la versión vigente (cargo xtask source-offer --check) y que THIRD-PARTY-
    # LICENSES.md esté en sincronía con Cargo.lock (cargo xtask licenses --check).
    # Corre solo en tags v* como gate de los builds (ver workflow build-all).
    # Caché: registry + sccache (sin target) — xtask es pequeño, sccache basta.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      - cargo_restore_registry
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Verificar SOURCE-OFFER.md
          command: |
            echo "[STEP] Verificar SOURCE-OFFER.md - INICIO"
            cargo --quiet xtask source-offer --check
            echo "[STEP] Verificar SOURCE-OFFER.md - FIN"
      - run:
          name: Verificar THIRD-PARTY-LICENSES.md
          command: |
            echo "[STEP] Verificar THIRD-PARTY-LICENSES.md - INICIO"
            cargo --quiet xtask licenses --check
            echo "[STEP] Verificar THIRD-PARTY-LICENSES.md - FIN"
      - run:
          name: Verificar comentarios (puerta de política en CI)
          command: |
            echo "[STEP] Verificar comentarios - INICIO"
            cargo --quiet xtask comments --check
            echo "[STEP] Verificar comentarios - FIN"

  validate-changelog:
    # Gate de CHANGELOG: verifica que exista la sección ## [X.Y.Z] para la
    # versión bumppeada antes del tag, evitando el fallo silencioso de
    # publish-release (~14 min de pipeline deshechos). Corre en tags v* como
    # gate de los builds (ver workflow build-all).
    # Caché: registry + sccache (sin target) — coherente con los jobs pequeños/xtask.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    steps:
      - checkout
      - cargo_restore_registry
      - sccache_restore_cache:
          os: linux
      - sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Verificar sección de CHANGELOG
          command: |
            echo "[STEP] Verificar CHANGELOG - INICIO"
            cargo --quiet xtask changelog --check
            echo "[STEP] Verificar CHANGELOG - FIN"

  # ──────────────────────────────────────────────────────────────
  # Suites del bootstrap de primera instalación (bats + Pester)
  # Ejercitan packaging/bootstrap/ sin red real: bats contra
  # `openssl s_server` (HTTPS) y Pester contra support/Serve.ps1 (HTTP).
  # ──────────────────────────────────────────────────────────────
  test-bootstrap-linux:
    # Suite POSIX (tests/bootstrap/install.bats) con `sh` (dash) contra el
    # `openssl s_server` HTTPS local: detección, resolución, integridad,
    # delegación y confirmación con terminal.
    docker:
      # Digest del índice multi-arch de cimg/base:2026.09 (pin reproducible;
      # el mismo que publish-release). Renovar a mano junto con su tag.
      - image: cimg/base:2026.09@sha256:668174490adc470cd34eb3aa178939d65f817bc13ef657a94ff0278338f7d8da
    steps:
      - checkout
      - run:
          name: Instalar bats-core (pineado << pipeline.parameters.bats_pin >>)
          command: |
            echo "[STEP] Instalar bats-core - INICIO"
            BATS_VERSION="<< pipeline.parameters.bats_pin >>"
            git -c advice.detachedHead=false clone -q --depth 1 --branch "v${BATS_VERSION}" https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh "$HOME/.local" >/dev/null
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            . "$BASH_ENV"
            test "$(bats --version)" = "Bats ${BATS_VERSION}" || { echo "bats: $(bats --version) != ${BATS_VERSION}" >&2; exit 1; }
            echo "[STEP] Instalar bats-core - FIN"
      - run:
          name: Ejecutar suite del bootstrap POSIX (bats)
          command: |
            echo "[STEP] Ejecutar suite del bootstrap POSIX (bats) - INICIO"
            bats tests/bootstrap/install.bats
            echo "[STEP] Ejecutar suite del bootstrap POSIX (bats) - FIN"

  test-bootstrap-windows:
    # Suite Windows (tests/bootstrap/install.tests.ps1) con Pester v5 pineado
    # (el executor trae Pester 3.x; un release nuevo no debe romper el job sin
    # cambios). El arnés (support/Serve.ps1) es HTTP local sin dependencias.
    # Las pruebas de tubería ejecutan `irm | iex` con los dos motores:
    # powershell.exe (5.1, del executor) y pwsh (7, pineado e instalado aquí).
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Instalar PowerShell 7 (pineado << pipeline.parameters.pwsh_pin >>)
          command: |
            Write-Host "[STEP] Instalar PowerShell 7 (pineado << pipeline.parameters.pwsh_pin >>) - INICIO"
            $ErrorActionPreference = "Stop"
            $pin = "<< pipeline.parameters.pwsh_pin >>"
            $zip = Join-Path $env:TEMP "PowerShell-$pin-win-x64.zip"
            Invoke-WebRequest -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$pin/PowerShell-$pin-win-x64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "C:\pwsh" -Force
            $got = & C:\pwsh\pwsh.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
            if ($got -ne $pin) { throw "pwsh: $got != $pin" }
            Write-Host "[STEP] Instalar PowerShell 7 (pineado << pipeline.parameters.pwsh_pin >>) - FIN"
      - run:
          name: Instalar Pester (pineado 5.8.0)
          command: |
            Write-Host "[STEP] Instalar Pester (pineado 5.8.0) - INICIO"
            # Los errores de cmdlet no fijan $LASTEXITCODE: sin Stop, un fallo de
            # instalación dejaba el paso en verde. -Repository desambigua el
            # módulo, que el executor expone también en un repositorio Nuget.
            $ErrorActionPreference = "Stop"
            Install-Module Pester -RequiredVersion 5.8.0 -Repository PSGallery -Force -SkipPublisherCheck -Scope CurrentUser
            Write-Host "[STEP] Instalar Pester (pineado 5.8.0) - FIN"
      - run:
          name: Ejecutar suite del bootstrap Windows (Pester)
          command: |
            Write-Host "[STEP] Ejecutar suite del bootstrap Windows (Pester) - INICIO"
            $ErrorActionPreference = "Stop"
            Import-Module Pester -RequiredVersion 5.8.0
            # Las pruebas de tubería resuelven `pwsh` por el PATH.
            $env:Path = "C:\pwsh;$env:Path"
            Invoke-Pester tests/bootstrap/install.tests.ps1 -CI
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Ejecutar suite del bootstrap Windows (Pester) - FIN"

  test-bootstrap-macos:
    # Suite POSIX en el executor macOS real (bats): única validación del shell
    # nativo de la plataforma sin un Mac físico. Misma suite que en Linux; el
    # servidor falso es `openssl s_server` de Homebrew (OpenSSL 3, como en
    # Linux), no el LibreSSL del sistema.
    macos:
      xcode: "26.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Instalar openssl@3 (servidor falso de la suite)
          command: |
            echo "[STEP] Instalar openssl@3 - INICIO"
            # La imagen ya trae openssl@3: reinstalarlo lo actualiza y su
            # post-install devuelve error, así que solo se instala si falta.
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            echo "export PATH=\"$(brew --prefix openssl@3)/bin:\$PATH\"" >> "$BASH_ENV"
            . "$BASH_ENV"
            openssl version
            echo "[STEP] Instalar openssl@3 - FIN"
      - run:
          name: Instalar bats-core (pineado << pipeline.parameters.bats_pin >>)
          command: |
            echo "[STEP] Instalar bats-core - INICIO"
            BATS_VERSION="<< pipeline.parameters.bats_pin >>"
            git -c advice.detachedHead=false clone -q --depth 1 --branch "v${BATS_VERSION}" https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh "$HOME/.local" >/dev/null
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            . "$BASH_ENV"
            test "$(bats --version)" = "Bats ${BATS_VERSION}" || { echo "bats: $(bats --version) != ${BATS_VERSION}" >&2; exit 1; }
            echo "[STEP] Instalar bats-core - FIN"
      - run:
          name: Ejecutar suite del bootstrap POSIX (bats)
          command: |
            echo "[STEP] Ejecutar suite del bootstrap POSIX (bats) - INICIO"
            bats tests/bootstrap/install.bats
            echo "[STEP] Ejecutar suite del bootstrap POSIX (bats) - FIN"

  # ──────────────────────────────────────────────────────────────
  # Builds nativos Rust — 4 targets de distribución (cargo build --release)
  # Cada build hace smoke test (version + voice list), empaqueta con
  # `xtask package` y prueba lo empaquetado con `self install` en un sandbox
  # antes de persistirlo al workspace para publish-release. Requieren triple
  # puerta + coverage + bootstrap (ver workflow build-all).
  # ──────────────────────────────────────────────────────────────
  # Parámetro `probe` (los 4 build-*): modo sonda del workflow
  # `native-cache-probe`. Sin restaurar ni guardar la caché de target/ (target/ frío en
  # cada corrida), sin empaquetado (package, SHA-256, persist_to_workspace:
  # exigen CIRCLE_TAG == const VERSION) y con el diagnóstico de CMake. Sigue
  # ejecutando smoke test y motor TTS, y guarda sccache en la variante `full`
  # (caché por contenido: sembrarla no contamina producción).
  build-windows-x64:
    # Windows x64: binario + smoke test nativo. No usa Inno Setup aún.
    executor: win/server-2022
    # Límite de sccache a nivel de job: PowerShell no tiene $BASH_ENV (ver
    # sccache_setup_unix) y el paso de compilación no interpola parámetros de pipeline.
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: << pipeline.parameters.sccache_cache_size >>
    parameters:
      probe:
        type: boolean
        default: false
    steps:
      - checkout
      - toolchain_restore_cache:
          os: windows
      - run:
          name: Instalar Rust << pipeline.parameters.rust_pin >> vía rustup
          command: |
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - INICIO"
            $ErrorActionPreference = "Stop"
            $RustVersion = "<< pipeline.parameters.rust_pin >>"
            # Prefijo de PATH SOLO para este step: los steps posteriores que
            # invocan cargo re-prefijan por sí mismos (PowerShell no tiene el
            # equivalente de $BASH_ENV).
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            # Idempotente: si la caché de toolchain ya trae cargo, se omite
            # rustup-init (ahorra ~2-3 min por corrida). Guarda por RUTA
            # específica del toolchain fijado (no Get-Command): el executor trae
            # Rust preinstalado en PATH y Get-Command saltaría rustup-init
            # dejando el 1.96.0 sin instalar y ~/.cargo/bin inexistente.
            if (Test-Path "$env:USERPROFILE\.cargo\bin\cargo.exe") {
              Write-Host "Toolchain restaurado de caché; se omite rustup-init"
            } else {
              Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
              .\rustup-init.exe -y --default-toolchain $RustVersion --profile minimal --no-modify-path
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            cargo --version
            rustc --version
            Write-Host "[STEP] Instalar Rust << pipeline.parameters.rust_pin >> vía rustup - FIN"
      - toolchain_save_cache:
          os: windows
      - msys2_restore_cache
      - run:
          # Bootstrap del toolchain C del motor TTS (MSYS2 UCRT64). Idempotente: si
          # la caché trajo C:\msys64 con gcc, se omite la instalación. En caché fría
          # instala el base de MSYS2 vía Chocolatey (ya presente en el executor)
          # pineado a la misma versión del release base, y sincroniza gcc (RLE:
          # libgfortran/libgcc/libquadmath estáticos), openblas y make (mingw32-make).
          # El pin de choco + la caché fijan el resultado; si upstream driftó gcc,
          # se loguea (no aborta) y la versión instalada manda como evidencia RLE.
          # pacman -Q + gcc --version quedan al log como evidencia auditable (RLE).
          # Marcadores por subpaso para localizar cuelgues.
          name: Bootstrap MSYS2 UCRT64 (toolchain motor TTS)
          command: |
            Write-Host "[STEP] Bootstrap MSYS2 UCRT64 - INICIO"
            $ErrorActionPreference = "Stop"
            $Root = "C:\msys64"
            $GccPin = "<< pipeline.parameters.msys2_gcc_pin >>"
            if (Test-Path "$Root\ucrt64\bin\gcc.exe") {
              Write-Host "MSYS2 restaurado de caché; se omite instalación"
            } else {
              $Release = "<< pipeline.parameters.msys2_base_pin >>"
              # Versión de choco = release base compactado + sufijo .0.0
              # (2026-06-11 -> 20260611.0.0): mismo pin que el release upstream.
              $ChocoVer = ($Release -replace '-', '') + ".0.0"
              Write-Host "[STEP] Instalar base MSYS2 via Chocolatey ($ChocoVer) - INICIO"
              choco install msys2 --version=$ChocoVer -y --no-progress --params "/NoUpdate /InstallDir:C:\msys64"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # choco gestiona base + keyring: no corremos `pacman-key --init`
              # (el hang por entropía que agotaba el no_output_timeout).
              if (-not (Test-Path "$Root\usr\bin\bash.exe")) { throw "MSYS2 no quedó en $Root tras choco (revisar /InstallDir; ¿anidó C:\msys64\msys64?)" }
              Write-Host "[STEP] Instalar base MSYS2 via Chocolatey - FIN"
              $Bash = "$Root\usr\bin\bash.exe"
              Write-Host "[STEP] Sincronizar toolchain (pacman -S gcc/openblas/make) - INICIO"
              & $Bash -lc "pacman -Sy --needed --noconfirm --disable-download-timeout mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-make"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Write-Host "[STEP] Sincronizar toolchain - FIN"
            }
            # Auditabilidad (RLE) + verificación de pines: pacman -Q y gcc --version.
            & "$Root\usr\bin\bash.exe" -lc "pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-make"
            & "$Root\ucrt64\bin\gcc.exe" --version
            $GccInstalled = (& "$Root\ucrt64\bin\gcc.exe" -dumpfullversion).Trim()
            # Log on drift (no halt): la versión instalada es la fuente de verdad de
            # la evidencia RLE. Si difiere del pin declarado, se advierte pero no se
            # aborta; actualizar el pin es opcional (solo refresca la clave de caché).
            if ($GccInstalled -ne $GccPin) {
              Write-Host "[WARN] gcc instalado ($GccInstalled) != pin declarado ($GccPin): drift upstream de MSYS2; evidencia RLE = $GccInstalled"
            } else {
              Write-Host "gcc instalado ($GccInstalled) coincide con el pin declarado"
            }
            Write-Host "[STEP] Bootstrap MSYS2 UCRT64 - FIN"
      - msys2_save_cache
      - unless:
          condition: << parameters.probe >>
          steps:
            - cargo_restore_caches:
                os: windows
                variant: full
                target: true
      - when:
          condition: << parameters.probe >>
          steps:
            - cargo_restore_caches:
                os: windows
                variant: full
                target: false
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: windows
          variant: full
      - sccache_setup_windows
      - native_sccache_setup_windows
      - validate_pins
      - validate_features
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            Write-Host "[STEP] Compilar binario release (cargo build --release) - INICIO"
            # Entorno MSVC (vcvars64) importado ANTES de anteponer .cargo\bin y
            # Ninja, para que vcvars no los desplace del PATH. Lo exige Ninja
            # (el generador Visual Studio cargaba INCLUDE/LIB por su cuenta).
            $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $VsPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $VsPath) { throw "vswhere no encontró una instalación con MSVC x64" }
            $VcVars = "$VsPath\VC\Auxiliary\Build\vcvars64.bat"
            cmd /c "call `"$VcVars`" >nul 2>&1 && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($Matches[1])" -Value $Matches[2] }
            }
            # CC/CXX = ruta absoluta de cl.exe: solo así el crate `cc` usa
            # RUSTC_WRAPPER=sccache como wrapper en MSVC.
            $Cl = (Get-Command cl.exe -ErrorAction Stop).Source
            $env:CC = $Cl
            $env:CXX = $Cl
            $env:PATH = "$env:TEMP\ninja;$env:USERPROFILE\.cargo\bin;$env:PATH"
            # PowerShell no tiene $BASH_ENV: activar sccache inline para este step.
            $env:RUSTC_WRAPPER = "sccache"
            $env:SCCACHE_DIR = "$env:USERPROFILE\.cache\sccache"
            # Solo en modo sonda (target/ frío): el servidor sccache, que arranca
            # con la primera compilación de este step, registra sus errores en un
            # log publicado como artefacto (cargo oculta la salida de los build scripts).
            if ("<< parameters.probe >>" -eq "true") {
              $env:SCCACHE_ERROR_LOG = "$PWD\sccache-error.log"
              $env:SCCACHE_LOG = "debug"
            }
            # Launcher sccache para CMake: exige el generador Ninja (el de
            # Visual Studio ignora los launchers). Ver native_sccache_setup_windows.
            $env:CMAKE_GENERATOR = "Ninja"
            $env:CMAKE_C_COMPILER_LAUNCHER = "sccache"
            $env:CMAKE_CXX_COMPILER_LAUNCHER = "sccache"
            Write-Host "cl: $Cl"
            Write-Host "ninja: $((Get-Command ninja.exe -ErrorAction Stop).Source)"
            Write-Host "cmake: $((Get-Command cmake.exe -ErrorAction Stop).Source)"
            cmake --version
            # El crate `ort` usa `load-dynamic`: no enlaza ONNX Runtime en
            # build-time (no hay ORT_LIB_PATH). La librería dinámica se descarga
            # y empaqueta junto al binario en el step de bundling siguiente.
            # --timings: desglose por crate en target/cargo-timings (artefacto).
            cargo build --release --features full --verbose --timings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sccache --show-stats
            Write-Host "[STEP] Compilar binario release (cargo build --release) - FIN"
      - store_artifacts:
          path: target/cargo-timings
          destination: cargo-timings
      - when:
          condition: << parameters.probe >>
          steps:
            - cmake_probe_diagnostics
            - store_artifacts:
                path: sccache-error.log
                destination: sccache-error-log
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            Write-Host "[STEP] Smoke test target/release/ai-voice-interconnector.exe - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            $Exe = "target\release\ai-voice-interconnector.exe"
            if (-not (Test-Path $Exe)) { throw "Binario no encontrado: $Exe" }
            & $Exe version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Contrato JSON determinista: `version --json` DEBE exponer name +
            # version + schema_version. Sin este gate un binario cuyo bump de
            # VERSION no se propagó (p.ej. editado a mano sin recompilar) pasa el
            # smoke de texto pero viola el contrato JSON y rompe consumidores.
            $jsonRaw = & $Exe version --json | Out-String
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            try { $j = $jsonRaw | ConvertFrom-Json } catch { throw "version --json no es JSON válido: $jsonRaw : $_" }
            if (-not $j.PSObject.Properties['version'] -or -not $j.version) { throw "version --json: campo 'version' ausente o vacío: $jsonRaw" }
            if (-not $j.PSObject.Properties['name'] -or $j.name -ne 'ai-voice-interconnector') { throw "version --json: campo 'name' incorrecto: $jsonRaw" }
            if (-not $j.PSObject.Properties['schema_version'] -or $j.schema_version -ne '4') { throw "version --json: campo 'schema_version' != '4': $jsonRaw" }
            $expectedTag = $env:CIRCLE_TAG; if ($expectedTag) { $expectedTag = $expectedTag.TrimStart('v'); if ($j.version -ne $expectedTag) { throw "version --json: version '$($j.version)' != CIRCLE_TAG '$expectedTag' (tag=$env:CIRCLE_TAG)" } }
            Write-Host "version --json OK: name=$($j.name) version=$($j.version) schema_version=$($j.schema_version)"
            # Valida que la voz de fábrica 'default' quede registrada en un
            # runner limpio (voice list no carga el modelo y auto-inicializa
            # el store). El CLI imprime '  - default (fábrica)': se compara por
            # prefijo con -like (nunca -notmatch sobre array: filtra en vez de
            # dar booleano).
            $voiceList = & $Exe voice list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($voiceList | Where-Object { $_ -like '  - default*' })) { throw "La voz de fábrica 'default' no está registrada" }
            Write-Host "Binario Windows OK: version + voice list + version --json"
            Write-Host "[STEP] Smoke test target/release/ai-voice-interconnector.exe - FIN"
      - sccache_save_cache:
          os: windows
          variant: full
      - unless:
          condition: << parameters.probe >>
          steps:
            - cargo_save_target:
                os: windows
                variant: full
                when: on_success
      - run:
          name: Generar .engine-cachekey (clave TTS)
          shell: bash
          command: |
            echo "[STEP] Generar .engine-cachekey - INICIO"
            # Agregado determinista: Makefile + fuentes C/H (incluye vendor/lz4) + ingot
            # Usa /usr/bin/find y /usr/bin/sort + xargs -r para evitar el find de Windows (System32) y ruido "File not found - *.c"
            cat vendor/qwen3-tts/Makefile > vendor/qwen3-tts/.engine-cachekey
            /usr/bin/find vendor/qwen3-tts -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' \) -print | /usr/bin/sort | /usr/bin/xargs -r cat >> vendor/qwen3-tts/.engine-cachekey 2>/dev/null || true
            /usr/bin/find vendor/qwen3-tts/vendor -type f \( -name '*.c' -o -name '*.h' \) -print | /usr/bin/sort | /usr/bin/xargs -r cat >> vendor/qwen3-tts/.engine-cachekey 2>/dev/null || true
            /usr/bin/find vendor/qwen3-tts/third_party/ingot -type f \( -name '*.c' -o -name '*.h' \) -print | /usr/bin/sort | /usr/bin/xargs -r cat >> vendor/qwen3-tts/.engine-cachekey 2>/dev/null || true
            echo "[STEP] Generar .engine-cachekey - FIN"
      - restore_cache:
          keys:
            - tts-v1-{{ arch }}-gcc<< pipeline.parameters.msys2_gcc_pin >>-ob<< pipeline.parameters.msys2_openblas_pin >>-{{ checksum "vendor/qwen3-tts/.engine-cachekey" }}
      - run:
          # Interfaz uniforme (los 4 SO): `xtask build-engine` compila el motor con
          # mingw32-make bajo el entorno MSYS2 UCRT64 (PATH ucrt64/bin + usr/bin,
          # MSYSTEM=UCRT64, leído de MSYS2_ROOT default C:\msys64) y verifica con
          # --self-test. Produce vendor\qwen3-tts\qwen_tts.exe fresco desde fuente.
          # El empaquetado de abajo lo consume.
          # Cacheado: si qwen_tts.exe existe tras restore (clave exacta sin fallback),
          # es fresco y solo se verifica; si no, build completo.
          name: Compilar y verificar motor TTS
          command: |
            Write-Host "[STEP] Compilar y verificar motor TTS - INICIO"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            $TtsExe = "vendor\qwen3-tts\qwen_tts.exe"
            if (Test-Path $TtsExe) {
              Write-Host "Motor TTS restaurado de caché; se ejecuta --self-test directo"
              & $TtsExe --self-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              cargo xtask build-engine --self-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Write-Host "[STEP] Compilar y verificar motor TTS - FIN"
      - save_cache:
          key: tts-v1-{{ arch }}-gcc<< pipeline.parameters.msys2_gcc_pin >>-ob<< pipeline.parameters.msys2_openblas_pin >>-{{ checksum "vendor/qwen3-tts/.engine-cachekey" }}
          paths:
            - vendor/qwen3-tts/qwen_tts.exe
      - unless:
          condition: << parameters.probe >>
          steps:
            - restore_cache:
                keys:
                  - ort-v1-win-x64-<< pipeline.parameters.ort_pin >>
            - run:
                # Autocontención (requisito duro): el crate `ort` en `load-dynamic`
                # busca onnxruntime.dll junto al ejecutable. Se empaqueta la librería
                # oficial de Microsoft (ONNX Runtime << pipeline.parameters.ort_pin >>, pareja de ort rc.13) y sus
                # 3 DLLs del runtime VC++ (la dll de MS es /MD), de modo que el usuario
                # no necesite instalar el VC++ Redistributable ni nada previo.
                # Cacheado: si onnxruntime.dll existe tras restore, se omite descarga.
                name: Empaquetar ONNX Runtime + runtime VC++ (bundle load-dynamic)
                command: |
                  Write-Host "[STEP] Empaquetar ONNX Runtime + runtime VC++ - INICIO"
                  $ErrorActionPreference = "Stop"
                  $OrtVersion = "<< pipeline.parameters.ort_pin >>"
                  $Bundle = "ort-bundle"
                  if (-not (Test-Path "$Bundle\onnxruntime.dll")) {
                    if (Test-Path $Bundle) { Remove-Item -Recurse -Force $Bundle }
                    New-Item -ItemType Directory -Force -Path $Bundle | Out-Null
                    # 1. Librería dinámica oficial de Microsoft (win-x64).
                    $Zip = "onnxruntime-win-x64-$OrtVersion.zip"
                    $Url = "https://github.com/microsoft/onnxruntime/releases/download/v$OrtVersion/$Zip"
                    Invoke-WebRequest -Uri $Url -OutFile "$env:TEMP\$Zip"
                    Expand-Archive -Path "$env:TEMP\$Zip" -DestinationPath "$env:TEMP\ort-extract" -Force
                    $Dll = Get-ChildItem -Path "$env:TEMP\ort-extract" -Recurse -Filter "onnxruntime.dll" | Select-Object -First 1
                    if (-not $Dll) { throw "onnxruntime.dll no encontrada en $Zip" }
                    Copy-Item $Dll.FullName "$Bundle\onnxruntime.dll"
                    # 2. Runtime VC++ (app-local): la dll de MS es /MD y depende de estas 3.
                    #    onnxruntime-win-x64-1.28.0.zip ya no las incluye.
                    #    Se obtienen de System32 (Windows Server 2022 -> VC++ 2022 CRT compatible).
                    $Vc = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
                    foreach ($Name in $Vc) {
                      $Found = Get-ChildItem -Path "C:\Windows\System32" -Filter $Name -ErrorAction SilentlyContinue |
                               Select-Object -First 1
                      if (-not $Found) { throw "No se encontró $Name en System32" }
                      Copy-Item $Found.FullName "$Bundle\$Name"
                    }
                  } else {
                    Write-Host "Bundle ONNX Runtime restaurado de caché; se omite descarga"
                  }
                  Write-Host "Bundle ONNX Runtime + VC++:"
                  Get-ChildItem $Bundle | ForEach-Object { Write-Host "  $($_.Name)" }
                  Write-Host "[STEP] Empaquetar ONNX Runtime + runtime VC++ - FIN"
            - save_cache:
                key: ort-v1-win-x64-<< pipeline.parameters.ort_pin >>
                paths:
                  - ort-bundle
            - run:
                # Empaquetado canónico: `xtask package` monta el bundle desde
                # packaging/bundle-manifest.json (la misma lista que valida
                # `self install`) y aborta si VERSION != tag.
                name: Empaquetar bundle con xtask package
                command: |
                  Write-Host "[STEP] Empaquetar bundle con xtask package - INICIO"
                  $ErrorActionPreference = "Stop"
                  $env:PATH = "$env:USERPROFILE\\.cargo\\bin;$env:PATH"
                  $TagVersion = $env:CIRCLE_TAG -replace '^v',''
                  cargo xtask package --expect-version "$TagVersion"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Write-Host "[STEP] Empaquetar bundle con xtask package - FIN"
            - run:
                # Humo de instalación: instala el artefacto empaquetado en un
                # sandbox con las cuatro raíces reubicadas y comprueba que el
                # binario instalado arranca.
                name: Humo de instalación en sandbox (self install)
                command: |
                  Write-Host "[STEP] Humo de instalación en sandbox - INICIO"
                  $ErrorActionPreference = "Stop"
                  $Sandbox = Join-Path $env:TEMP ("avi-smoke-" + [guid]::NewGuid().ToString("N"))
                  $env:AVI_INSTALL_DIR = Join-Path $Sandbox "program"
                  $env:AVI_BIN_DIR = Join-Path $Sandbox "bin"
                  $env:AVI_DATA_DIR = Join-Path $Sandbox "data"
                  $env:AVI_CACHE_DIR = Join-Path $Sandbox "cache"
                  New-Item -ItemType Directory -Force -Path $env:AVI_INSTALL_DIR, $env:AVI_BIN_DIR, $env:AVI_DATA_DIR, $env:AVI_CACHE_DIR | Out-Null
                  $StageSmoke = Join-Path $Sandbox "stage"
                  New-Item -ItemType Directory -Force -Path $StageSmoke | Out-Null
                  $Zip = Get-Item artifacts\\ai-voice-interconnector-*-x86_64-windows.zip
                  Expand-Archive -Path $Zip.FullName -DestinationPath $StageSmoke -Force
                  & "$StageSmoke\\ai-voice-interconnector.exe" self install --no-setup --no-modify-path --yes
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  & "$env:AVI_INSTALL_DIR\\ai-voice-interconnector.exe" --version
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Remove-Item -Recurse -Force $Sandbox
                  Write-Host "[STEP] Humo de instalación en sandbox - FIN"
            - run:
                name: Emitir SHA-256 del artefacto
                command: |
                  Write-Host "[STEP] Emitir SHA-256 del artefacto - INICIO"
                  Get-FileHash artifacts\ai-voice-interconnector-*-x86_64-windows.zip -Algorithm SHA256
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Write-Host "[STEP] Emitir SHA-256 del artefacto - FIN"
            - persist_to_workspace:
                root: artifacts
                paths:
                  - ai-voice-interconnector-*-x86_64-windows.zip

  build-linux-x64:
    # Linux x64: el más barato/rápido para la suite, pero el build necesita
    # `large` (8 GB RAM): el linking de cpal + tokio + ct2rs (ort es
    # load-dynamic) supera los 4 GB de `medium` (OOM silencioso). `large` trae
    # 4 vCPU de regalo no aprovechados.
    docker:
      - image: cimg/rust:1.96.0@sha256:4ad3037ddf8d339118f7d5911d14395786b9da38b97553990306e34d7b137463 # digest del índice multi-arch de 1.96.0 (ver parameters.rust_pin)
    resource_class: large
    environment:
      # Sin estado incremental: sccache no lo cachea y no debe viajar en la caché de target/.
      CARGO_INCREMENTAL: "0"
    parameters:
      probe:
        type: boolean
        default: false
    steps:
      - checkout
      - run:
          # libclang-dev es requisito de bindgen (ct2rs, solo con native-translation), igual que en test-linux.
          # libopenblas-dev aporta /usr/include/openblas y -lopenblas que exige el
          # target `blas` del Makefile de qwen_tts en Linux.
          name: Instalar dependencias de sistema (libasound2-dev, cmake, pkg-config, libclang-dev, libopenblas-dev)
          command: |
            echo "[STEP] Instalar dependencias de sistema - INICIO"
            sudo apt-get update
            sudo apt-get install -y libasound2-dev cmake pkg-config libclang-dev libopenblas-dev
            echo "[STEP] Instalar dependencias de sistema - FIN"
      - unless:
          condition: << parameters.probe >>
          steps:
            - cargo_restore_caches:
                os: linux
                variant: full
                target: true
      - when:
          condition: << parameters.probe >>
          steps:
            - cargo_restore_caches:
                os: linux
                variant: full
                target: false
      - run:
          name: Precargar dependencias (cargo fetch)
          command: |
            echo "[STEP] Precargar dependencias (cargo fetch) - INICIO"
            cargo fetch --locked
            echo "[STEP] Precargar dependencias (cargo fetch) - FIN"
      - cargo_save_registry
      - sccache_restore_cache:
          os: linux
          variant: full
      - sccache_setup_unix
      - native_sccache_setup_unix
      - validate_pins
      - validate_features
      - run:
          name: Compilar binario release (cargo build --release)
          no_output_timeout: 25m
          command: |
            echo "[STEP] Compilar binario release (cargo build --release) - INICIO"
            # Solo en modo sonda (target/ frío): el servidor sccache, que arranca
            # con la primera compilación de este step, registra sus errores en un
            # log publicado como artefacto (cargo oculta la salida de los build scripts).
            if [ "<< parameters.probe >>" = "true" ]; then
              export SCCACHE_ERROR_LOG="$PWD/sccache-error.log" SCCACHE_LOG=debug
            fi
            # --timings: desglose por crate en target/cargo-timings (artefacto).
            cargo build --release --features full --verbose --timings
            echo "[STEP] Compilar binario release (cargo build --release) - FIN"
      - store_artifacts:
          path: target/cargo-timings
          destination: cargo-timings
      - when:
          condition: << parameters.probe >>
          steps:
            - cmake_probe_diagnostics
            - store_artifacts:
                path: sccache-error.log
                destination: sccache-error-log
      - run:
          name: Estadísticas de sccache (hit-rate)
          command: sccache --show-stats
      - run:
          name: Smoke test del binario (version + voces de fábrica)
          command: |
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - INICIO"
            test -x target/release/ai-voice-interconnector || (echo "Binario no encontrado" && exit 1)
            target/release/ai-voice-interconnector version
            # La versión del binario release debe coincidir con el tag; el
            # contrato JSON de `version --json` lo cubre el golden de la CLI.
            test "$(target/release/ai-voice-interconnector --version)" = "ai-voice-interconnector ${CIRCLE_TAG#v}" || { echo "versión del binario distinta del tag ${CIRCLE_TAG}" >&2; exit 1; }
            # Valida la voz de fábrica 'default' (runner limpio: voice list
            # auto-inicializa el store y no carga el modelo). Prefijo '^  - default'
            # tolera el sufijo '(fábrica)' del CLI Rust sin aceptar otras voces.
            # Captura previa en variable en lugar de tubería directa a `grep -q`:
            # `grep -q` sale en cuanto encuentra la coincidencia y cierra la
            # tubería; si el binario aún tiene líneas por escribir, esa
            # escritura devuelve EPIPE y `println!` hace panic (Rust ignora
            # SIGPIPE por defecto). Con `pipefail` eso tumbaba el paso de forma
            # intermitente (visto en v0.20.9, build-linux-x64).
            voice_list_out="$(target/release/ai-voice-interconnector voice list)"
            printf '%s\n' "$voice_list_out" | grep -q '^  - default'
            echo "Binario Linux x64 OK: version + voice list + versión del tag"
            echo "[STEP] Smoke test target/release/ai-voice-interconnector - FIN"
      - run:
          # Interfaz uniforme (los 4 SO): `xtask build-engine` oculta el mecanismo
          # por plataforma (make/mingw32-make, entorno MSYS2 en Windows), centraliza
          # la política SIMD (SIMD=auto -> Makefile) y compila + verifica (--self-test,
          # oráculo de kernels sin pesos) en un solo paso.
          name: Compilar y verificar motor TTS
          command: cargo xtask build-engine --self-test
      - unless:
          condition: << parameters.probe >>
          steps:
            - cargo_save_target:
                os: linux
                variant: full
                when: on_success
      - sccache_save_cache:
          os: linux
          variant: full
      - unless:
          condition: << parameters.probe >>
          steps:
            - run:
                # Empaquetado canónico: `xtask package` monta el bundle desde
                # packaging/bundle-manifest.json (la misma lista que valida
                # `self install`) y aborta si VERSION != tag.
                name: Empaquetar bundle con xtask package
                command: |
                  echo "[STEP] Empaquetar bundle con xtask package - INICIO"
                  set -euo pipefail
                  cargo xtask package --expect-version "${CIRCLE_TAG#v}"
                  echo "[STEP] Empaquetar bundle con xtask package - FIN"
            - run:
                # Humo de instalación: instala el artefacto empaquetado en un
                # sandbox con las cuatro raíces reubicadas y comprueba que el
                # binario instalado arranca.
                name: Humo de instalación en sandbox (self install)
                command: |
                  echo "[STEP] Humo de instalación en sandbox - INICIO"
                  set -euo pipefail
                  SANDBOX="$(mktemp -d)"
                  export AVI_INSTALL_DIR="$SANDBOX/program" AVI_BIN_DIR="$SANDBOX/bin" AVI_DATA_DIR="$SANDBOX/data" AVI_CACHE_DIR="$SANDBOX/cache"
                  mkdir -p "$AVI_INSTALL_DIR" "$AVI_BIN_DIR" "$AVI_DATA_DIR" "$AVI_CACHE_DIR"
                  STAGE_SMOKE="$(mktemp -d)"
                  tar -xzf artifacts/ai-voice-interconnector-*-x86_64-linux.tar.gz -C "$STAGE_SMOKE"
                  "$STAGE_SMOKE/ai-voice-interconnector" self install --no-setup --no-modify-path --yes
                  "$AVI_INSTALL_DIR/ai-voice-interconnector" --version
                  rm -rf "$SANDBOX" "$STAGE_SMOKE"
                  echo "[STEP] Humo de instalación en sandbox - FIN"
            - run:
                name: Emitir SHA-256 del artefacto
                command: |
                  echo "[STEP] Emitir SHA-256 del artefacto - INICIO"
                  sha256sum artifacts/ai-voice-interconnector-*-x86_64-linux.tar.gz
                  echo "[STEP] Emitir SHA-256 del artefacto - FIN"
            - persist_to_workspace:
                root: artifacts
                paths:
                  - ai-voice-interconnector-*-x86_64-linux.tar.gz

