[package]
name = "avi-lifecycle"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
# Puntos de inyeccion de fallo que solo se activan en los builds de prueba.
# El binario distribuido se construye sin este feature, de modo que no
# contiene forma de provocar un fallo a proposito.
faults = []

[dependencies]
# Fuente unica de rutas y de recursos del producto. Aporta `hf-hub`, que es
# exactamente lo que impide que `xtask` dependa de el: los tipos del manifiesto
# de bundle viven en `avi-shared` (crate puro) y no en este crate.
avi-store = { path = "../avi-store" }
# Tipos del bundle y parseo del manifiesto (fuente única del ciclo 4, sin red).
avi-shared = { path = "../avi-shared" }
# Identidad de proceso (hora de creación e imagen) que el pidfile registra.
avi-process = { path = "../avi-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
# `setup` se traslada como funcion asincrona; el binario ya compila `full` en el
# mismo lockfile, asi que no anade trabajo de compilacion.
tokio = { version = "1.35", features = ["full"] }
# El parseo de la CLI se queda en el binario principal: este crate no depende
# de `clap`.
# Cliente HTTPS de `self update`. `rustls-tls` evita OpenSSL del sistema
# (compila igual en los cuatro targets); `system-proxy` respeta `HTTPS_PROXY`,
# `NO_PROXY` y el proxy del sistema en Windows; `stream` descarga a disco sin
# cargar el archivo entero en memoria. Sin `default-features` para no arrastrar
# `native-tls`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
# SHA-256 para verificar el archivo descargado contra `SHA256SUMS.txt`, sin
# firma digital.
sha2 = "0.11"
# Extracción del bundle descargado: `.zip` en Windows, `.tar.gz` en Unix.
# `zip` va sin `default-features` y solo con `deflate` por `flate2` (Rust puro,
# sin zopfli/bzip2/zstd/lzma): `deflate-flate2` abre los caminos de código y
# `flate2` aporta la dependencia con su backend por defecto.
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
tar = "0.4"
flate2 = "1.0"
# Identidad de archivo para medir tamaños: los enlaces duros de la caché de
# modelos en Windows no deben contarse dos veces.
same-file = "1"

[dev-dependencies]
# Las pruebas del crate afirman el código de salida de cada `reason` con la tabla
# única `ExitCode::from_reason` de `avi-core`, en lugar de guardar un entero propio
# en el error.
avi-core = { path = "../avi-core" }

[target.'cfg(windows)'.dependencies]
# Acceso directo a `HKCU\Environment` para la integracion de PATH: se accede con
# `windows-sys` para no arrastrar un envoltorio de registro adicional.
# `Win32_System_Threading` se anade para el barrido de temporales: sin el,
# "¿este PID sigue vivo?" no tiene respuesta en Windows y el barrido borraria
# temporales de un proceso vivo. Es una feature de una dependencia ya declarada,
# no una dependencia nueva.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# Enlace simbolico, permisos y deteccion de privilegios elevados.
libc = "0.2"
