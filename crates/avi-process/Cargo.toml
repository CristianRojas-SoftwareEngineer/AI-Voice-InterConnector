[package]
name = "avi-process"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Primitivas de procesos del sistema operativo: flags de creación y borrado diferido"

[dependencies]
anyhow = "1.0"
# Limpieza de mejor esfuerzo con aviso (`best_effort`).
avi-shared = { path = "../avi-shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Viveza y muerte exactas de PID en Unix: `libc::kill` directo, sin lanzar el
# ejecutable `kill` externo. En macOS, además, `proc_pidinfo` da la identidad
# del proceso sin lanzar `ps`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Único crate que fija flags de creación de procesos: el resto del repositorio
# las importa de aquí con los nombres oficiales de `windows-sys`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
# Despacho temprano del limpiador: la copia relanzada debe trabajar antes de
# `main` (también antes del arnés de pruebas), sin depender del binario que
# la lanzó. Solo se usa bajo `cfg(windows)`, en `deferred.rs`.
ctor = "1.0"

[dev-dependencies]
tempfile = "3"
