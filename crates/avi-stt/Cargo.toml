[package]
name = "avi-stt"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
# Bindings de ONNX Runtime vía el crate `ort` en modo `load-dynamic`: no enlaza
# nada en build-time; carga la librería dinámica (`onnxruntime.dll` / `.so` /
# `.dylib`) en runtime desde el directorio del binario. CT2 (ct2rs) vive solo
# en avi-translation. `ort =2.0.0-rc.13` apareja con ONNX Runtime 1.28, cuya
# librería se empaqueta junto al binario en los artefactos de release. Opcional
# tras el feature `native-stt` (off por default): así `cargo test`/`cargo
# llvm-cov` compilan el crate sin ONNX Runtime; los builds de release lo activan
# para conservar el motor real.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"], optional = true }
avi-core = { path = "../avi-core" }
# Directorio real del programa, donde el bundle trae la librería de ONNX
# Runtime aunque la app se invoque desde su symlink.
avi-shared = { path = "../avi-shared" }
anyhow = "1.0"

[features]
# Activa el motor STT real (ort → onnxruntime dinámico vía `load-dynamic`).
native-stt = ["dep:ort"]

[dev-dependencies]
# Normalización de WAV a PCM 16 kHz mono, reutilizado por el test de paridad
# de ParakeetEngine.
avi-audio = { path = "../avi-audio" }
# Resolución de los modelos por la raíz de modelos (`models_cache_dir()`).
avi-store = { path = "../avi-store" }
# Trait `SttEngine` en scope para el benchmark de latencia/calidad opt-in
# (`crates/avi-stt/tests/benchmark_latency.rs`, marcado `#[ignore]`).
avi-core = { path = "../avi-core" }
