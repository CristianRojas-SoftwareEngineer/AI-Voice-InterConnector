[package]
name = "avi-stt"
version = "0.1.0"
edition = "2021"

[dependencies]
# Backend CPU por defecto de ct2rs es `ruy` (bundled, sin dependencias externas).
# NO se activa la feature `openblas`: en Windows exige vcpkg, evitado en este run (decisión F0).
# `whisper` habilita el transcriptor `ct2rs::Whisper` (mel_spec + ndarray) usado por el
# test de carga del modelo Whisper CT2 y, en la Fase 3, por el motor STT real.
ct2rs = { version = "0.10.0", features = ["whisper"] }

[dev-dependencies]
# Lectura del WAV fixture (mono 16 kHz) que alimenta el test de carga de Whisper.
hound = "3.5"
