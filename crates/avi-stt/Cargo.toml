[package]
name = "avi-stt"
version = "0.1.0"
edition = "2021"

[dependencies]
# Bindings de whisper.cpp (sin features GPU: CPU-only por default). Reemplaza a
# ct2rs::Whisper como motor STT; CT2 permanece solo en avi-translation.
whisper-rs = "0.16"
avi-core = { path = "../avi-core" }
anyhow = "1.0"

[dev-dependencies]
# Lectura del WAV fixture (mono 16 kHz) que alimenta el test de carga de Whisper.
hound = "3.5"
# Normalización de WAV a PCM 16 kHz mono, reutilizada por el test de paridad
# de Ct2SttEngine contra el oráculo Python.
avi-audio = { path = "../avi-audio" }
