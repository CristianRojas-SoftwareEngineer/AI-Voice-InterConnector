[package]
name = "avi-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
cpal = "0.18"
hound = "3.5"
rubato = "0.16"
serde_json = "1.0"

# Los bindings de ALSA que usa `cpal` en Linux, en la copia vendorizada que
# carga la librería en tiempo de ejecución: permiten comprobar que existe antes
# de crear el host de audio.
[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.4"

[features]
# Expone helpers de prueba (WAV de frecuencia nula) a las pruebas del binario.
test-support = []

[dev-dependencies]
# Solo para los tests: WAV temporales con dueño que se borran al soltarse.
tempfile = "3"
