[package]
name = "denoise"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
# Crate trasplantado desde el repositorio Denoise (MIT), que sigue siendo su
# fuente de verdad mientras dure la migración. El aviso Apache-2.0 del modelo
# DPDFNet vive en `src/models.rs`.
license = "MIT"
description = "Limpieza de ruido DPDFNet ONNX para la pista de audio de audio y vídeo (trasplante de Denoise 1.0.0)."

[lib]
name = "denoise"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Adaptación de trasplante: el origen enlaza ORT estático
# (`copy-dylibs`/`download-binaries`), que exige el CRT dinámico y no enlaza en
# este workspace (Windows compila con `+crt-static` por CTranslate2). Se usa la
# configuración de ORT del workspace: la librería se carga en ejecución desde
# `ORT_DYLIB_PATH`, que la resuelve el bundle de AVI. La fase siguiente sustituye
# esta carga implícita por el módulo compartido `avi-shared::onnx_runtime`, que
# es quien debe resolver directorio a fichero y cargar la librería una sola vez
# por proceso.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "preload-dylibs"] }
# Carga única de ONNX Runtime (`avi_shared::onnx_runtime`): la sesión DPDFNet la
# invoca antes de `Session::builder()`, de modo que STT y DPDFNet comparten un
# solo inicializador por proceso en vez de cada crate resolver la librería por
# su cuenta.
avi-shared = { path = "../avi-shared", features = ["native-ort"] }
# Caché y verificación únicas del artefacto provisionado por `setup`: el crate
# no descarga ni mantiene un directorio de modelos propio.
avi-store = { path = "../avi-store" }
rustfft = "6"
hound = "3"
indicatif = "0.17"
which = "4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
anyhow = "1"
sha2 = "0.10"
