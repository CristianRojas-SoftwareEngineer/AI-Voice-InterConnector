[package]
name = "denoise"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
# Crate de limpieza de ruido (MIT). El aviso Apache-2.0 del modelo DPDFNet vive
# en `src/models.rs`.
license = "MIT"
publish = false
description = "Limpieza de ruido DPDFNet ONNX para la pista de audio de audio y vídeo."

[lib]
name = "denoise"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# ORT usa la configuración del workspace (`load-dynamic`): la librería se carga
# en ejecución desde `ORT_DYLIB_PATH`, que la resuelve el bundle de AVI, y el
# módulo compartido `avi_shared::onnx_runtime` la carga una sola vez por
# proceso. El enlace estático de ORT exige el CRT dinámico y no enlaza en este
# workspace (Windows compila con `+crt-static` por CTranslate2).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "preload-dylibs"] }
# Carga única de ONNX Runtime (`avi_shared::onnx_runtime`): la sesión DPDFNet la
# invoca antes de `Session::builder()`, de modo que STT y DPDFNet comparten un
# solo inicializador por proceso en vez de cada crate resolver la librería por
# su cuenta.
avi-shared = { path = "../avi-shared", features = ["native-ort"] }
# Caché y verificación únicas del artefacto provisionado por `setup`: el crate
# no descarga ni mantiene un directorio de modelos propio.
avi-store = { path = "../avi-store" }
# Autoridad antialias de conversión PCM interna (16/24/48 kHz) para el
# adaptador de servicio; DPDFNet exige 48 kHz y STT 16 kHz.
avi-audio = { path = "../avi-audio" }
# Errores de la CLI (`CliError` y sus códigos) y presentación en terminal
# (etapas, duraciones y líneas de aviso) compartidos con el resto de la CLI.
avi-core = { path = "../avi-core" }
avi-term = { path = "../avi-term" }
rustfft = "6"
hound = "3"
which = "4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
# Expone la guarda que serializa las pruebas que comparten el registro de
# ejecución.
avi-term = { path = "../avi-term", features = ["test-support"] }
anyhow = "1"
sha2 = "0.10"
