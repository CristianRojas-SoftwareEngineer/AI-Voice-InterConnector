[package]
name = "avi-shared"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Fuente única pura del bundle, las rutas y los pines (sin red ni TLS)"

[dependencies]
# Viveza exacta de PID para que la poda de `logs` conserve el log de un proceso
# vivo; la primitiva vive en `avi-process` (única fuente de las operaciones de
# proceso del sistema).
avi-process = { path = "../avi-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"

[target.'cfg(windows)'.dependencies]
# Arranque de consola en UTF-8 (`console`): solo Windows, Unix sigue puro.
# `Win32_Foundation` lo exige el BOOL que devuelven las fijaciones.
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Globalization"] }
