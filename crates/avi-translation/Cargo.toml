[package]
name = "avi-translation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Backend oneDNN + OpenMP (sin ruy): replica la configuración del wheel de
# Python y es ~2.4x más rápido que ruy en CPU. Verificada por benchmarks.
ct2rs = { version = "0.10.0", default-features = false, features = ["sentencepiece", "tokenizers", "openmp-runtime-comp", "dnnl"] }
avi-core = { path = "../avi-core" }
anyhow = "1.0"

[dev-dependencies]
# Lectura del corpus de paridad contra el oráculo Python (pares {input, expected}
# en JSON generados por el pipeline de traducción del oráculo).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
