[package]
name = "avi-translation"
version = "0.1.0"
edition = "2021"

[dependencies]
avi-core = { path = "../avi-core" }
anyhow = "1.0"

# Backend oneDNN + OpenMP COMP (sin ruy): replica la configuración del wheel
# de Python y es ~2.4x más rápido que ruy en CPU. Verificada por benchmarks.
# En Linux, ct2rs fuerza COMP igualmente cuando dnnl está activo (build.rs);
# en Windows, COMP usa el runtime de MSVC (vcomp) sin link explícito.
# Declarado en secciones por-target porque una misma dependencia en
# [dependencies] + [target...] UNIFICA features y macOS heredaría COMP.
# `optional = true` tras el feature `native-translation` (off por defecto): así
# `cargo test`/`cargo llvm-cov` compilan el crate sin CTranslate2/oneDNN (el peor
# coste de compilación del pipeline); los builds de release lo activan para
# conservar el motor real (ver plan R1).
[target.'cfg(not(target_os = "macos"))'.dependencies]
ct2rs = { version = "0.10.0", optional = true, default-features = false, features = ["sentencepiece", "tokenizers", "openmp-runtime-comp", "dnnl"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS SIN openmp-runtime-comp → OPENMP_RUNTIME=NONE: los runners CI con
# Apple clang no traen libomp y find_package(OpenMP REQUIRED) de CTranslate2
# falla (pipeline #2/#4). Compilar sin OpenMP solo desactiva el paralelismo
# intra-operador (resultados idénticos); re-evaluar con brew libomp si el
# rendimiento en macOS lo exige.
ct2rs = { version = "0.10.0", optional = true, default-features = false, features = ["sentencepiece", "tokenizers", "dnnl"] }

[features]
# Activa el motor de traducción real (ct2rs → CTranslate2 + oneDNN).
native-translation = ["dep:ct2rs"]

[dev-dependencies]
# Lectura del corpus de paridad contra el oráculo Python (pares {input, expected}
# en JSON generados por el pipeline de traducción del oráculo).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Resolución HF cache `hf_cache_dir()/ct2` para tests sin path legado `models/ct2` CWD.
avi-store = { path = "../avi-store" }
