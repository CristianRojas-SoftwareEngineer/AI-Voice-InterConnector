[package]
name = "avi-translation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Sin features adicionales inicialmente: `Translator` (Marian) y el tokenizador
# SentencePiece embebido son parte de las features por defecto de ct2rs (la
# feature `whisper` de avi-stt es exclusiva del transcriptor Whisper).
ct2rs = "0.10.0"
avi-core = { path = "../avi-core" }
anyhow = "1.0"
