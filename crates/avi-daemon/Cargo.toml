[package]
name = "avi-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7"
avi-core = { path = "../avi-core" }
avi-store = { path = "../avi-store" }
avi-stt = { path = "../avi-stt" }
avi-tts = { path = "../avi-tts" }
avi-translation = { path = "../avi-translation", optional = true }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Activa la superficie STT del daemon; encadena el motor Parakeet de avi-stt.
native-stt = ["avi-stt/native-stt"]
# Activa la superficie de traducción CT2 residente; encadena el motor Ct2 de avi-translation.
native-translation = ["avi-translation/native-translation"]

[dev-dependencies]
# Solo para el harness de tests dorados: permite ejercitar el Router de Axum
# sin abrir un socket TCP real (tower::ServiceExt::oneshot).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Normalización de WAV a PCM 16 kHz mono para el test dorado de audio largo.
avi-audio = { path = "../avi-audio" }
