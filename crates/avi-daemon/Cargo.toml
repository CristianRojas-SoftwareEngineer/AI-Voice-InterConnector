[package]
name = "avi-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7"
avi-core = { path = "../avi-core" }
avi-store = { path = "../avi-store" }
avi-stt = { path = "../avi-stt" }
avi-tts = { path = "../avi-tts" }
base64 = "0.22"
# VAD Silero para segmentar audio largo (mismo crate que usa avi-stt, sin
# dependencias nuevas en el árbol). Opcional tras `native-stt` (off por defecto):
# la superficie STT/VAD del daemon (`/transcribe`) solo se compila con el feature,
# dejando el resto de rutas (TTS/voces/store) sin whisper.cpp en los tests.
whisper-rs = { version = "0.16", optional = true }

[features]
# Activa la superficie STT/VAD del daemon; encadena el motor real de avi-stt.
native-stt = ["dep:whisper-rs", "avi-stt/native-stt"]

[dev-dependencies]
# Solo para el harness de tests dorados: permite ejercitar el Router de Axum
# sin abrir un socket TCP real (tower::ServiceExt::oneshot).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Normalización de WAV a PCM 16 kHz mono para el test dorado de audio largo.
avi-audio = { path = "../avi-audio" }
