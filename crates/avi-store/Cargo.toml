[package]
name = "avi-store"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0"
# Fuente única de rutas, temporales y revisiones de modelos: este
# crate conserva su API reexportándola, sin red añadida.
avi-shared = { path = "../avi-shared" }
# Token de propietario del proceso para nombrar temporales y stagings.
avi-process = { path = "../avi-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hound = "3"
# Descargador nativo de modelos HF: layout de caché estándar (la ubicación la fija
# `models_cache_dir()`) y ETag; no reanuda descargas parciales. rustls evita
# OpenSSL nativo (compila igual en Windows x64, Linux x64/arm64 y macOS arm64).
# La versión es exacta porque es la que parchea la copia vendorizada del raíz.
hf-hub = { version = "=1.0.0", default-features = false, features = ["rustls-tls"] }
# Solo para el `connect_timeout` del cliente propio que se inyecta a `hf-hub`:
# sin features, no suma nada a la unión ya compilada (TLS lo aporta `hf-hub`).
reqwest = { version = "0.13", default-features = false }
tracing = "0.1"

[dev-dependencies]
# Prueba de integración del layout de caché de hf-hub: comprueba que el puntero
# de `snapshots/` y su blob son el mismo archivo (enlace duro en Windows,
# symlink en Unix).
same-file = "1"
# Directorios de trabajo de las pruebas con dueño: se borran al soltarse.
tempfile = "3"
# Servidor HTTP local de la prueba; `net` e `io-util` no los activa la
# dependencia normal.
tokio = { version = "1.35", features = ["rt", "macros", "net", "io-util"] }
