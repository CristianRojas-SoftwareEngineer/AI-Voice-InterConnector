[package]
name = "avi-term"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "Núcleo de presentación en terminal: paleta, formatos, línea de fase y etapas"

[target.'cfg(windows)'.dependencies]
# Arranque de consola en UTF-8 y activación de las secuencias ANSI (`line`,
# `style`): solo Windows, Unix sigue puro. `Win32_Foundation` lo exige el BOOL
# que devuelven las fijaciones.
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Globalization"] }
