[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "Tareas de desarrollo (generación de Cask, SOURCE-OFFER, licencias, limpieza)"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
regex = "1.10"
serde_json = "1.0"
# Tipos del bundle y pines desde la fuente única, sin red ni TLS.
avi-shared = { path = "../avi-shared" }
# Primitivas de proceso compartidas con el producto, sin red.
avi-process = { path = "../avi-process" }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
# Temporales con dueño: se borran al soltarse, por cualquier camino de salida.
tempfile = "3"
# Verificación del SHA-256 fijado del asset de ONNX Runtime (misma versión que
# ya usa `avi-lifecycle`, sin crates nuevos en el lockfile).
sha2 = "0.11"
# Versión vigente del envelope `--json` de la CLI, que `pins --check` compara
# con la que exige el humo del pipeline.
avi-core = { path = "../avi-core" }
# Lectura de ELF, Mach-O y PE para la auditoría de dependencias del bundle
# (`xtask deps`): librerías importadas, versiones de símbolos y versión mínima
# de macOS, igual en local que en la CI. Solo lectura, sin escritura de objetos.
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }

[dev-dependencies]
# Envejecer un directorio para probar el discriminante de antigüedad de la
# poda fina. Es la misma versión que ya usa `tar` en el lockfile, así que el
# inventario de licencias no cambia.
filetime = "0.2"
