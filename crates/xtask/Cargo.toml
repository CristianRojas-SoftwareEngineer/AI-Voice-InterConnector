[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Tareas de desarrollo (generación de Cask, SOURCE-OFFER, licencias, limpieza)"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
regex = "1.10"
serde_json = "1.0"
# Tipos del bundle y pines desde la fuente única (ciclo 4, sin red ni TLS).
avi-shared = { path = "../avi-shared" }
# Primitivas de proceso compartidas con el producto, sin red.
avi-process = { path = "../avi-process" }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
