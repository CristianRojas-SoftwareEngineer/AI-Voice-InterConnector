[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Tareas de desarrollo (generación de Cask, SOURCE-OFFER, licencias, limpieza)"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
regex = "1.10"
serde_json = "1.0"
directories = "5.0"

[dev-dependencies]
# Solo para fijar la paridad de rutas de `clean` con el producto.
avi-store = { path = "../avi-store" }
