[package]
name = "ai-voice-interconnector"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ctrlc = "3.4"
avi-core = { path = "crates/avi-core" }
avi-audio = { path = "crates/avi-audio" }
avi-tts = { path = "crates/avi-tts" }
avi-store = { path = "crates/avi-store" }
avi-daemon = { path = "crates/avi-daemon" }
avi-stt = { path = "crates/avi-stt" }
avi-translation = { path = "crates/avi-translation" }
# Cliente HTTP async del CLI para el dispatch 3-modos contra el daemon (T7).
# `default-features = false` preserva el cliente ligero (HTTP sin TLS, suficiente
# para localhost); el daemon expone solo rutas HTTP en 127.0.0.1:8765.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }

[dev-dependencies]
hound = "3"
avi-stt = { path = "crates/avi-stt" }

[patch.crates-io]
cmake = { path = "vendor/cmake-0.1.58" }
