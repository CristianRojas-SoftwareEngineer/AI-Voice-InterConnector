[package]
name = "ai-voice-interconnector"
version = "0.28.0"
edition = "2021"
license = "GPL-3.0-or-later"
# `cargo run` sin --bin: el binario canónico es el CLI (xtask es tooling).
default-run = "ai-voice-interconnector"

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3.4"
avi-core = { path = "crates/avi-core" }
avi-audio = { path = "crates/avi-audio" }
avi-tts = { path = "crates/avi-tts" }
avi-store = { path = "crates/avi-store" }
avi-daemon = { path = "crates/avi-daemon" }
avi-process = { path = "crates/avi-process" }
avi-stt = { path = "crates/avi-stt" }
avi-translation = { path = "crates/avi-translation" }
# Motor del ciclo de vida del usuario: `self install`, `self uninstall`,
# `cleanup` y la sección de ciclo de vida de `doctor`. **Sin el feature `faults`**,
# que solo se activa en los builds de prueba de más abajo, de modo que el binario
# distribuido no contiene el punto de inyección de fallo.
avi-lifecycle = { path = "crates/avi-lifecycle" }
# Arranque de consola en UTF-8 compartido con `xtask` (`force_utf8_console`).
avi-shared = { path = "crates/avi-shared" }
# Cliente HTTP async del CLI para el dispatch 3-modos contra el daemon.
# `default-features = false` preserva el cliente ligero (HTTP sin TLS, suficiente
# para localhost); el daemon expone solo rutas HTTP en 127.0.0.1:8765.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
# Descargador nativo de modelos desde HuggingFace Hub: maneja el layout de caché
# (la ubicación la fija `models_cache_dir()`) y la validación ETag; no reanuda
# descargas parciales. `rustls` evita OpenSSL nativo: compila igual en Windows
# x64, Linux x64/arm64 y macOS arm64 (4 targets de distribución). La versión es
# exacta porque es la que parchea la copia vendorizada de `[patch.crates-io]`.
hf-hub = { version = "=1.0.0", default-features = false, features = ["rustls-tls"] }
indicatif = "0.17"
chrono = "0.4"
anyhow = "1.0"

[features]
# Features de workspace (todos off por defecto): encadenan los features nativos
# de cada crate. `cargo test`/`cargo llvm-cov` corren lisos (sin C++); los builds
# de distribución activan `full` para conservar STT + traducción.
native-stt = ["avi-stt/native-stt", "avi-daemon/native-stt"]
native-translation = ["avi-translation/native-translation", "avi-daemon/native-translation"]
full = ["native-stt", "native-translation"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }
# `winreg` no es dependencia: la reversión del `PATH` en Windows la lleva el
# módulo `path_windows` del motor de ciclo de vida, que accede a `HKCU\Environment`
# directamente con la biblioteca de sistema `windows-sys`, sin envoltorio de
# registro adicional.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hound = "3"
avi-stt = { path = "crates/avi-stt" }
# Solo para los tests: expone el generador de WAV de frecuencia nula.
avi-audio = { path = "crates/avi-audio", features = ["test-support"] }
# Solo para los tests: habilita el feature `faults` del motor, de modo que
# `cargo test --all` disponga del punto de inyección de fallo sin que
# `cargo build --release` lo lleve.
avi-lifecycle = { path = "crates/avi-lifecycle", features = ["faults"] }

[patch.crates-io]
cmake = { path = "vendor/cmake-0.1.58" }
# hf-hub crea en Windows cada puntero de `snapshots/` copiando el blob, lo que
# duplica en disco cada modelo; la copia vendorizada usa un enlace duro (con
# copia como alternativa donde el sistema de archivos no lo admite).
hf-hub = { path = "vendor/hf-hub-1.0.0" }
