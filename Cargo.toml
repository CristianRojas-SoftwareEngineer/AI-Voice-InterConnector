[package]
name = "ai-voice-interconnector"
version = "0.18.4"
edition = "2021"
# `cargo run` sin --bin: el binario canónico es el CLI (xtask es tooling).
default-run = "ai-voice-interconnector"

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ctrlc = "3.4"
avi-core = { path = "crates/avi-core" }
avi-audio = { path = "crates/avi-audio" }
avi-tts = { path = "crates/avi-tts" }
avi-store = { path = "crates/avi-store" }
avi-daemon = { path = "crates/avi-daemon" }
avi-stt = { path = "crates/avi-stt" }
avi-translation = { path = "crates/avi-translation" }
# Cliente HTTP async del CLI para el dispatch 3-modos contra el daemon (T7).
# `default-features = false` preserva el cliente ligero (HTTP sin TLS, suficiente
# para localhost); el daemon expone solo rutas HTTP en 127.0.0.1:8765.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
# Descargador nativo de modelos desde HuggingFace Hub (plan descargador-nativo):
# maneja cache en ~/.cache/huggingface/hub, resume por Range y validación ETag.
# `rustls` evita OpenSSL nativo: compila igual en Windows x64, Linux x64/arm64 y
# macOS arm64 (4 targets de distribución).
hf-hub = { version = "1.0", default-features = false, features = ["rustls-tls"] }
indicatif = "0.17"
chrono = "0.4"
anyhow = "1.0"

[features]
# Features de workspace (todos off por defecto): encadenan los features nativos
# de cada crate. `cargo test`/`cargo llvm-cov` corren lisos (sin C++); los builds
# de distribución activan `full` para conservar STT + traducción (ver plan R1).
native-stt = ["avi-stt/native-stt", "avi-daemon/native-stt"]
native-translation = ["avi-translation/native-translation"]
full = ["native-stt", "native-translation"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

[dev-dependencies]
hound = "3"
avi-stt = { path = "crates/avi-stt" }

[patch.crates-io]
cmake = { path = "vendor/cmake-0.1.58" }
